site_name: NanoSoC Ethernet Chiplet
site_description: >-
  Working documentation for the NanoSoC Ethernet Chiplet — the Cadence
  Genus/Innovus tapeout flow, its scripts line by line, and the design,
  verification and bring-up record behind them.
site_author: SoC Labs

# No public site URL is claimed here. Set site_url once the docs are actually
# published somewhere; Read the Docs injects the canonical URL itself.
repo_url: https://github.com/SoC-Labs/NanoSoC-Ethernet-Chiplet
repo_name: SoC-Labs/NanoSoC-Ethernet-Chiplet
edit_uri: ""

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

# Report bad internal links loudly. These pages cross-reference each other
# heavily and a silently-dead link is worse than a build failure.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

