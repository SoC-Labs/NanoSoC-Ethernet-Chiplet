# PROVEN BEFORE PROPOSED. ASIC/gls-netlist/docs/proposed/prove_draft.py extracts
# the `check:` text OUT OF THIS FILE (it does not carry a second copy of it --
# this repo has been bitten by duplicate copies of the same source enough times)
# and runs it against every fixture in the same sandbox `scripts/ci/signoff.py
# prove` builds. Run it before landing:
#
#     python3 ASIC/gls-netlist/docs/proposed/prove_draft.py
#
# The design note is docs/tapeout/57-cpu0-boot-on-the-routed-netlist.md and the
# CPU0-side open item is docs/tapeout/evidence/57-cpu0-boot-verdicts.md.
#
# -----------------------------------------------------------------------------
# RECONCILED TO THE SHIPPED BENCH, 2026-08-19 16:30
#
# An earlier draft of this file graded 12 keys that
# ASIC/gls-netlist/bench/eth_chiplet_fp1505_cc.json DOES NOT EMIT. A gate that
# requires a key no bench declares fails for a reason that is not the design --
# which is the same disease, one turn of the wheel further on, as the in-tree
# stage that grades four keys and calls a published FAIL a pass. Every key in
# every list below was checked, one at a time, against that bench file. The
# key-by-key reconciliation is in section RECONCILIATION at the foot of this
# header.
#
# -----------------------------------------------------------------------------
# WHAT CHANGED vs THE STAGE IN TREE, AND WHY
#
#  1. THE IN-TREE CHECK PASSES A PUBLISHED FAILURE. Not "the eth half is
#     ungraded" -- worse. It asserts four cc_rom keys and nothing else, and
#     build/gls-netlist/full0814_cc/verdict.txt (published to
#     ASIC/eth-chiplet/build/full-20260814/reports/gls/full0814_cc/verdict.txt)
#     reads `RESULT FAIL pass=10 fail=4` with all four of those keys PASS. Both
#     eth rungs -- eth_rom_port.accessed/.data_nonx and
#     eth_rom_msp_on_Q/eth_rom_rstvec_on_Q -- are red. The gate returns success
#     on a run whose own RESULT line says FAIL, printing that RESULT into the
#     log on its way past. A live false green.
#     Fixtures: fail-full0814-published (that verdict, verbatim), fail-eth-rom-red.
#
#     THE GENERALISATION, which is the part that keeps it fixed: this check does
#     not grade a list and ignore the rest. EVERY RED ROW in the verdict must be
#     either a rung this stage grades (and then it fails, naming the rung) or a
#     row on the KNOWN_OPEN register (and then it warns, naming the open item
#     and the evidence). A red row that is neither FAILS THE STAGE, so the next
#     rung somebody adds to the bench cannot go red unnoticed.
#     Fixture: fail-ungraded-rung-red.
#
#  2. CPU0 IS RELEASED BY CPU1, NOT BY THE BENCH, SO THE STAGE GRADES A BOOT AND
#     NOT A FETCH. The shipped bench has NO `forces` key at all; there is a QSPI
#     flash model bound onto the pads and CPU1's stage-0 walks its whole boot --
#     attempt counter, XiP bring-up, mailbox publish, boot table, image copy,
#     CRC -- and writes the bootgate itself. MODE is `full_handshake` and
#     ALLOWED_FORCES is empty.
#
#     Measured on the fp1505 routed netlist, 2026-08-19 12:46, published at
#     ASIC/eth-chiplet/build/fp1505/reports/gls/fp1505_cc/: FORCES 0, QSPI
#     addressed at 47.590 us, CPU1 in main() at 46.830 us, CPU1's own 250-word
#     IMEM copy and 21,141 instruction reads out of it, CPU0's ROM untouched at
#     1 ms, CPU0's MSP at 3.457830 ms, its reset vector at 3.457850 ms and its
#     branch target at 3.457870 ms.
#
#     THE FORCED BENCH STILL EXISTS, at bench/eth_chiplet_fp1505_forced.json. It
#     is NOT in GLSN_ITEMS, `make gls` never runs it, and it is reachable only
#     through `make -C ASIC/gls-netlist forced-fallback`. So `fetch_path_only`
#     REMAINS one of the three modes and remains proven -- prove_draft.py
#     rehearses it against ci/fixtures/gls-netlist/mode-fetch/* -- but it is not
#     what ships, and the declaration at the top of the check says so.
#
#  3. TWO ETH-SIDE RUNGS ARE ON A KNOWN-OPEN REGISTER, NOT SILENTLY DROPPED.
#     On the shipped flash image CPU0 boots, takes its reset vector, branches,
#     and then executes out of eth_rom -- and never completes its own image
#     copy. MEASURED 2026-08-19 at 302,000 cycles (6.04 ms, 1.75x past CPU0's
#     release) with the probe definitions verbatim:
#
#         eth_imem_write_after_release.accessed FAIL accesses=0
#         eth_imem_fetch.accessed               FAIL accesses=0
#         eth_sysctrl_remap_set                 FAIL never
#
#     A different, NO-LONGER-REBUILDABLE image did show all three fire
#     (docs/tapeout/evidence/57-cpu0-boot-verdicts.md SS A: 220 IMEM writes,
#     436,010 IMEM fetches, sysctrl REMAP at 5.484510 ms). So these are a REAL
#     OPEN ITEM on the eth firmware side, not a bad probe and not a bench gap.
#     A separate agent is diagnosing it.
#
#     They are therefore NOT REQUIRED, and their reason, their measurement and
#     the evidence path are carried in the check itself under KNOWN_OPEN, where
#     they print on every run. There is a RATCHET in the other direction: the
#     day one of them goes GREEN the stage FAILS, saying "this open item has
#     closed, move it into Tier C". An open-item register nobody ever closes is
#     how a gate stops asking.
#     Fixtures: pass-known-open-eth (they are red, the stage passes and warns),
#     fail-known-open-closed (one is green, the stage fails and says promote).
#
#  4. THE CYCLE BUDGET IS ASSERTED, BECAUSE A SHORT RUN AND A BROKEN DESIGN
#     PRODUCE THE SAME RED. `run_cycles` is 250,000 at a 20 ns reference clock:
#     the simulation ends at 5,000,000,000 ps, 5.000 ms. Anything that fires
#     later than that reads `FAIL never` -- a red that MEANS "the clock ran out"
#     and READS as "the design failed", and verdict.txt cannot tell the two
#     apart.
#
#     So: the latest rung this stage grades is eth_rom_branch_word62, measured
#     at 3,457,870,000 ps. The check reads `GLSN-EVENT: <t> run complete` out of
#     sim.log and REQUIRES t >= that, before it interprets any red. If the run
#     is shorter, the failure message says WINDOW TOO SHORT and names the
#     budget, not the design. If sim.log is missing the run length is UNKNOWN:
#     that is a warning while every late rung is green, and a hard failure the
#     moment one is red, because then nothing on disk can say which it was.
#     Fixtures: fail-window-too-short, fail-late-red-unknown-window.
#
#     THE HEADROOM IS PRINTED ON EVERY RUN: 5.000 ms declared against 3.457870
#     ms for the last graded rung leaves 1.542 ms - 30.8% of the window, 44.6%
#     beyond the rung itself, which is the figure the check prints because it
#     is the one that scales with the rung. And the number that
#     matters for the open item: eth_sysctrl_remap_set has only ever been seen
#     at 5,484,510,000 ps, which is 484,510,000 ps BEYOND the shipped window.
#     The shipped bench COULD NOT grade that rung even if the firmware fixed
#     itself, and the check says so rather than letting a future red be read as
#     a CRC rejection.
#
#  5. IT REFUSES THE TWO PROBES THAT CANNOT SEE. chip_core_remap_ctrl_w is a
#     4-bit bus of which THREE BITS HAVE NO DRIVER in the routed netlist, so it
#     traces as 0xZ even at the instant the bootgate rises, and any `===`
#     against a fully-defined 4-bit literal can never match. The shipped bench
#     has already dropped both, and traces bit 2 alone as an OBSERVATION. The
#     RETIRED register keeps them out: if either name comes back, the check
#     fails with a RE-SOURCE instruction rather than a handshake diagnosis.
#     Fixture: fail-unobservable-probe.
#
#  6. IT READS THE FORCE CENSUS OUT OF verdict.txt FIRST. gen_netlist_tb.py
#     writes, unconditionally and at time 0 so it survives a killed run:
#         FORCES <n> <prose>
#         FORCE <name> <signal> = <value> : <reason>      (one per force)
#     (grammar re-read in ASIC/asic-toolkit/flow/verify/gls/gen_netlist_tb.py
#     lines 51-62 and 440-462, and matched byte-for-byte against the published
#     `FORCES 0 no testbench override was applied; ...` line). Because
#     `FORCES 0` is ALWAYS written, ABSENCE means UNKNOWN and only `FORCES 0`
#     means unaided. sim.log's `GLSN-FORCE: declared <name> -> ...` lines remain
#     the fallback for bundles written before that landed, and remain in
#     artifacts: because they are the only record of WHEN a force was applied.
#     If the two disagree, the check fails naming the contradiction rather than
#     silently preferring one.
#     Fixtures: fail-force-returned, fail-forces-unknown, fail-census-contradiction.
#
#  7. IT USES RUN TIME AS A FORCE DISCRIMINATOR. A forced run reaches
#     eth_rom_msp_on_Q at 3.470 us; the shipped one at 3.457830 ms -- 996x. The
#     delay is a QSPI bring-up plus a boot-table scan plus an 880-byte serial
#     copy, and nothing that shortens it leaves the boot intact. The floor is
#     1,000,000,000 ps, which is the same statement the bench's own
#     cpu0_rom_idle_at_1ms rung makes from inside the simulation -- deliberately,
#     so the two corroborate. It clears a forced run by 288x and clears even the
#     blank-flash negative control (release at 1.021650 ms) by 21 us.
#     Fixture: fail-release-too-early.
#
#  8. IT PINS THE PROBE FORM, not just the key name -- and the pinning is now
#     CONDITIONAL, because the shipped bench declares neither member of either
#     pair. A verdict file cannot show what expression a probe used, which is
#     exactly how (5) went unnoticed, so where a re-sourced signal IS declared
#     it must be declared TWICE under two names whose at= are IDENTICAL. Both
#     members present: the at= must match. Exactly one present: that is a
#     pinning gap and it fails. Neither present: nothing to check, and the
#     report says the clause was INERT on this verdict rather than letting a
#     clause that measured nothing read as a clause that passed.
#     Fixtures: fail-probe-pair-disagree, fail-probe-pair-orphan.
#
#  9. IT NAMES ONE TREE INSTEAD OF GLOBBING. `ls .../build/*/reports/gls/*/`
#     accepts whichever verdicts happen to be on disk, so a stale run satisfies
#     the gate and a missing current one does not fail it. RUN_TAG/ITEM are
#     spelled out and cross-checked against the graded run's own inputs.txt --
#     the doctrine rom-content already settled.
#     Fixtures: fail-no-verdict, fail-wrong-tree, fail-truncated-verdict.
#
# 10. IT CROSS-FOOTS THE RESULT LINE. `RESULT PASS pass=<n> fail=<m>` must
#     account for exactly the rows above it, and m must equal the number of red
#     rows. A verdict whose summary does not match its own body has been
#     truncated or edited.
#
# 11. IT CLASSIFIES THE OUTCOME into named states and passes only on S4, so a
#     green bootgate on a blank flash cannot read as a boot.
#     Fixtures: fail-blank-flash (S2, the REAL erased-image negative control off
#     build/gls-netlist-negative/), fail-crc-rejected (S3), fail-cpu0-not-gated (S0).
#
# 12. A MISSING KEY FAILS LIKE A RED ONE (fail-tierc-missing): a check deleted
#     rather than fixed otherwise reads as a pass.
#
# 13. sim.log JOINS artifacts:. It was never collected, so a packaged bundle
#     could not answer "was anything held?" or "how long did it run?" about its
#     own PASS. Both questions are now load-bearing (6) and (4).
#
# -----------------------------------------------------------------------------
# RECONCILIATION -- every key, checked against the bench that emits it
#
# The shipped bench emits EXACTLY 22 keys: 2 mems x 2, 5 romwatch x 2, 8
# expects. Enumerated from the JSON, not from memory.
#
# REMOVED FROM THE DRAFT'S TIER C -- graded, never emitted (12 keys):
#   qspi_xip_active_latched     no such expect in the bench
#   ipc_slot1_warm_word         no such expect in the bench
#   remap_write_strobe          no such expect in the bench
#   remap_ctrl_bit2_set         no such expect (bit 2 is TRACED, not asserted)
#   remap_bit2_at_flop_q        no such expect in the bench
#   cpu1_remap_bit0_set         no such expect in the bench
#   cpu1_remap_bit0_and_bit2    no such expect in the bench
#   eth_imem_write_after_release.accessed  -> KNOWN_OPEN, see note 3
#   eth_imem_write_after_release.data_nonx -> KNOWN_OPEN
#   eth_imem_fetch.accessed                -> KNOWN_OPEN
#   eth_imem_fetch.data_nonx               -> KNOWN_OPEN
#   eth_sysctrl_remap_set                  -> KNOWN_OPEN
#
# TWO NAMES CIRCULATING IN THE HANDOVER THAT ARE NOT IN THIS DRAFT AT ALL, and
# were not in the previous one either -- checked, not assumed:
#   eth_imem_prestaged   appears ONCE in the previous draft, in a comment saying
#                        it was measured and deliberately NOT graded. It was
#                        never in TIER_C.
#   cpu1_image_copied    appears ZERO times in the previous draft and ZERO times
#                        in the bench. It does not exist.
#
# ADDED (2 keys the bench emits and the draft did not grade):
#   cpu1_dmem_write.data_nonx   Tier A. The bench emits it; X data written into
#                               CPU1's DMEM is a real failure and was ungraded.
#   cpu1_imem_write.data_nonx   already in Tier C, retained.
#
# KEPT UNCHANGED: all 10 Tier-A keys, all 5 Tier-B keys, and the four Tier-C
# keys the bench does emit (qspi_flash_addressed, cpu0_rom_idle_at_1ms, and the
# cpu1_imem_write / cpu1_imem_fetch pairs).
#
# ALSO WRONG IN THE HANDOVER, and checked rather than trusted: the previous
# draft did NOT declare `MODE = "fetch_path_only"` or
# `ALLOWED_FORCES = {"cpu0_bootgate"}`. It already declared full_handshake with
# an empty allow-list (lines 157/160 of the file as it stood). Nothing to change
# there; the mode set still covers fetch_path_only for the forced fallback.
#
# -----------------------------------------------------------------------------
# WHAT THIS DRAFT DOES ON TODAY'S PUBLISHED EVIDENCE
#
# ASIC/eth-chiplet/build/fp1505/reports/gls/fp1505_cc/verdict.txt, as it stands
# on disk at 2026-08-19 12:46, is a 27-row file reading `RESULT FAIL pass=22
# fail=5`. Its 22 green rows are EXACTLY the 22 the shipped bench emits; its 5
# red rows are exactly the KNOWN_OPEN register. That run was made at 302,000
# cycles with the eth-side probes still declared, which is why it carries five
# rows the shipped bench no longer emits.
#
#   -> THIS CHECK PASSES IT, with five warnings naming the open item, the
#      6.04 ms window that was long enough to settle four of them, and the one
#      (eth_sysctrl_remap_set) whose only observed firing is beyond even that.
#   -> IT ALSO PASSES the 22-row `RESULT PASS pass=22 fail=0` the shipped bench
#      produces when it is re-run, which is fixture `pass`.
#   -> IT REJECTS full0814's `RESULT FAIL pass=10 fail=4`, which is the whole
#      point of replacing the stage.
#   -> IT REJECTS the erased-flash run at build/gls-netlist-negative/, which is
#      `make -C ASIC/gls-netlist negative-control`'s own requirement.
#
# PROMOTION TO `gate: block`: the mode question is settled -- full_handshake is
# declared and met. What is left is the eth-side open item in note 3. Promote
# when KNOWN_OPEN is empty, which the ratchet in (3) will demand anyway.
#
