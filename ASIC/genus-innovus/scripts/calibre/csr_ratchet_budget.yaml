    See the header above.

# ---------------------------------------------------------------------------
# Three named CSR/seal-ring rulechecks that grew sharply between the two
# archives. `ceiling` is archive 2's TOTAL Result Count (capped-display
# number) -- the worst measured so far, recorded as a ceiling a future
# re-check must not exceed.
# ---------------------------------------------------------------------------
tracked_checks:
  - check: "CSR.R.2:B"
    ceiling: 644
    archive1_count: 104
    archive2_count: 644
    archive2_original: 644
    justification: >
      Grew +519% (104 -> 644) between archive 1 (pad-ring-only merge) and
      archive 2 (full std-cell + seal-ring merge). NOT closed, NOT
      root-caused. The corner-rotation fix (nanosoc_eth_chiplet_pads.io)
      clears IMEC's mechanical Padringcheck orientation error but does NOT
      provably touch this rule -- PCORNER_G's GDS content is
      orientation-symmetric (uniform 135x135um block, LEF SYMMETRY X Y R90).
      See CONVERGENCE_PLAN_2026-08-18.md §8.

  - check: "CSR.R.2:D"
    ceiling: 804
    archive1_count: 91
    archive2_count: 804
    archive2_original: 816
    justification: >
      Grew +783% (91(364) -> 804(816)). Only 4 of archive 2's 804 hits
      attribute to CORNER_B by-cell (was 91/91 = 100% in archive 1) --
      CORNER_B's own by-cell count is BYTE-IDENTICAL between the two
      archives, so the bulk of the growth (roughly 800 of 804) is NOT
      attributed to the corner cells at all. Full attribution needs either a
      fuller by-cell report from the broker or a local re-check against a
      corner-rotation-fixed, fully-merged stream. See
      CONVERGENCE_PLAN_2026-08-18.md §8 and
      docs/tapeout/48-imec-signoff-results-analysis.md §1.3.

  - check: "CSR.EN.8"
    ceiling: 96
    archive1_count: 28
    archive2_count: 96
    archive2_original: 96
    justification: >
      Grew +243% (28 -> 96). Unattributed by cell in either archive's report;
      same seal-ring-construction rule family as CSR.R.2:B/D, same
      "plausibly helps, does not provably fix" relationship to the
      corner-rotation fix. See CONVERGENCE_PLAN_2026-08-18.md §8.

