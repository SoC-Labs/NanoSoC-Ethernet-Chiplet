# ---------------------------------------------------------------------------
# CSR / SEAL-RING RULE-CATEGORY RATCHET BUDGET --- nanosoc_eth_chiplet_pads
#
# Consumed by scripts/ci/csr_ratchet.py, which ci/signoff.yaml (id:
# csr-category-ratchet) delegates the ratchet verdict to. That is the ONLY
# consumer.
#
# WHAT THIS IS, AND WHAT IT IS NOT
#   This is NOT a fix, and NOT a clean baseline. It is a CEILING recording the
#   WORST numbers seen so far for three named CSR/seal-ring rulechecks plus a
#   rollup for every rule category that fired for the first time in the fuller
#   of the two IMEC archives -- so that a FUTURE re-check cannot silently grow
#   past what is already known-bad without a human noticing. None of the
#   counts below are understood or root-caused. See
#   docs/tapeout/53-gate-promotion-plan.md §2 "CSR / 157-category ratchet" and
#   CONVERGENCE_PLAN_2026-08-18.md §8 for the investigation this baseline is
#   drawn from.
#
# THIS BASELINE IS AGAINST A STALE REFERENCE GDS, NOT THE CURRENT BUILD
#   Both archives below check `nanosoc_eth_chiplet_pads_logo_full_L300.gds`
#   (md5 7f6214965501c911bd65069378ae911d), a snapshot from the now-legacy
#   ASIC/genus-innovus engine dated 2026-08-10 (docs/tapeout/48-imec-signoff-
#   results-analysis.md §0). It predates the toolkit migration, the LEFOBS
#   phantom-metal fix, the PO.R.8 characterization, and everything else that
#   has landed since. The CURRENT shipping lineage (fp1505/full-20260814) has
#   NEVER had a full-library-merge DRC run at all -- IMEC's own decks are the
#   only source of these numbers, and only against the old snapshot.
#
#   So THE RATCHET'S REAL JOB RIGHT NOW is "don't let a FUTURE re-check
#   against IMEC (on whatever build is current then) show these numbers
#   growing past today's baseline", NOT "gate the current build" -- there is
#   nothing local to gate yet. Promote CI's csr-category-ratchet stage from
#   `report` to `block` only once (a) a full-library-merge check exists
#   against the CURRENT build and (b) the counts have a verified ceiling with
#   no unexplained residue (doc 53 §1's own promotion bar).
#
# WHY THE MAJORITY OF THE GROWTH IS UNEXPLAINED, NOT JUST UNFIXED
#   CONVERGENCE_PLAN_2026-08-18.md §8 traced CORNER_B's own by-cell count as
#   BYTE-IDENTICAL between the two archives, and in the main drc deck
#   CORNER_B carries only 4 of archive 2's 804 CSR.R.2:D hits (was 91/91 =
#   100% in archive 1). The corner-rotation fix
#   (ASIC/genus-innovus/scripts/nanosoc_eth_chiplet_pads.io, applied
#   2026-08-18 per CONVERGENCE_PLAN §9) is real and clears IMEC's mechanical
#   Padringcheck orientation error, but does NOT provably touch CSR.R.2:B/D
#   or CSR.EN.8 -- PCORNER_G's own GDS content is orientation-symmetric.
#   Roughly 800 of 804, 644 of 644 and 96 of 96 are NOT attributed to the
#   corner cells at all, and the reports truncate before naming what is:
#   full attribution needs either a fuller by-cell report from the broker or
#   a local re-check against a corner-rotation-fixed, fully-merged stream.
#
# ARCHIVE PROVENANCE (both gitignored, host-local broker deliverables --
# ASIC/imec_results is NOT tracked in this repo, per drc_waivers.yaml's own
# `measured_on:` convention of citing a path that will not exist on every
# checkout)
#   archive 1 (partial merge, pad-ring library only):
#     ASIC/imec_results/Archive_nanosoc_eth_chiplet_pads_logo_full_L300_merged_dummyWithSealRing_17Aug26_15u14/
#     drc/cali_drc_nanosoc_eth_chiplet_pads_logo_full_L300_merged_dummy_with_sealring.rpt
#   archive 2 (full merge -- BOTH tphn65lpgv2od3_sl.gds AND tcbn65lp.gds
#              substituted in, first time real std-cell geometry existed
#              around this design in any check we've had) -- THE BASELINE
#              SOURCE, because it is the fuller/more-recent merge:
#     ASIC/imec_results/Archive_nanosoc_eth_chiplet_pads_logo_full_L300_dummy_merged_dummyWithSealRing_18Aug26_19u28/
#     drc/cali_drc_nanosoc_eth_chiplet_pads_logo_full_L300_dummy_merged_dummy_with_sealring.rpt
#   measured (this file):  2026-08-18
#   report format:         "RULECHECK <name> ... TOTAL Result Count = <capped-display> (<original>)"
#                           `ceiling`/`archive2_count` below is the FIRST
#                           (capped-display) number -- the one every count in
#                           doc 53/CONVERGENCE_PLAN §8 and this file's own
#                           tracked_checks quote -- not the parenthetical
#                           original-geometry count.
#
# SELF-TEST DISCIPLINE (docs/tapeout/39-po-r8-resolved.md §8's proof table is
# the pattern; scripts/ci/csr_ratchet.py --self-test reproduces it here)
#   `python3 scripts/ci/csr_ratchet.py --self-test` re-derives every number in
#   this file DIRECTLY from the two archive reports on disk (when reachable --
#   see the script's docstring for the degraded-but-honest behaviour when
#   ASIC/imec_results is absent, e.g. a fresh clone) and FAILS if this file's
#   recorded ceiling/archive1_count/archive2_count/new_categories has DRIFTED
#   from what the raw reports actually say -- the same "a waived/recorded
#   number that moved is a new fact" discipline drc_census.py's waiver
#   apply_waivers() already enforces. It also runs a battery of synthetic
#   fixtures (a summary with a tracked count OVER ceiling; one exactly AT
#   ceiling; one with a genuinely new, untracked category firing; a
#   structurally malformed budget file) to prove the ratchet can actually
#   FAIL, not just report -- see that command's own output for the pass/fail
#   table.
# ---------------------------------------------------------------------------
