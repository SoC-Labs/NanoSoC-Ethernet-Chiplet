#-----------------------------------------------------------------------------
# ci-pipeline.conf - THE LADDER for nanosoc_eth_chiplet.
#
#   ASIC/asic-toolkit/ci/pipeline.sh --asic-dir ASIC/eth-chiplet
#
# Format, fields and the five results: ASIC/asic-toolkit/ci/pipeline.conf.example.
# Read by ci/pipeline.sh (runs it) and ci/collect-results.py (collates it).
#
# WHAT THIS FILE REPLACED
#
# The checks on this design were spread across four systems that did not know
# about each other - `make` targets in three Makefiles, ci/signoff.yaml and its
# driver, the runners under verif/, and one rundir per tool - so no command ran
# them all and no file said where the design stood. This is that file. It does
# not replace ci/signoff.yaml: the signoff driver still owns its own stages and
# their fixtures, and the collator READS its status.json output, so a stage
# named here and run there is reported once, from both sources, and flagged if
# the two disagree.
#
# EVERY STAGE HERE IS EITHER MEASURED OR EXPLICITLY DECLARED. There is no third
# option and no silent omission: a stage that has never run appears in the
# report as UNVERIFIED, which blocks, rather than as an absence, which reads as
# a pass.
#
# Copyright (C) 2026, SoC Labs (www.soclabs.org)
#-----------------------------------------------------------------------------

#=============================================================================
# 1. RTL - cheap, no licence seat, must pass before a seat is held
#=============================================================================

chip-boundary  phase rtl     | the pin list the two dies agree on
chip-boundary  gate  block
chip-boundary  after -
chip-boundary  label soclabs-sim
chip-boundary  run   "make -C @ROOT@ chip-boundary"
chip-boundary  evidence "@ROOT@/build/chip/**"

lint           phase rtl
lint           gate  block
lint           after chip-boundary
lint           label soclabs-sim
lint           run   "make -C @ROOT@ lint"
lint           evidence "@ROOT@/build/lint/lint_verdicts.log"

elab           phase rtl     | full-design elaboration
elab           gate  block
elab           after lint
elab           label soclabs-sim
elab           run   "make -C @ROOT@ elab"
elab           evidence "@ROOT@/build/elab/*.log"

elab-strict    phase rtl     | multi-driver and structural rules
elab-strict    gate  block
elab-strict    after elab
elab-strict    label soclabs-sim
elab-strict    run   "make -C @ROOT@ elab-strict"
elab-strict    evidence "@ROOT@/verif/elab_strict/build/xrun_hal.log"

cdc            phase rtl
cdc            gate  report
cdc            after elab
cdc            label soclabs-sim
cdc            run   "make -C @ROOT@ cdc"
cdc            evidence "@ROOT@/verif/cdc/build/*.log"

regress        phase rtl     | the functional suites
regress        gate  block
regress        after elab
regress        label soclabs-sim
regress        run   "make -C @ROOT@ regress"
regress        evidence "@ROOT@/build/regress/*.log"

#=============================================================================
# 2. BOOT ROMs
#
# Ahead of synthesis on purpose. Synthesis bakes ROM content into the netlist,
# so a ROM gate that runs after it is judging a chip that has already been
# built - and this project has streamed a GDS carrying a RANDOM eth_rom for
# exactly that reason.
#=============================================================================

rom-selftest   phase rtl     | can the ROM gate fail at all
rom-selftest   gate  block
rom-selftest   after -
rom-selftest   label soclabs-pdk
rom-selftest   run   "make -C @ROOT@/ASIC -f common.mk romlibs-selftest"
rom-selftest   evidence "@ROOT@/build/rom_verify/selftest/**"

rom-content    phase rtl     | do the built ROMs hold the built firmware
rom-content    gate  block
rom-content    after rom-selftest
rom-content    label soclabs-pdk
rom-content    run   "make -C @ROOT@/ASIC/genus-innovus romlibs-check"
rom-content    evidence "@ROOT@/build/rom_verify/*.json"

#=============================================================================
# 3. IMPLEMENTATION
#=============================================================================

syn            phase synth
syn            gate  block
syn            after elab-strict rom-content
syn            label asic-flow-syn
syn            run   "@MAKE@ syn"
syn            evidence "@RUN@/outputs/*_gate_power.v" "@RUN@/reports/syn_manifest.txt"

place          phase pnr
place          gate  block
place          after syn
place          label asic-flow-pnr
place          run   "@MAKE@ place"
place          evidence "@RUN@/reports/place_manifest.txt"
place          verdict "$ASIC_FLOW_DIR/ci/assert-stage.sh place --asic-dir @ASIC@"

cts            phase pnr
cts            gate  block
cts            after place
cts            label asic-flow-pnr
cts            run   "@MAKE@ cts"
cts            evidence "@RUN@/reports/cts_manifest.txt"
cts            verdict "$ASIC_FLOW_DIR/ci/assert-stage.sh cts --asic-dir @ASIC@"

route          phase pnr
route          gate  block
route          after cts
route          label asic-flow-pnr
route          run   "@MAKE@ route"
route          evidence "@RUN@/reports/route_manifest.txt" "@RUN@/reports/route_gate.txt"
route          verdict "$ASIC_FLOW_DIR/ci/assert-stage.sh route --asic-dir @ASIC@"

#=============================================================================
# 4. PHYSICAL SIGNOFF
#=============================================================================

# The ROM gate again, this time against the STREAM rather than the build tree.
# Separate from rom-content because they answer different questions and have
# failed independently: the content gate has passed on a build whose GDS was
# streamed eleven hours earlier and still carried the old ROM.
rom-gds        phase physical
rom-gds        gate  block
rom-gds        after route
rom-gds        label soclabs-pdk
rom-gds        needs "@ROOT@/ASIC/genus-innovus/outputs/nanosoc_eth_chiplet_pads.gds"
rom-gds        run   "make -C @ROOT@/ASIC/genus-innovus romlibs-gds-check ROM_GDS=@ROOT@/ASIC/genus-innovus/outputs/nanosoc_eth_chiplet_pads.gds"
rom-gds        evidence "@ROOT@/build/rom_verify/*_gds.bits"

drc            phase physical
drc            gate  block
drc            after route
drc            label soclabs-pdk
drc            needs "@ROOT@/ASIC/genus-innovus/outputs/nanosoc_eth_chiplet_pads.gds"
drc            run   "make -C @ROOT@ asic-drc"
drc            evidence "@ROOT@/ASIC/genus-innovus/work/drc_run/*.summary"
drc            verdict "python3 @ROOT@/scripts/ci/drc_census.py @ROOT@/ASIC/genus-innovus/work/drc_run"
drc            timeout 21600

# ERC. NOW REAL - it runs, it produces numbers, and it came back clean on the
# fp1505 build across all 8 rulechecks with all 4 PATHCHK operations executing.
#
# `uncapped` IS NOT A PERFORMANCE KNOB, IT IS THE DIFFERENCE BETWEEN A RESULT
# AND A VACUOUS ONE. The default 3-switch CAPPED configuration reports 6 checks
# all zero on a CLEAN stream and all zero on a DELIBERATELY BROKEN one. A
# configuration that returns the same answer either way has not measured the
# design, and running it would put six more green ticks on this report that mean
# nothing. So the signoff configuration is `uncapped` and it is named here, in
# the ladder, rather than left to whoever types the command.
#
# `needs` NAMES THE RUNNER ITSELF, not just the stream. The runner is not yet
# committed to this tree, so until it lands this stage collates UNVERIFIED
# naming the exact path that has to arrive, and `run` is never executed. That is
# also what keeps `ladder.commands` from reporting the ladder as broken: a
# declared pending delivery is not a wrong ladder, it is a right one waiting.
erc            phase physical
erc            gate  block
erc            after route
erc            label soclabs-pdk
erc            needs "@ROOT@/scripts/erc/run_erc.sh" "@ROOT@/ASIC/genus-innovus/outputs/nanosoc_eth_chiplet_pads.gds"
erc            run   "@ROOT@/scripts/erc/run_erc.sh uncapped"
erc            evidence "@ROOT@/build/erc_run/*.summary"
erc            timeout 21600

lvs-preflight  phase physical | can LVS be set up at all
lvs-preflight  gate  report
lvs-preflight  after route
lvs-preflight  label soclabs-pdk
lvs-preflight  run   "make -C @ROOT@ asic-lvs-pre"
lvs-preflight  evidence "@ROOT@/ASIC/genus-innovus/logs/calibre_lvs*.log"

# Metal fill is OURS, it is implemented, and it has never been switched on. That
# makes it a real stage with no result - NOT a delegation and NOT an n/a. It
# collates UNVERIFIED, which is the true answer.
metal-fill     phase physical
metal-fill     gate  block
metal-fill     after route
metal-fill     label asic-flow-pnr
metal-fill     needs "@RUN@/reports/route_manifest.txt"
metal-fill     run   "@MAKE@ route EVR_METAL_FILL=1"
metal-fill     evidence "@RUN@/reports/metal_fill*.rep"

#--- DECLARED NON-RESULTS ------------------------------------------------------
# Each carries who owns it, why, and the command that fires when the
# declaration goes stale. The collator RUNS every one of those commands and
# turns the stage RED when one succeeds. Reasons and refutations are taken from
# the vetted `unsupported:` block of ci/signoff.yaml so there is one statement
# of each gap, not two that drift.

lvs-fullchip   phase physical
lvs-fullchip   gate  block
lvs-fullchip   after route
lvs-fullchip   status not-applicable
lvs-fullchip   because "No CDL and no GDS for the standard-cell, IO or bond-pad libraries exist on this system - one 92-byte stub in the whole PDK. They ship only in the Back-End packages, which will NOT be obtained. Full-chip LVS will not run here at all; this is a standing property, not a deferred task. Black-box LVS does work and is what to use. See docs/DRC_WAIVER_INVENTORY.md sec 7."
lvs-fullchip   refuted_by "find ${TSMC_65_HOME} -maxdepth 6 -size +1k \\( -name 'tcbn65lp*.cdl' -o -name 'tphn65*.cdl' -o -name 'tpbn65v*.cdl' \\) 2>/dev/null | grep -q ."

antenna        phase physical
antenna        gate  block
antenna        after route
antenna        status not-applicable
antenna        because "A NULL RESULT, not a clean one. The stream carries no standard-cell, IO or pad internal geometry - write_stream reports 424 master cells not merged - so an antenna rule about gate area runs over almost no gate area. 714 rulechecks, 0 results. Re-running changes nothing while the Back-End packages are absent."
antenna        refuted_by "find ${TSMC_65_HOME} -maxdepth 4 -name '*_BE' -type d 2>/dev/null | grep -q ."

vendor-geometry phase physical
vendor-geometry gate  block
vendor-geometry after drc
vendor-geometry status delegated
vendor-geometry to "TSMC / memory IP vendor, at submission"
vendor-geometry because "697 DRC results sit inside merged vendor memory GDS for which we hold no editable source. They cannot be fixed by any P&R iteration on our side and require a foundry / IP-vendor waiver at submission. WAIVE-VENDOR in docs/DRC_WAIVER_INVENTORY.md sec 2. This is NOT a pass: nobody has yet signed it."
vendor-geometry refuted_by "test -s @ROOT@/docs/tapeout/vendor_waiver_signed.txt"

#=============================================================================
# 5. EQUIVALENCE
#=============================================================================

lec-selftest   phase equiv    | can the LEC harness fail at all
lec-selftest   gate  block
lec-selftest   after route
lec-selftest   label asic-flow-lec
lec-selftest   run   "make -C @ROOT@/ASIC/genus-innovus lec-selftest"
lec-selftest   evidence "@ROOT@/ASIC/genus-innovus/logs/lec_selftest*.log"
lec-selftest   timeout 3600

lec-pnr        phase equiv    | synthesis netlist vs the routed one
lec-pnr        gate  block
lec-pnr        after lec-selftest
lec-pnr        label asic-flow-lec
lec-pnr        needs "@ROOT@/ASIC/genus-innovus/outputs/nanosoc_eth_chiplet_pads_gate_power.v" "@ROOT@/ASIC/genus-innovus/outputs/nanosoc_eth_chiplet_pads_pnr.v"
lec-pnr        run   "make -C @ROOT@ asic-lec-pnr"
lec-pnr        evidence "@ROOT@/ASIC/genus-innovus/logs/lec_pnr*.log"
lec-pnr        timeout 21600

#=============================================================================
# 6. POWER AND TIMING
#
# Both are extension points and both collate UNVERIFIED today. Neither is
# declared away: the tools are installed - Voltus ships in SSV_21.11.000 with
# 41 idle seats, off PATH until its setup is sourced - so what is missing is a
# stage, not a licence, and "no stage" is not a reason to stop counting it.
#=============================================================================

sta-signoff    phase power
sta-signoff    gate  block
sta-signoff    after route
sta-signoff    label soclabs-pdk
sta-signoff    needs "@ROOT@/ASIC/genus-innovus/outputs/nanosoc_eth_chiplet_pads_pnr.v"
sta-signoff    evidence "@ROOT@/ASIC/genus-innovus/reports/sta_signoff*.rep"
sta-signoff    timeout 21600

ir-drop        phase power
ir-drop        gate  report
ir-drop        after route
ir-drop        label soclabs-pdk
ir-drop        needs "@ROOT@/ASIC/genus-innovus/outputs/nanosoc_eth_chiplet_pads_pnr.v"
ir-drop        evidence "@ROOT@/ASIC/genus-innovus/reports/ir_drop*.rep"
ir-drop        timeout 21600
