# -----------------------------------------------------------------------------
# run-report.yml -- collate one run's VALUES and publish them.
#
# WHAT IT RUNS
#   scripts/ci/run_report.py, which reads a finished (or part-finished) run
#   directory and writes run_report.{json,yaml,html,md} into its reports/.
#   No EDA licence, no tool launch, no PDK. Seconds, not hours.
#
# THREE THINGS THIS WORKFLOW DOES DELIBERATELY DIFFERENTLY FROM ITS NEIGHBOURS
#
#   1. IT DOES NOT FETCH ANY SUBMODULE. `vendor-guard.yml` fails on EVERY run
#      at "Fetch the content scanner (ASIC/asic-toolkit)", for TWO independent
#      reasons, both measured 2026-08-25 and both of which had to be true at
#      once for the failure to look as confusing as it did:
#
#        a. the pinned toolkit commit was 22 commits ahead of the toolkit's own
#           origin/main and had never been pushed, so no clone could check it
#           out however it authenticated. FIXED: toolkit pushed 56f8749..e42355a
#           and the pin advanced to match.
#
#        b. SUBMODULE_TOKEN cannot read the toolkit repository. With the pin
#           fixed, the very next run still failed, and the log is unambiguous:
#
#               remote: Write access to repository not granted.
#               fatal: ... nanoSoC-ASIC-Toolkit.git/': error: 403
#
#           That is GitHub's 403 for a token with NO access to the repo, not a
#           complaint about write permission. STILL OPEN: it needs the PAT (or
#           a GitHub App / deploy key) granted read access to
#           SoC-Labs/nanoSoC-ASIC-Toolkit. Nothing in this repository can fix
#           it; it is a credential-scope change.
#
#      Fixing (a) was necessary and not sufficient, and it is worth saying so
#      plainly: the pin being unpushed was a real defect that would have failed
#      on its own, and it masked (b) completely.
#
#      This workflow inherits NEITHER. run_report.py imports only scripts/ci and
#      the standard library -- PROVEN by moving ASIC/asic-toolkit out of the
#      tree entirely and re-running: identical output, 179 values measured. So
#      it checks out with submodules:false and needs no token at all. If you add
#      a step here that touches the toolkit, you have re-acquired both.
#
#   2. IT REFUSES RATHER THAN GUESSES THE RUN. `collect-results.py` resolves
#      RUN_TAG through make and silently defaults to `default` -- an August 13
#      build -- then reports that build's stages as though they were yours.
#      run-tag is a REQUIRED input here and the job fails if the directory is
#      absent.
#
#   3. IT NEVER GATES. The report says what a run WAS; `make` decides whether
#      it was good. A collator that can fail a pipeline becomes a second
#      verdict on one run, and the fuzzier of two verdicts is the one that gets
#      quoted. `continue-on-error` is NOT used to hide breakage -- the report
#      step itself is allowed to fail loudly; what is never done is turning a
#      finding IN the report into a red job.
#
# RUNNER REALITY, MEASURED 2026-08-25: this repository has ZERO registered
# self-hosted runners (`gh api .../actions/runners` -> total_count 0). Every
# self-hosted workflow here queues forever -- `nightly` has been pending or
# cancelled every night since at least 08-20. Until a runner is registered on
# srv03335 this job will queue too, because the run directories live on that
# host and are gitignored: there is nowhere else the evidence exists.
# `scripts/ci/install_runner.sh` is the registration script.
# -----------------------------------------------------------------------------
name: run-report

on:
  workflow_dispatch:
    inputs:
      run-tag:
        description: "Run tag under ASIC/eth-chiplet/build/ (e.g. gdsrun-20260823-rzG)"
        required: true
        type: string
      runner:
        description: "Runner label. The run dirs live on srv03335."
        required: false
        default: soclabs-pdk
        type: string
      publish:
        description: "Upload the report to Artifactory. A publish is a claim."
        required: false
        default: false
        type: boolean
      klass:
        description: "candidate | release -- recorded as report.klass"
        required: false
        default: candidate
        type: string

permissions:
  contents: read

jobs:
  run-report:
    runs-on: [self-hosted, linux, "${{ inputs.runner }}"]
    timeout-minutes: 30
    steps:
      # submodules:false is load-bearing -- see note 1 in the header.
      - uses: actions/checkout@v4
        with:
          submodules: false
          clean: false

      - name: Show what this job can see
        run: |
          echo "run-tag : ${{ inputs.run-tag }}"
          echo "host    : $(hostname)"
          echo "python  : $(python3 -V 2>&1)"
          python3 -c "import yaml; print('pyyaml  :', yaml.__version__)" \
            || echo "pyyaml  : ABSENT -- YAML will be skipped, JSON still written"

      # A MISSING RUN DIRECTORY IS THE FAILURE THIS JOB EXISTS TO CATCH EARLY.
      # The build tree is gitignored, so a checkout NEVER contains it: if this
      # step fails, the job is running on a machine that did not do the build,
      # and every number it could produce would be about some other run.
      - name: Require the run directory
        run: |
          RUN="ASIC/eth-chiplet/build/${{ inputs.run-tag }}"
          if [ ! -d "$RUN" ]; then
            echo "::error::no run directory at $RUN on $(hostname)."
            echo "The build tree is gitignored and never arrives with a checkout."
            echo "Runs present here:"; ls -1 ASIC/eth-chiplet/build/ 2>/dev/null | sed 's/^/  /' || echo "  (no build/ at all)"
            exit 1
          fi
          echo "OK: $RUN"

      - name: Collate the run report
        run: |
          python3 scripts/ci/run_report.py --run-tag "${{ inputs.run-tag }}"

      # The summary is the point of running this in CI at all: the counts and
      # the findings land in the job page, so nobody has to open an artefact to
      # learn whether anything moved.
      - name: Job summary
        if: always()
        run: |
          MD="ASIC/eth-chiplet/build/${{ inputs.run-tag }}/reports/run_report.md"
          if [ -r "$MD" ]; then
            head -c 900000 "$MD" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No run_report.md was produced -- the collation step did not reach one." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to Artifactory
        if: ${{ inputs.publish }}
        run: |
          python3 scripts/ci/run_report.py --run-tag "${{ inputs.run-tag }}" \
            --publish --klass "${{ inputs.klass }}"

      # 90 days, matching asic-signoff.yml. NOT a substitute for the store:
      # Actions artefacts expire and Artifactory does not, which is why
      # --publish exists.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ inputs.run-tag }}
          path: ASIC/eth-chiplet/build/${{ inputs.run-tag }}/reports/run_report.*
          if-no-files-found: warn
          retention-days: 90
