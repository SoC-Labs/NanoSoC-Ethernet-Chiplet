#-----------------------------------------------------------------------------
# ci-ladder.yml — climb the gates one rung at a time, on demand
# A joint work commissioned on behalf of SoC Labs, under Arm Academic Access license.
#
# Copyright 2026, SoC Labs (www.soclabs.org)
#-----------------------------------------------------------------------------
# Bring-up instrument, not a gate. nightly.yml runs everything at 02:00 and tells
# you only that the pile is red; this runs the SAME commands bottom-up and stops
# at the first rung that breaks, so you learn WHICH tool is not wired up yet.
#
# `workflow_dispatch` ONLY — it must never queue against a runner that is not
# attached, and it must never race the nightly for licence seats.
#
# ONE JOB, CONDITIONAL STEPS — deliberately not one job per rung. Jobs do not
# share a workspace, so a per-job ladder would re-clone 43 submodules per rung.
#
# THE RUNNER IS SANDBOXED (SoC-Labs-Github-Runner, bubblewrap). Consequences the
# steps below are written around:
#   - $HOME is a FAKE home, empty on a fresh install. Nothing you set up in your
#     real home — ssh keys, ~/bin shims, .gitconfig — is visible here.
#   - Only paths named in the host's site.env are mounted. /research/AAA is
#     bound; /research/precompiled_mems is NOT, unless RESEARCH_PATHS says so.
#   - No SSH agent (SSH_AUTH_SOCK is unset), so submodules over git@github.com
#     need credentials supplied by the job, not inherited.
#   - `hostname` reports `ci-sandbox`, not the real host.
#-----------------------------------------------------------------------------
name: ci-ladder

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Hostname label of the runner to target'
        type: string
        default: srv04936
      stage:
        description: 'Climb rungs up to and including this one'
        type: choice
        default: '0-runner'
        options:
          - '0-runner'        # runner picks up a job at all; report what it sees
          - '1-preflight'     # checkout + scripts/ci/preflight.sh
          - '2-bootstrap'     # 43 submodules — first rung needing credentials
          - '3-boundary'      # make chip-boundary  (python only)
          - '4-lint'          # make lint           (verilator 4.028)
          - '5-elab'          # make elab           (VCS licence seat)
          - '6-elab-strict'   # make elab-strict    (Xcelium licence seat)

# Never two ladders at once — they would fight over one workspace and the same
# licence seats. NOTE nightly.yml currently uses its own group (`nightly`), so
# this does NOT yet serialise against it; align both once the ladder is trusted.
concurrency:
  group: eda-gates
  cancel-in-progress: false

jobs:
  ladder:
    runs-on: [self-hosted, linux, "${{ inputs.runner }}"]
    timeout-minutes: 120

    steps:
      # Via env, not direct interpolation, so the input never reaches the shell
      # as code. '4-lint' -> '4'.
      - name: Rung level
        id: plan
        env:
          STAGE: ${{ inputs.stage }}
        run: echo "level=${STAGE%%-*}" >> "$GITHUB_OUTPUT"

      # --- rung 0: does the runner take work, and what can it actually see? ---
      - name: 'rung 0 — runner sanity'
        run: |
          echo "sandbox hostname : $(hostname)   (expect ci-sandbox)"
          echo "user             : $(id -un)  groups: $(id -Gn)"
          echo "cores / mem      : $(nproc) / $(free -g | awk '/^Mem:/{print $2}')GB"
          echo "HOME             : $HOME"
          echo "workspace        : $GITHUB_WORKSPACE"
          echo
          echo "-- tools on PATH --"
          for t in git make python3 python3.11 verilator vcs xrun; do
            printf '  %-12s %s\n' "$t" "$(command -v $t || echo MISSING)"
          done
          echo
          echo "-- mounts a job needs --"
          for d in /research/AAA/ip_library /research/precompiled_mems/TSMC65 /eda; do
            [ -r "$d" ] && echo "  OK      $d" || echo "  ABSENT  $d  (add to RESEARCH_PATHS in the host's site.env)"
          done
          echo
          echo "-- licence servers --"
          for v in SNPSLMD_LICENSE_FILE CDS_LIC_FILE ARMLMD_LICENSE_FILE; do
            echo "  $v=${!v:-<unset>}"
          done

      - name: Checkout (no submodules)
        if: fromJSON(steps.plan.outputs.level) >= 1
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # The sandbox binds a FAKE, empty $HOME, so TWO things that exist on the
      # host are invisible to a job:
      #   - the ~/bin/python3 shim (bare `python3` here is 3.6, and
      #     check_chip_boundary.py opens with `from __future__ import
      #     annotations` — a SyntaxError before 3.7);
      #   - PyYAML, which the host's 3.11 picks up from the REAL home's
      #     ~/.local/lib/python3.11/site-packages.
      # Both have to be established in-job. Do not "fix" either by editing the
      # host: a job must not depend on hand-tweaks to somebody's home.
      # python must land in the WINDOW [3.7, 3.11):
      #   >= 3.7  check_chip_boundary.py opens with `from __future__ import
      #           annotations` (PEP 563) — a SyntaxError on 3.6;
      #   <  3.11 Arm's XHB500 generator calls open(..., 'U'), and universal-
      #           newline mode was REMOVED in 3.11 (ValueError: invalid mode).
      # srv03335 satisfies this with 3.8.17. Pinning 3.11 here satisfies the
      # first constraint and breaks the second, so pick explicitly rather than
      # taking whatever `python3` happens to be.
      - name: Pin python3 and ensure generator deps
        if: fromJSON(steps.plan.outputs.level) >= 1
        run: |
          PY=""
          for c in /usr/bin/python3.8 /usr/bin/python3.9 /usr/bin/python3.10; do
            [ -x "$c" ] && { PY="$c"; break; }
          done
          if [ -z "$PY" ]; then
            echo "::error::No python in [3.7, 3.11) on this host. >=3.7 is needed for"
            echo "::error::check_chip_boundary.py (PEP 563); <3.11 for the XHB500"
            echo "::error::generator's open(...,'U'), removed in 3.11."
            echo "::error::Install python38 (3.8.17 — same as srv03335): dnf install python38"
            ls -1 /usr/bin/python3.* 2>/dev/null | sed 's/^/::error::present: /'
            exit 1
          fi
          echo "using $PY ($($PY --version 2>&1))"
          mkdir -p "$HOME/.ci-bin"
          ln -sf "$PY" "$HOME/.ci-bin/python3"
          echo "$HOME/.ci-bin" >> "$GITHUB_PATH"
          # The sandbox home is fake and empty, so nothing installed into the
          # REAL home is visible. pyyaml: check_chip_boundary. jinja2: the SoC
          # generator's perf-probe backend ("jinja2 is required to render
          # perf-probe harnesses"). --user persists here, so re-runs no-op.
          "$PY" -m pip install --user --quiet --disable-pip-version-check \
              pyyaml jinja2

      - name: 'rung 1 — preflight (derives capability labels)'
        if: fromJSON(steps.plan.outputs.level) >= 1
        run: |
          python3 --version
          # Report, do not gate: on this host the probe is EXPECTED to withhold
          # soclabs-pdk (no /tsmc65pdk) and, until site.env binds it,
          # /research/precompiled_mems too. We want the report, not a red X.
          scripts/ci/preflight.sh || echo "^ gaps above are the point of this rung"

      # --- rung 2: the first rung that needs credentials -----------------------
      # SSH CANNOT WORK IN THIS SANDBOX, and no key would fix it. `dam1n19` is
      # not in /etc/passwd — nsswitch is `passwd: files sss`, so identity comes
      # from SSSD, whose client socket (/var/lib/sss/pipes) is not bound and
      # whose /run is replaced by a fresh tmpfs. getpwuid() therefore fails
      # inside, and OpenSSH aborts with "No user exists for uid 74755" BEFORE it
      # ever considers a key. (SSH_AUTH_SOCK is unset and the fake home has no
      # .ssh either, but those are secondary — the passwd lookup is the wall.)
      #
      # The git.soton.ac.uk submodules are HTTPS and clone fine. Only the three
      # GitHub ones — tidelink and its two PHY deps — are git@github.com, so
      # rewrite those onto HTTPS with a token. GITHUB_TOKEN covers THIS repo
      # only, hence a PAT.
      # All three GitHub submodule repos (TideLink-Chiplet-Interconnect-AHB,
      # TideLink-Chiplet-GPIO-PHY, ASIC-Flow) are public, so anonymous HTTPS is
      # enough and no secret is required. SUBMODULE_TOKEN stays OPTIONAL: set it
      # and this step uses it, so a repo going private again costs one secret
      # rather than a workflow edit.
      - name: Rewrite GitHub submodules onto HTTPS
        if: fromJSON(steps.plan.outputs.level) >= 2
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -n "${SUBMODULE_TOKEN}" ]; then
            echo "SUBMODULE_TOKEN present — using authenticated HTTPS"
            B="https://x-access-token:${SUBMODULE_TOKEN}@github.com/"
            git config --global --add url."${B}".insteadOf "https://github.com/"
          else
            echo "no SUBMODULE_TOKEN — anonymous HTTPS (all submodule repos are public)"
            B="https://github.com/"
          fi
          git config --global url."${B}".insteadOf "git@github.com:"

      - name: 'rung 2 — bootstrap submodules'
        if: fromJSON(steps.plan.outputs.level) >= 2
        run: |
          git submodule sync --recursive
          ./scripts/bootstrap.sh

      # The sandbox home PERSISTS between jobs, so a token left in .gitconfig
      # would outlive this run. Scrub it whatever happened.
      - name: Scrub credentials
        if: always() && fromJSON(steps.plan.outputs.level) >= 2
        run: rm -f "$HOME/.gitconfig"

      - name: 'rung 3 — chip-boundary (python only)'
        if: fromJSON(steps.plan.outputs.level) >= 3
        run: make chip-boundary

      - name: 'rung 4 — lint (verilator 4.028)'
        if: fromJSON(steps.plan.outputs.level) >= 4
        run: make lint

      # A self-hosted workspace PERSISTS between runs, and both generators
      # early-out on "does the output directory exist?" rather than on whether
      # it is complete:
      #   - tidelink/set_env.sh  -> "[skip] already generated"
      #   - the SoC generator    -> "[skip] build_soc/rtl is already up to date"
      # So a previous FAILED run leaves partial trees that the next run skips
      # straight over. This is not hypothetical: after perl-File-Slurp was
      # installed to fix XHB500 generation, the very next run still failed —
      # it skipped generation over the half-written output from the run before,
      # and never used the newly-installed perl module at all.
      # Deleting derived state is the only reliable guard; the same reasoning
      # already governs nightly.yml's "Drop stale build artefacts" step.
      - name: Drop stale generated artefacts
        if: fromJSON(steps.plan.outputs.level) >= 5
        run: |
          rm -rf tidelink/deps/xhb500/generated \
                 nanosoc-multicore-system/build_soc \
                 build/elab \
                 verif/elab_strict/build

      - name: 'rung 5 — elab (VCS)'
        if: fromJSON(steps.plan.outputs.level) >= 5
        run: make elab

      - name: 'rung 6 — elab-strict (Xcelium)'
        if: fromJSON(steps.plan.outputs.level) >= 6
        run: make elab-strict

      - name: Collect logs
        if: always() && fromJSON(steps.plan.outputs.level) >= 4
        uses: actions/upload-artifact@v4
        with:
          name: ci-ladder-${{ github.run_number }}-stage-${{ inputs.stage }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/lint/**
            build/elab/*.log
            verif/elab_strict/build/**/*.log
