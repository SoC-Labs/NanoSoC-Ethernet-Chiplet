# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The site is MkDocs + Material, configured in mkdocs.yml at the repo root.
# Everything it renders lives under docs/.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # The docs are plain Markdown in this repo — none of the submodules
      # (tidelink, tidechart, nanosoc-multicore-system, ASIC/asic-flows) are
      # needed to build them, and two are private. Skip the submodule fetch
      # so a docs build cannot fail on a credential it should not need.
      - git submodule deinit -f . || true

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
