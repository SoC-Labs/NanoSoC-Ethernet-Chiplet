# -----------------------------------------------------------------------------
# ci/signoff.yaml — what "signoff" means for THIS design
# A joint work commissioned on behalf of SoC Labs, under Arm Academic Access license.
#
# Copyright 2026, SoC Labs (www.soclabs.org)
# -----------------------------------------------------------------------------
# Driven by scripts/ci/signoff.py; run stage-by-stage from .github/workflows/
# asic-signoff.yml. THIS FILE IS THE ONLY PART THAT DIFFERS BETWEEN CHIPLETS —
# the driver and the workflow are meant to be copied verbatim to the compute
# chiplet, leaving the porting job as "edit this manifest".
#
# gate:  block  -> a failure means NOT SIGNED OFF
#        report -> collected and reported, never fails the pipeline. Used where
#                  the flow is real but its findings are not yet triaged to zero;
#                  promoting report->block is how this pipeline gets stricter.
# label: which runner capability the stage needs (see scripts/ci/preflight.sh).
#        soclabs-sim needs EDA + /research; soclabs-pdk additionally needs
#        ${TSMC_65_HOME}, so ONLY srv03335 can run the physical phase.
# -----------------------------------------------------------------------------
design: nanosoc_eth_chiplet
top: nanosoc_eth_chiplet

stages:
  # --- RTL phase — no PDK, runs on either host --------------------------------
  - id: chip-boundary
    phase: rtl
    gate: block
    label: soclabs-sim
    description: "Every top-level port classified exactly once; pad ring agrees"
    # THE VERDICT IS ON STDOUT AND EVERY FAILURE ARM IS ON STDERR, so both are
    # teed into an artefact. Until 2026-08-17 this stage had no evidence of its
    # own at all: check_chip_boundary.py writes nothing without --emit, so
    # `artifacts: build/chip/**` collected a wrapper and flists left behind by a
    # previous `chip-wrapper` run. The bundle therefore shipped files dated weeks
    # before the run that supposedly produced them, and the stage's only claim
    # was its exit status.
    pre:
      - mkdir -p build/chip
    run: make chip-boundary 2>&1 | tee build/chip/chip_boundary.log; exit ${PIPESTATUS[0]}
    # Re-read the census rather than trusting the rc. The load-bearing clause is
    # the VACUITY one: `classified == ports` is trivially true when both are 0,
    # so a run that parsed no ports agrees with itself perfectly. Same defect
    # class as rom-content's "it reports no words compared, which is not a pass".
    check: |
      python3 - <<'EOF'
      import re, sys
      p = "build/chip/chip_boundary.log"
      try:
          t = open(p, errors="replace").read()
      except OSError:
          print(f"chip-boundary: FAIL — no log at {p}; the stage produced no evidence")
          sys.exit(1)
      def n(pat):
          m = re.search(pat, t)
          return int(m.group(1)) if m else None
      ports, clsd = n(r"RTL ports\s*:\s*(\d+)"), n(r"classified\s*:\s*(\d+)")
      pads = n(r"pads\s*:\s*(\d+) pad cells")
      bad = []
      if ports is None or clsd is None:
          bad.append("the log carries no port census — the script never reached one")
      elif ports == 0:
          bad.append("0 RTL ports: nothing was classified, so every count agrees "
                     "with every other count. That is not a clean boundary")
      elif clsd != ports:
          bad.append(f"{clsd} of {ports} ports classified — an unclassified port is "
                     f"silently dropped from the wrapper and its inputs float")
      if "pad-ring mismatch(es)" in t:
          bad.append("the log reports pad-ring mismatches against the spec")
      elif not pads:
          bad.append("0 pad cells — the pad ring was never read")
      if "OK — every port accounted for exactly once" not in t:
          bad.append("no final OK line — the run stopped before its own verdict, "
                     "so this log is a partial run and not a measurement")
      for b in bad:
          print("chip-boundary: FAIL —", b)
      sys.exit(1 if bad else 0)
      EOF
    check_proof:
      must_pass: ci/fixtures/chip-boundary/pass
      must_fail:
        - ci/fixtures/chip-boundary/fail-count-mismatch
        - ci/fixtures/chip-boundary/fail-zero-ports
        - ci/fixtures/chip-boundary/fail-pad-ring-mismatch
        - ci/fixtures/chip-boundary/fail-truncated
        - ci/fixtures/chip-boundary/fail-no-log
    artifacts:
      - build/chip/chip_boundary.log
      - build/chip/**

  - id: lint
    phase: rtl
    gate: block
    label: soclabs-sim
    description: "Verilator structural lint of authored RTL (3 files) + loop-detection sanity"
    # THE THIRD FILE WAS NEVER LINTED HERE. PASS 3 — the only pass that lints
    # the integration top nanosoc_eth_chiplet — blackboxes the SoC from the
    # GENERATED source at nanosoc-multicore-system/build_soc/rtl/. Nothing
    # before this stage renders it, and the `elab` stage BELOW begins by
    # `rm -rf`-ing it. So on a fresh runner PASS 3 was skipped every single
    # time, and until 2026-08-17 verif/lint/run.sh scored a skipped pass as a
    # clean one: this BLOCKING gate went green having linted 2 of the 3 files
    # its own description names. Measured — one unresolvable blackbox source
    # took a run from rc 1 (a real PINMISSING) to rc 0.
    #
    # run.sh now fails on a skip, which turns that silent green into a red. The
    # pre-step is what makes it a green honestly: it renders exactly what PASS 3
    # reads, and is a no-op once the artefact is there, so it costs nothing on a
    # warm runner and does not fight the `elab` stage's own regeneration.
    #
    # `mkdir -p build/lint` because `tee` opens its file before `make` runs, and
    # on a clean checkout build/ does not exist yet.
    pre:
      - mkdir -p build/lint
      - test -f nanosoc-multicore-system/build_soc/rtl/nanosoc_multicore_soc.sv || make -C nanosoc-multicore-system/sys_desc
    # Tee the verdicts: run.sh keeps its per-pass Verilator logs under
    # build/lint/passes/ (it used to mktemp and delete them), but the pass/fail
    # lines that COMPOSE the verdict are only ever on stdout.
    run: make lint 2>&1 | tee build/lint/lint_verdicts.log; exit ${PIPESTATUS[0]}
    # verif/lint/run.sh now keeps one durable log per pass under
    # build/lint/passes/, so this gate can assert on artefacts instead of on the
    # exit status of a pipeline. That matters here more than almost anywhere: the
    # runner's own header records TWO measured false greens in this exact pass,
    # both of which exit 0 and both of which are invisible to `${PIPESTATUS[0]}`
    # if LINT_ALLOW_SKIP is ever set on a runner —
    #
    #   SILENT SCOPE COLLAPSE  one unresolvable blackbox source turns PASS 3
    #                          (the only pass that lints the integration top)
    #                          into "SKIPPED", and a live defect goes green. This
    #                          is not hypothetical in CI: `lint` runs BEFORE
    #                          `elab`, and elab's pre-step rm -rf's build_soc,
    #                          which is where PASS 3's SoC blackbox comes from.
    #   TOOL NEVER RAN         "%Error: Specified --top-module 'x' was not found
    #                          in design." names no src/rtl path, so filtering
    #                          findings to our RTL first filtered it away to
    #                          "(no findings in src/rtl)" -> OK.
    #
    # So: every declared pass must have LEFT A LOG, no log may carry a %Error
    # that is not Verilator's own end-of-run tally, and the loop-detection proof
    # must still discriminate. A lint that has gone blind reports every design
    # clean, which is why the sanity pair is gated and not merely printed.
    check: |
      python3 - <<'EOF'
      import glob, os, re, sys
      D = "build/lint/passes"
      logs = sorted(glob.glob(os.path.join(D, "*.log")))
      if not logs:
          print(f"lint: FAIL — no per-pass logs under {D}; the run left no evidence "
                f"and 'nothing reported' is not 'nothing found'")
          sys.exit(1)
      RTL    = "/src/rtl/"
      WAIVED = re.compile(r"%Warning-(UNUSED|PINCONNECTEMPTY)")
      TALLY  = re.compile(r"^%Error: Exiting due to \d+ (warning|error)\(s\)")
      WANT = {"1_LEAF":       "the decoder standalone",
              "2_SHIM":       "the TideChart shim",
              "3_WRAPPER":    "the integration top — the ONLY pass that lints the chiplet as assembled",
              "4_SANITY_bug": "the loop-detection proof (bug wiring)",
              "4_SANITY_tie": "the loop-detection proof (structural tie)"}
      names, bad = [os.path.basename(x) for x in logs], []
      for slug, what in WANT.items():
          if not any(x.startswith(slug) for x in names):
              bad.append(f"PASS {slug} left no log — it was SKIPPED, so {what} was "
                         f"never linted. A pass that did not run is not a pass that was clean")
      def body(slug):
          return "".join(open(x, errors="replace").read()
                         for x in logs if os.path.basename(x).startswith(slug))
      for x in logs:
          txt = open(x, errors="replace").read()
          hard = [l for l in txt.splitlines() if l.startswith("%Error") and not TALLY.match(l)]
          if hard:
              bad.append(f"{os.path.basename(x)}: verilator failed before it could judge "
                         f"this RTL — {hard[0]!r}. A FLOW failure, not a clean pass")
          nw = [l for l in txt.splitlines()
                if ("%Warning" in l or "%Error" in l) and RTL in l and not WAIVED.search(l)]
          if nw:
              bad.append(f"{os.path.basename(x)}: non-waived finding on our RTL — "
                         f"{nw[0].strip()!r}")
      if any(n.startswith("4_SANITY_bug") for n in names) \
              and "%Warning-UNOPTFLAT" not in body("4_SANITY_bug"):
          bad.append("the bug wiring no longer trips UNOPTFLAT: loop detection has gone "
                     "BLIND, so a clean lint verdict from this run means nothing")
      if "%Warning-UNOPTFLAT" in body("4_SANITY_tie"):
          bad.append("the structural tie trips UNOPTFLAT — loop detection is no longer "
                     "precise about its cause")
      for b in bad:
          print("lint: FAIL —", b)
      sys.exit(1 if bad else 0)
      EOF
    check_proof:
      must_pass: ci/fixtures/lint/pass
      must_fail:
        - ci/fixtures/lint/fail-wrapper-skipped
        - ci/fixtures/lint/fail-pass-did-not-run
        - ci/fixtures/lint/fail-nonwaived-finding
        - ci/fixtures/lint/fail-sanity-blind
        - ci/fixtures/lint/fail-no-logs
    artifacts:
      - build/lint/**

  - id: elab
    phase: rtl
    gate: block
    label: soclabs-sim
    description: "VCS structural elaboration of the whole chiplet (598 files, 211 modules)"
    # Both generators early-out on directory existence, so a previous FAILED run
    # leaves partial trees the next run skips over. Derived state must go.
    pre:
      - rm -rf tidelink/deps/xhb500/generated nanosoc-multicore-system/build_soc build/elab
    run: make elab
    # A BARE 'CPU time:' IS NOT COMPLETION EVIDENCE, and that is the whole reason
    # this check names the LINK phase. Measured 2026-08-17 by running VCS on a
    # module with a missing child: the failed run ends
    #
    #     Error-[CFCILFBI] Cannot find cell in liblist
    #     ...
    #     1 error
    #     CPU time: .199 seconds to compile
    #
    # — it prints a CPU-time line like every other run, but with no elab and no
    # link phase in it. A successful run ends "CPU time: N seconds to compile +
    # N to elab + N to link". So `to link` separates them and `CPU time:` does
    # not. The same shape covers a killed run, which is why this is asserted
    # rather than inferred from the absence of errors: a log with zero Error-[
    # lines that stopped mid-build is NOT ELABORATED, not clean.
    check: |
      L=build/elab/elab.log
      test -s "$L" || { echo "elab: FAIL — no VCS log at $L; the stage produced no evidence"; exit 1; }
      if grep -aqE '^Error-\[' "$L"; then
        echo "elab: FAIL — VCS reported elaboration errors:"
        grep -anE '^Error-\[' "$L" | head -5
        exit 1
      fi
      grep -aqE 'CPU time:.*to link' "$L" || {
        echo "elab: FAIL — no 'CPU time: ... to link' line, so VCS never reached the"
        echo "  link step. An error-free log that did not finish means NOT ELABORATED."
        echo "  (a FAILED run prints 'CPU time: ... to compile' too — do not weaken this"
        echo "   to a bare 'CPU time:' grep; that was measured, both directions)"
        echo "  log: $L ($(wc -c <"$L") bytes)"
        exit 1; }
      grep -aqE '^All of [0-9]+ modules done' "$L" || {
        echo "elab: FAIL — no 'All of N modules done' line; the module build never completed"
        exit 1; }
    check_proof:
      must_pass: ci/fixtures/elab/pass
      must_fail:
        - ci/fixtures/elab/fail-vcs-error
        - ci/fixtures/elab/fail-cut-off
        - ci/fixtures/elab/fail-no-log
    artifacts:
      - build/elab/*.log
      - build/elab/*.flist

  - id: elab-strict
    phase: rtl
    gate: block
    label: soclabs-sim
    description: "xrun -hal: multiple-driver gate over the elaborated design"
    run: make elab-strict
    # The gate greps the log for MLTDRV. If HAL ABORTS EARLY (*E,BLDSTP,
    # "Analysis failed") the multi-driver rules never run, the grep finds
    # nothing, and the stage reports OK — a false green, observed 2026-08-06.
    # Assert the analysis actually completed before believing the verdict.
    #
    # THIS MIRRORS verif/elab_strict/run.sh:113-130 LINE FOR LINE, deliberately.
    # It did not, until 2026-08-17, and was wrong in two ways at once:
    #
    #   * it asserted 'Analysis complete'. HAL 22.03 NEVER PRINTS THAT STRING in
    #     this mode — only "Analysis failed." on abort. On the 43 MB log of a
    #     COMPLETED run it occurs zero times, while `^halstruct:` occurs 60,493
    #     times. So this blocking gate could not pass on a good run, and the
    #     runner it wraps had already documented exactly that. halstruct is the
    #     engine that OWNS the MLTDRV rule, so its output is the completion
    #     evidence: thousands of lines on a complete run, none on an aborted one.
    #
    #   * it used plain `grep -q`. The log carries binary bytes, and GNU grep
    #     without -a stops matching at the first NUL — measured on this host,
    #     `grep -q '^halstruct:'` returns 1 on a log where `grep -aq` returns 0.
    #     Here -a changes the EXIT STATUS, not just the printed output.
    #
    # Proven against ci/fixtures/elab-strict/ by `signoff.py prove` — including a
    # must-pass fixture that contains no 'Analysis complete' and does contain a
    # NUL, i.e. the exact log the old check rejected.
    check: |
      L=verif/elab_strict/build/xrun_hal.log
      test -f "$L" || { echo "no HAL log at $L"; exit 1; }
      if grep -aqE '\*E,BLDSTP|Analysis failed' "$L"; then
        echo "HAL ABORTED before the rule set completed — the MLTDRV verdict is meaningless"
        grep -a -m5 -E '\*E,(BLDSTP|[A-Z]+)' "$L"; exit 1
      fi
      grep -aq '^halstruct:' "$L" || {
        echo "halstruct never ran — no structural rules were applied."
        echo "A zero MLTDRV count here would mean 'not checked', not 'clean'."
        exit 1; }
      # THIRD GUARD: the run must have FINISHED, not merely STARTED.
      #
      # Added 2026-08-17 after this gate went false-green a SECOND time, through
      # a hole the two guards above cannot see. A run took 3605.4s against its
      # own `timeout 3600` cap, was killed by the wall clock, and reported PASS:
      # 109 MB / 284,834 halstruct lines against 43 MB / 60,493 on the last
      # known-complete pass, the log ending mid-message on a CLKDMN line.
      #
      # Neither guard above fires on a kill. A SIGTERM leaves no '*E,BLDSTP' and
      # no 'Analysis failed' — those are HAL's own abort strings and `timeout`
      # never gives it the chance to write them — and by 60 minutes hundreds of
      # thousands of '^halstruct:' lines are already on disk.
      #
      # run.sh now captures `timeout`'s exit status (124/137) directly, which is
      # the unambiguous signal. THIS FILE CANNOT: it re-reads evidence after the
      # fact and has no exit status to inspect. So it asserts completion from the
      # ARTEFACT instead — a finished run emits a rule-tally summary block
      # ("VERREP (3)", "ALOWID (979)", "DUPMCR (17)" ...); tonight's killed log
      # contains ZERO such lines. Measured, both directions.
      #
      # HOW THE THREE GUARDS LAYER — measured, and stated here because otherwise
      # someone will notice the overlap and "simplify" one away:
      #
      #   guard 1  '*E,BLDSTP|Analysis failed'  -> HAL ABORTED gracefully
      #   guard 2  '^halstruct:' absent         -> rules NEVER STARTED
      #   guard 3  rule tally absent            -> rules started and were CUT OFF
      #
      # ALL THREE ARE LOAD-BEARING. None is redundant, and guard 1 is the one
      # most likely to look redundant and get deleted, so: a REAL aborted run
      # DOES emit the tally block. Measured on a genuine abort — 40 tally lines,
      # 0 halstruct, 2 abort markers. (An earlier version of this comment said
      # the opposite. That was measured off a 322-byte hand-written fixture and
      # was a property of the fixture, not of HAL. Corrected 2026-08-17.)
      #
      # The case that proves guard 1 cannot go is an abort AFTER halstruct has
      # run — which is the shape elab-strict actually has, since it emits
      # hundreds of thousands of halstruct lines long before it reaches the end:
      #
      #     halstruct > 0   -> guard 2 PASSES
      #     tally present   -> guard 3 PASSES
      #     abort strings   -> ONLY guard 1 fires
      #
      # There, guard 1 is the only thing between an aborted run and a green
      # blocking gate. It is pinned by fail-aborted-after-halstruct, built from
      # real tool output rather than hand-written text, precisely because the
      # hand-written one is what produced the wrong conclusion above.
      #
      # Every arm is pinned by a fixture under ci/fixtures/elab-strict/ and
      # proven by `signoff.py prove`. Note what that proof does NOT tell you: it
      # confirms the checks are self-consistent with the fixtures, not that the
      # fixtures resemble the tool. A green prove run over an unrepresentative
      # fixture is the same class of false comfort as this gate's own PASS at
      # 3605.4s. Fixtures earn the same scepticism as the gates.
      grep -aqE '^ *[A-Z]{5,6} \([0-9]+\)' "$L" || {
        echo "HAL was KILLED before it finished — no rule-tally summary in the log."
        echo "The run started and was cut off (probably the timeout cap, see"
        echo "ELAB_STRICT_TIMEOUT in verif/elab_strict/run.sh). MLTDRV=0 here means"
        echo "NOT MEASURED, not clean, and must never be reported as a pass."
        echo "  log: $L ($(wc -c <"$L") bytes, $(grep -ac '^halstruct:' "$L") halstruct lines)"
        exit 1; }
    check_proof:
      must_pass: ci/fixtures/elab-strict/pass
      must_fail:
        - ci/fixtures/elab-strict/fail-aborted
        - ci/fixtures/elab-strict/fail-halstruct-never-ran
        - ci/fixtures/elab-strict/fail-no-log
        - ci/fixtures/elab-strict/fail-killed
        - ci/fixtures/elab-strict/fail-aborted-after-halstruct
    artifacts:
      - verif/elab_strict/build/*.log
      - verif/elab_strict/build/*.f
      - verif/elab_strict/build/xrun_hal.history
      - verif/elab_strict/build/xcelium.d/run.*/invoke_failure

  - id: cdc
    phase: rtl
    gate: report
    label: soclabs-sim
    description: "HAL structural + CDC (CLKDMN/CMBCDC/RSTSYN/INSYNC/FLSYNC) over the integrated top"
    # report, not block: docs/CDC_FINDINGS.md calls this "a starting point for
    # the physical team's CDC signoff, not a clean bill". Gating it today would
    # gate on a known-nonzero baseline. Promote to block once triaged.
    run: make cdc
    artifacts:
      - verif/cdc/build/*.log
      - verif/cdc/build/*.err
      - verif/cdc/build/*.f
      - verif/cdc/build/xrun_hal.history

  - id: regress
    phase: rtl
    gate: block
    label: soclabs-sim
    description: "Functional regression suite"
    run: make regress
    # A SKIPPED TEST IS NOT A PASSED TEST, and until 2026-08-17 nothing here
    # could tell the two apart. scripts/regress.sh's cocotb verdict is
    #
    #     tc=$(grep -c '<testcase' "$xml"); fa=$(grep -cE '<failure|<error' "$xml")
    #     if [ "$tc" -ge 1 ] && [ "$fa" -eq 0 ]; then pass_row ...
    #
    # and cocotb writes <skipped /> INSIDE a <testcase>, so a skipped test counts
    # toward tc and contributes nothing to fa. Measured on the real
    # verif/g2_soc_pair/results.xml of 2026-08-08: FIVE testcases, FOUR of them
    # <skipped /> — including test_peer_write_crosses_to_die_b, the headline
    # cross-die write proof — and the harness reported
    # "g2_soc_pair PASS  5 testcase(s), 0 failures".
    #
    # That is the same defect as the lint stage's SKIPPED PASS, and this repo has
    # already settled the principle for it, in verif/lint/run.sh's own header:
    # "A PASS THAT DID NOT RUN IS NOT A CLEAN PASS". A deliberately-disabled
    # proof is a narrowing of what this pipeline claims, so it belongs in
    # `unsupported:` where `refuted_by:` keeps it honest — never inside a green
    # blocking gate.
    check: |
      python3 - <<'EOF'
      import os, sys, xml.etree.ElementTree as ET
      SUITES = [("verif/g2_peer_aperture/results.xml", "g2_peer_aperture"),
                ("verif/g2_soc_pair/results.xml",      "g2_soc_pair")]
      bad = 0
      for path, name in SUITES:
          if not os.path.exists(path):
              print(f"{name}: FAIL — no results.xml at {path}; the build or the run "
                    f"died. 'No output' is not 'no failures'")
              bad += 1; continue
          try:
              tcs = ET.parse(path).getroot().findall(".//testcase")
          except ET.ParseError as e:
              print(f"{name}: FAIL — results.xml does not parse ({e}); a partial file "
                    f"is a partial run"); bad += 1; continue
          if not tcs:
              print(f"{name}: FAIL — 0 testcases. The suite executed nothing, and a "
                    f"loop over nothing reports no failures"); bad += 1; continue
          failed  = [t.get("name") for t in tcs
                     if t.find("failure") is not None or t.find("error") is not None]
          skipped = [t.get("name") for t in tcs if t.find("skipped") is not None]
          if failed:
              print(f"{name}: FAIL — {len(failed)}/{len(tcs)} testcase(s) failed: "
                    + ", ".join(failed[:4])); bad += 1
          if skipped:
              print(f"{name}: FAIL — {len(skipped)}/{len(tcs)} testcase(s) were SKIPPED "
                    f"and never executed: " + ", ".join(skipped[:4]))
              print(f"    regress.sh counts these toward its testcase total and reports "
                    f"'{len(tcs)} testcase(s), 0 failures'. Declare a deliberately "
                    f"disabled proof under `unsupported:` instead.")
              bad += 1
          if not failed and not skipped:
              print(f"{name}: PASS — {len(tcs)} testcase(s) executed, 0 failures")
      sys.exit(1 if bad else 0)
      EOF
    check_proof:
      must_pass: ci/fixtures/regress/pass
      must_fail:
        - ci/fixtures/regress/fail-skipped-tests
        - ci/fixtures/regress/fail-failure-element
        - ci/fixtures/regress/fail-zero-testcases
        - ci/fixtures/regress/fail-no-xml
    artifacts:
      - build/regress/*.log
      - verif/g2_peer_aperture/results*.xml
      - verif/g2_soc_pair/results*.xml

  # --- Physical phase — srv03335 only (needs ${TSMC_65_HOME} + ASIC/romlibs) -------
  #
  # IMPLEMENTATION IS NOT HERE. syn -> place -> CTS -> route -> GDSII -> bundle
  # is .github/workflows/asic-gds.yml, which already stages it, reports each
  # stage to the job summary and uploads reports even on failure. Re-declaring
  # those stages here would give two competing entry points to one Innovus DB.
  #
  # These stages VERIFY what that flow BUILT, so they need a completed
  # implementation run in ASIC/genus-innovus/work first. Run order:
  #     asic-signoff (rtl)  ->  asic-gds  ->  asic-signoff (physical)
  #
  # WHICH BUILD THESE STAGES GRADE, AND HOW FAR THAT PROMOTION REACHES
  # ------------------------------------------------------------------
  # 2026-08-18: rom-gds and drc moved from full-20260814 to fp1505, and lec-pnr
  # moved its REVISED side only. fp1505 is the promoted place-and-route build —
  # Innovus check_drc reports 0 rail-to-rail VDD/VSS shorts on it against
  # full-20260814's 4 (docs/tapeout/43-drc-fp1505.md).
  #
  # THE PROMOTION IS PHYSICAL ONLY. It does NOT extend to synthesis and it does
  # NOT extend to timing, and both exclusions are properties of fp1505 rather
  # than preferences:
  #
  #   * NO SYNTHESIS. build/fp1505/outputs/ holds no _gate.v and no
  #     _gate_power.v; its work/innovus.log records it reading full-20260814's
  #     _gate_power.v. So `lec` and lec-pnr's GOLDEN side stay put — the
  #     synthesised netlist under signoff IS full-20260814's, unchanged.
  #   * NO CONSTRAINTS OF ITS OWN. build/fp1505/outputs/
  #     nanosoc_eth_chiplet_pads_syn.sdc is a SYMLINK to full-20260814's; fp1505
  #     re-ran floorplan and P&R against the older synthesis SDC. AND
  #     ASIC/sta/run_sta.sh:6-9 REFUSES fp1505 BY NAME ("the live route, netlist
  #     written 21:33, no route_manifest.txt"), because reading a database that
  #     is still being written produces a corrupt-DB report that reads like a
  #     design bug. TREAT THAT REFUSAL AS A CORRECT GUARD. Any timing stage
  #     added here stays on full-20260814 until fp1505 has its own closed
  #     synthesis and its own route manifest. There is no STA stage in this
  #     manifest today (sta-signoff sits in `unsupported` below), so nothing was
  #     moved on the timing side and nothing needs to be.

  # --- Boot ROM contents ------------------------------------------------------
  # THERE WAS A `romlibs` CHECK IN THIS FLOW FOR MONTHS AND IT WAS NOT A CONTENT
  # CHECK. `make romlibs-check` asserted that four files existed and were
  # non-empty, and it passed every day while eth_rom held random data and cc_rom
  # held a different program from the one its spec names. It never appeared in
  # this manifest at all, so the signoff report did not even claim it.
  # These two rows are what that check should always have been.
  #
  # Physical phase, srv03335: ASIC/romlibs is gitignored (fetched or built), and
  # the code files come from the firmware build tree. Neither exists on a bare
  # sim runner.
  - id: rom-selftest
    phase: physical
    gate: block
    label: soclabs-pdk
    description: "Mutation-test the ROM gate itself — 25 cases, both directions"
    # Runs BEFORE rom-content, deliberately, exactly as lec-selftest runs before
    # lec. It feeds the gate a ROM that IS the firmware (must pass), one bit
    # flipped in one word, a truncated code file, an empty ROM directory, a
    # checker that exits 0 without writing anything, a checker whose JSON and
    # exit status disagree, and a checker that crashed — and requires each to
    # fail NAMING THE RIGHT CAUSE. ~3 s, no licence, no design data.
    run: make -C ASIC -f common.mk romlibs-selftest
    check: |
      # THE EXACT COUNT, not a decade-wide window. This read `2[0-9]` until
      # 2026-08-17, while the selftest ran 25 cases and this manifest's own
      # description said 22 — so the number was never actually asserted, and the
      # case list could have lost FIVE cases (20% of the proof) with the gate
      # still green. The comment above it claimed "the count is asserted, not
      # just the exit status"; it was asserted only to within a decade.
      #
      # 25 = 23 expect_fail + 2 expect_pass in ROM_SELFTEST_PY (ASIC/rom_gate.mk).
      # Pinned in BOTH directions, exactly as ASIC/asic-toolkit/test/MUTATION_COVERAGE
      # pins its own numbers and for the same reason: fewer means a proof was
      # dropped; more means one was added and nobody reviewed it. If you add a
      # case, this line and the description above move together.
      make -C ASIC -f common.mk --no-print-directory romlibs-selftest 2>&1 \
        | grep -qE '^SELFTEST: 25 passed, 0 failed' \
        || { echo "the ROM gate selftest did not run its full 25-case list, or a case failed"
             echo "  (if you deliberately added or removed a case, update BOTH this count"
             echo "   and the stage description — an unreviewed change to what this gate"
             echo "   proves is not a pass)"; exit 1; }
    check_proof:
      must_pass: ci/fixtures/rom-selftest/pass
      must_fail:
        - ci/fixtures/rom-selftest/fail-short-caselist
        # 24 of 25. The case the old `2[0-9]` regex ACCEPTED: one dropped proof,
        # still inside the decade, reported as a full clean run. This fixture is
        # the whole argument for pinning the exact number.
        - ci/fixtures/rom-selftest/fail-one-case-dropped
        - ci/fixtures/rom-selftest/fail-case-failed
    artifacts:
      - build/rom_verify/selftest/**

  - id: rom-content
    phase: physical
    gate: block
    label: soclabs-pdk
    description: "Both boot ROM macros contain the boot firmware, word for word"
    # The ROMs are MASK PROGRAMMED: wrong bits are a dead die and there is no
    # metal fix. Nothing else in this pipeline reads ROM contents — LEC compares
    # netlists, DRC compares geometry, and a ROM full of noise passes both.
    #
    # The gate (ASIC/rom_gate.mk) asserts, per ROM: the .lib/.lef Genus opens
    # exist; spec, RTL wrapper, built macro and code file agree on depth and
    # address width; and every word of the compiled macro equals the
    # corresponding word of the firmware code file (scripts/ci/rom_verify.py,
    # checks: content_equivalence, physical_decode, code_file_sanity, geometry,
    # provenance, image_plausibility, hex_chain). sim_divergence is a WARNING by
    # design and is surfaced, not gated.
    #
    # ── 2026-08-18: THIS STAGE WAS RED FOR A WIRING REASON, NOT A ROM REASON ──
    #
    # Its two halves resolved ROMLIBS_DIR to DIFFERENT TREES and neither said so:
    #
    #   run:    make -C ASIC/genus-innovus romlibs-check
    #             -> that Makefile:128 sets ROM_RUN_DIR := $(OUT_DIR)/romlibs and
    #                passes it down, so the gate BUILT AND GRADED
    #                ASIC/genus-innovus/outputs/romlibs
    #   check:  make -C ASIC -f common.mk rom-vars
    #             -> no override, so ASIC/common.mk:434's
    #                ROMLIBS_DIR := .../ASIC/romlibs wins
    #
    # The check then required each result JSON to NAME the directory rom-vars
    # reported — a good clause, and the only reason the divergence was visible at
    # all — so the stage failed on a path, on ROMs that are byte-identical in all
    # three trees (md5 on every .rcf and .memlib: ASIC/romlibs,
    # ASIC/genus-innovus/outputs/romlibs and the shipping build's own). A red for
    # a wiring reason is worse than a green: it trains people to discount the one
    # gate that stands between a firmware change and a dead die.
    #
    # THE FIX IS NOT "point check: at the other tree". Both halves now name ONE
    # tree, spelled out, and it is the tree the netlist under signoff actually
    # compiled in — build/full-20260814/romlibs, the directory the LEC dofile
    # itself reads its ROM .libs from. Same doctrine as rom-gds's RUN_TAG and
    # lec-pnr's two tags: WHEN A BUILD SUPERSEDES THIS ONE, CHANGE THE STRING IN
    # ALL THREE PLACES BELOW — run:, check: and needs_implementation: — they are
    # the same string on purpose, so this stage cannot declare one tree and
    # measure another.
    #
    # `romlibs-verify`, NOT `rom-run`/`romlibs-check`. Those BUILD the macros
    # before grading them, which is right for `syn` (a firmware change must not
    # reach the .bintxt without reaching the macro) and wrong here: this stage
    # grades a COMPLETED build's ROMs and must not write into that build. The
    # gating is identical — rom_build.mk:rom-run ends by invoking exactly
    # `romlibs-verify ROMLIBS_DIR=$(ROM_RUN_DIR)` — so nothing checked was
    # dropped, only the build step. Verified read-only: romlibs-verify writes to
    # $(ROM_VERIFY_DIR) alone.
    #
    # MUTATION-PROVEN 2026-08-18 against this exact invocation, on a COPY of the
    # tree: flipping ONE bit-cell instance in eth_rom_via.cdl (XCCCELL[0_41]
    # CCS01 -> CCS11, one bit of one word of the PHYSICAL view) took the gate
    # from "13 passed, 0 FAILURES, VERDICT: PASS" to "physical_consistency:
    # VIEW/SILICON DIVERGENCE ... 3217 set bits vs 3216", VERDICT: FAIL, rc=2.
    # The gate still discriminates; it was never the ROMs that were wrong.
    #
    # AND THE EVIDENCE SLOT NOW RECORDS WHAT IT GRADED. build/rom_verify is a
    # single mutable slot shared by every invocation of this gate — an earlier
    # run's JSONs were silently overwritten at 12:20 on 2026-08-18 — and nothing
    # in it said which ROM tree produced it. run: now writes graded_tree.txt
    # beside the JSONs and check: ASSERTS that it names the tree rom-vars
    # reports, so a slot left behind by a different invocation is a FAILURE
    # rather than a silent substitution. It is derived from rom-vars' own output
    # rather than hard-coded, so it keeps working when the string above moves.
    run: |
      set -uo pipefail
      ROMTREE="$PWD/ASIC/eth-chiplet/build/full-20260814/romlibs"
      make -C ASIC -f common.mk --no-print-directory romlibs-verify \
           ROMLIBS_DIR="$ROMTREE"
      rc=${PIPESTATUS[0]}
      # The stamp is written ONLY on a pass, and after the JSONs, so a failed or
      # half-finished run cannot leave one that vouches for the slot.
      if [ "$rc" -eq 0 ]; then
        mkdir -p build/rom_verify
        { echo "# what the ROM content gate last graded into this slot."
          echo "# ASSERTED by ci/signoff.yaml's rom-content check: — not a note."
          echo "graded_tree=$ROMTREE"
          echo "graded_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "graded_commit=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          for m in "$ROMTREE"/eth_rom/eth_rom_via.memlib \
                   "$ROMTREE"/cc_rom/rom_via.memlib; do
            echo "graded_macro=$(sha256sum "$m" 2>/dev/null || echo "MISSING $m")"
          done
        } > build/rom_verify/graded_tree.txt
      fi
      exit "$rc"
    # Re-read the evidence rather than trusting the stage's exit code. This is
    # the same doctrine as the drc/lec rows: an artefact that does not exist, does
    # not parse, names a different ROM, or reports zero words compared is a
    # FAILURE. "No output" must never read as "no problems".
    check: |
      python3 - <<'EOF'
      import json, os, subprocess, sys
      # THE SAME TREE run: NAMES. Change both together, or this stage grades a
      # directory its own run never touched.
      ROMTREE = os.path.abspath("ASIC/eth-chiplet/build/full-20260814/romlibs")
      rows = subprocess.run(["make", "-C", "ASIC", "-f", "common.mk",
                             "--no-print-directory", "rom-vars",
                             "ROMLIBS_DIR=" + ROMTREE],
                            capture_output=True, text=True).stdout.split()
      if not rows:
          print("cannot read the ROM table from ASIC/common.mk"); sys.exit(1)
      bad = 0
      trees = set()
      for row in rows:
          name, label, romdir, code, memlib, inst, js, bits = row.split("|")
          trees.add(os.path.dirname(romdir.rstrip("/")))
          problems = []
          if not os.path.exists(js):
              print(f"{label}: FAIL — no result at {js}, the gate did not run"); bad += 1; continue
          d = json.load(open(js))
          words = [v for r in d.get("roms", [])
                   for k, v in r.get("code_file_sanity", {}).items() if k == "words"]
          if str(d.get("verdict", "")).upper() != "PASS":
              problems.append(f"verdict is {d.get('verdict')!r}")
          blob = json.dumps({k: v for k, v in d.items() if k != "argv"})
          if romdir not in blob or code not in blob:
              problems.append(f"the result does not name {romdir} and {code}")
          if not words or max(words) == 0:
              problems.append("it reports no words compared, which is not a pass")
          if problems:
              print(f"{label}: FAIL — " + "; ".join(problems) + f"  ({js})"); bad += 1
          else:
              print(f"{label}: PASS — {max(words)} words match {os.path.basename(code)}")
      # THE SLOT MUST SAY WHICH TREE IT HOLDS EVIDENCE FOR. build/rom_verify is
      # one mutable directory that every invocation of this gate overwrites; a
      # JSON alone cannot distinguish "this run's evidence" from "somebody
      # else's, left here". Derived from rom-vars, not hard-coded, so it follows
      # the tree above rather than needing to be remembered separately.
      stamp = "build/rom_verify/graded_tree.txt"
      want = sorted(trees)
      if not os.path.exists(stamp):
          print(f"FAIL — no {stamp}: this evidence slot does not record which ROM "
                f"tree produced it, so it cannot be told apart from a slot left "
                f"behind by another invocation")
          bad += 1
      else:
          got = [l.split("=", 1)[1].strip()
                 for l in open(stamp, errors="replace").read().splitlines()
                 if l.startswith("graded_tree=")]
          if not got:
              print(f"FAIL — {stamp} carries no 'graded_tree=' line"); bad += 1
          elif sorted(set(got)) != want:
              print(f"FAIL — {stamp} says the evidence in this slot was produced "
                    f"from {got}, but this stage grades {want}. The slot holds "
                    f"another run's results"); bad += 1
          else:
              macros = [l.split("=", 1)[1].strip()
                        for l in open(stamp, errors="replace").read().splitlines()
                        if l.startswith("graded_macro=")]
              stray = [m for m in macros
                       if not any(t in m for t in want) or m.startswith("MISSING")]
              if not macros:
                  print(f"FAIL — {stamp} names no macro; it vouches for a tree "
                        f"without recording a single file out of it"); bad += 1
              elif stray:
                  print(f"FAIL — {stamp} records macro(s) outside the graded "
                        f"tree, or missing: {stray}"); bad += 1
              else:
                  print(f"slot: PASS — evidence produced from {got[0]} "
                        f"({len(macros)} macro(s) recorded)")
      sys.exit(1 if bad else 0)
      EOF
    # ABSENT TREE => UNVERIFIED, not FAIL. The distinction matters here: a build
    # that has been cleaned away indicts the RUN, and a ROM full of the wrong
    # bits indicts the DESIGN, and this stage must never report the first as the
    # second. Same string as run: and check: above, on purpose.
    needs_implementation:
      - ASIC/eth-chiplet/build/full-20260814/romlibs/eth_rom/eth_rom_via.memlib
      - ASIC/eth-chiplet/build/full-20260814/romlibs/cc_rom/rom_via.memlib
    check_proof:
      must_pass: ci/fixtures/rom-content/pass
      must_fail:
        - ci/fixtures/rom-content/fail-verdict
        - ci/fixtures/rom-content/fail-zero-words
        - ci/fixtures/rom-content/fail-no-result
        - ci/fixtures/rom-content/fail-wrong-rom
        # The slot holds a real, PASSING result — for a DIFFERENT ROM tree. This
        # is the shape build/rom_verify actually takes: one mutable directory,
        # overwritten by whichever invocation ran last.
        - ci/fixtures/rom-content/fail-other-tree
        # A slot with no stamp at all: the state every run before 2026-08-18
        # left behind, and indistinguishable from another run's evidence.
        - ci/fixtures/rom-content/fail-no-stamp
    artifacts:
      - build/rom_verify/*.json
      - build/rom_verify/*.log
      - build/rom_verify/graded_tree.txt

  - id: rom-gds
    phase: physical
    gate: block
    label: soclabs-pdk
    # NAMES THE EVIDENCE, and the driver enforces it (see signoff.py,
    # needs_implementation). This key used to be a bare `true` that nothing in
    # the driver ever read — a declaration that silently did nothing, which is
    # the same defect class as a check that cannot fail. It is now the exact
    # input `run:` consumes below: absent, the stage is UNVERIFIED, not FAIL.
    needs_implementation:
      - ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds
    # Content-correct at synthesis does NOT prove the bits reached the mask. The
    # macro is merged into the stream by write_stream from a hand-maintained
    # $gds_merge_list in scripts/config.tcl; a dropped or stale entry produces a
    # GDS that opens cleanly, passes DRC, and boots nothing.
    #
    # This decodes the via programming out of the MERGED stream and compares it
    # to the firmware code file. ~46 s for both ROMs on a 298 MB stream, no
    # licence. With no extractor installed it reports UNVERIFIED and FAILS —
    # never green for "could not check".
    #
    # NOT a hash or byte comparison against the standalone .gds2: Innovus
    # re-encodes records on merge, so 0 of 126 structure hashes match on a
    # CORRECT chip. Content extraction is the only sound test here.
    description: "The ROM words inside the merged tapeout stream are the boot firmware"
    # REPOINTED 2026-08-18, AND IT WAS BROKEN TWICE OVER.
    #
    #   1. ROM_GDS named ASIC/genus-innovus/outputs/nanosoc_eth_chiplet_pads.gds.
    #      THAT FILE DOES NOT EXIST, and nothing in that directory ever became
    #      it: outputs/ there holds eval/ and romlibs/, no netlist and no GDS.
    #      needs_implementation named the same absent path, so the stage
    #      rendered UNVERIFIED and run: was never reached to notice.
    #   2. `romlibs-gds-check` IS NOT COMMITTED AT HEAD. It exists only in a
    #      dirty working copy of ASIC/genus-innovus/Makefile. CI clones HEAD, so
    #      even given a real stream this line would have died with "No rule to
    #      make target". A gate that cannot run is not a gate -- and this is the
    #      one that catches a boot ROM that does not contain the boot firmware.
    #
    # Now names the stream that actually ships and calls the ROM gate directly.
    # `romlibs-gds-check` was a one-line forwarder to exactly this target with
    # exactly these variables (ROM_GDS, and ROM_GDS_GATE whose default is
    # `block` in ASIC/rom_gate.mk), so WHAT IS CHECKED IS UNCHANGED -- only the
    # input file and the route to it. `make -C ASIC -f common.mk` is the same
    # invocation form the rom-selftest stage above already uses, and
    # romlibs-verify-gds has been committed in ASIC/rom_gate.mk throughout.
    #
    # THE RUN TAG IS PINNED, deliberately, the way ASIC/sta/run_sta.sh:53 pins
    # it and for the same reason: a glob over build/*/ grades whichever run
    # sorts first, which at any moment may be a half-written live one. When a
    # run supersedes the pinned one, change it HERE AND IN needs_implementation
    # above -- they are the same string on purpose, so this stage cannot
    # declare one stream and measure another.
    #
    # MOVED full-20260814 -> fp1505, 2026-08-18, needs_implementation and run:
    # together. fp1505 is the promoted place-and-route build: Innovus check_drc
    # reports ZERO rail-to-rail VDD/VSS shorts on it against full-20260814's
    # four (docs/tapeout/43-drc-fp1505.md), so fp1505's
    # outputs/nanosoc_eth_chiplet_pads.gds is the stream that would be
    # submitted, and it is the only one whose ROM contents are worth asking
    # about. check: and artifacts: are NOT repointed with it, and that is not an
    # oversight: both read $(ROM_VERIFY_DIR), which flow.mk:387 anchors at
    # $(BUILD_DIR)/rom_verify -- one directory for all runs, no run tag in it.
    # The only thing in this stage that names a build is ROM_GDS.
    #
    # THIS IS A RE-MEASUREMENT, NOT A CARRY-OVER. fp1505 is a fresh write_stream,
    # so the 2026-08-17 verification of full-20260814's two boot ROMs says
    # nothing about it; a dropped or stale $gds_merge_list entry is exactly the
    # kind of fault a re-stream introduces.
    run: make -C ASIC -f common.mk romlibs-verify-gds ROM_GDS=$PWD/ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds
    check: |
      python3 - <<'EOF'
      import os, subprocess, sys
      rows = subprocess.run(["make", "-C", "ASIC", "-f", "common.mk",
                             "--no-print-directory", "rom-vars"],
                            capture_output=True, text=True).stdout.split()
      # Same guard as rom-content, and for the same reason: with no rows this
      # loop runs zero times and exits 0, i.e. "the ROM table could not be read"
      # would render as "both ROMs verified". It was missing here until
      # 2026-08-17 — see the fail-no-rom-table fixture, which is the case that
      # found it.
      if not rows:
          print("cannot read the ROM table from ASIC/common.mk"); sys.exit(1)
      bad = 0
      for row in rows:
          name, label, romdir, code, memlib, inst, js, bits = row.split("|")
          if not os.path.exists(bits):
              print(f"{label}: nothing extracted at {bits} — the stream was not read"); bad += 1; continue
          got = [l.strip() for l in open(bits) if l.strip()]
          want = [l.strip() for l in open(code) if l.strip()]
          depth = int([w for w in open(memlib) if "NumberOfWords" in w][0].split(":")[1].strip(" ;\n"))
          if len(got) != depth:
              print(f"{label}: {len(got)} of {depth} words extracted — partial, not a measurement"); bad += 1; continue
          diff = [i for i in range(depth) if got[i] != want[i]]
          if diff:
              print(f"{label}: {len(diff)}/{depth} words in the stream differ, first at word {diff[0]}"); bad += 1
          else:
              print(f"{label}: PASS, all {depth} words in the stream match {os.path.basename(code)}")
      sys.exit(1 if bad else 0)
      EOF
    check_proof:
      must_pass: ci/fixtures/rom-gds/pass
      must_fail:
        - ci/fixtures/rom-gds/fail-word-differs
        - ci/fixtures/rom-gds/fail-partial-extract
        - ci/fixtures/rom-gds/fail-nothing-extracted
        - ci/fixtures/rom-gds/fail-no-rom-table
    artifacts:
      - build/rom_verify/*_gds.bits
      - build/rom_verify/*_gds.log

  - id: lec
    phase: physical
    gate: block
    label: soclabs-pdk
    # REPOINTED 2026-08-18 AT THE TOOLKIT RUN THAT HOLDS THE EVIDENCE.
    # This named ASIC/genus-innovus/work/{lec.dofile,fv}. work/lec.dofile IS NOT
    # THERE -- that tree's last tool run was 2026-08-13 -- so the stage rendered
    # UNVERIFIED and burned nothing, while the RTL-to-gate comparison for the
    # netlist under signoff was being run, and re-run, in the toolkit's build
    # tree. A gate pointed at an empty directory reports "not measured" forever
    # and never contradicts anything.
    #
    # These are the three INPUTS ASIC/asic-toolkit/mk/flow.mk:lec-syn asserts
    # before it takes a Conformal seat: the dofile Genus wrote during syn_map,
    # the gate netlist, and Genus's own fv model, which lives in work/ and which
    # `make clean` destroys.
    #
    # DELIBERATELY NOT MOVED TO fp1505, 2026-08-18 -- DO NOT "FIX" THIS.
    # rom-gds, drc and the REVISED half of lec-pnr all moved to fp1505 in that
    # edit; this stage did not, and the reason is a property of fp1505 rather
    # than a preference:
    #
    #   * build/fp1505/outputs/ contains NO nanosoc_eth_chiplet_pads_gate.v and
    #     no _gate_power.v. It is a place-and-route-only build -- its outputs
    #     are the GDS, the SDF, _pnr.v, and a SYMLINK to full-20260814's
    #     _syn.sdc. There is no synthesis in it to compare RTL against.
    #   * build/fp1505/work/innovus.log records the run READING
    #     full-20260814/outputs/nanosoc_eth_chiplet_pads_gate_power.v as its
    #     input netlist.
    #
    # So the synthesised netlist under signoff IS full-20260814's, unchanged, and
    # RTL-vs-gate equivalence proved against it carries over to fp1505 verbatim.
    # Pointing this stage at fp1505 would not re-measure anything: it would make
    # all three inputs below absent, and the stage would render UNVERIFIED --
    # which is precisely the state it was rescued from on 2026-08-18. The same
    # argument is what keeps lec-pnr's GOLDEN side on full-20260814 while its
    # REVISED side moves; read the split note there.
    needs_implementation:
      - ASIC/eth-chiplet/build/full-20260814/outputs/lec.dofile
      - ASIC/eth-chiplet/build/full-20260814/outputs/nanosoc_eth_chiplet_pads_gate.v
      - ASIC/eth-chiplet/build/full-20260814/work/fv
    # NOTE this compares RTL -> SYNTHESISED netlist (via Genus's fv_map). It
    # does NOT read outputs/*_pnr.v — there is no post-P&R LEC anywhere in the
    # repo, despite package_submission.sh's MANIFEST claiming otherwise.
    # Needs work/lec.dofile and work/fv/ from `syn`; `make clean` destroys both.
    description: "Conformal LEC — RTL vs SYNTHESISED netlist equivalence (not post-P&R)"
    # `lec-syn`, NOT the toolkit's `lec`. Both compare RTL against <block>_gate.v.
    # `lec` runs the generated dofile as Genus wrote it, and Genus bakes that
    # run's absolute logs/, work/fv and outputs/ paths into it plus a native
    # force-exit whose status the recipe discards; it has never been run in this
    # tree (there is no logs/lec.log anywhere under it). `lec-syn` rewrites those
    # paths, refuses a dofile that has lost its `set_dofile_abort exit`, and ends
    # with the same computed verdict the gate and pnr legs get -- and it is the
    # leg that has actually been run here.
    run: make -C ASIC/eth-chiplet lec-syn RUN_TAG=full-20260814
    # `exit -f` DOES return a nonzero bit-flag status on non-equivalence
    # (-Force only suppresses the confirmation prompt; see Conformal's
    # `<COMMAND> EXIT` help and the exit-status bit table in LEC_debug.html).
    # But the Makefile recipe discards that status, and the four ERROR strings
    # below are emitted by `puts` blocks GENUS writes into the dofile — so they
    # vanish if the dofile is regenerated by a different Genus or hand-written.
    # Assert the tool's own verdict line as well as those strings.
    # REWRITTEN 2026-08-17 AGAINST REAL CONFORMAL TRANSCRIPTS. Until tonight this
    # gate, and the fixtures under ci/fixtures/lec/, were written from inference —
    # ci/fixtures/README.md said so and rated the family "low confidence", asking
    # for re-derivation from "the first real logs/lec.log anyone produces".
    # `make lec-selftest` had meanwhile left three on disk (LEC 22.10-s200,
    # ASIC/genus-innovus/logs/lec_selftest_{equivalent,nonequivalent,extra_state}.log),
    # one per direction. Measured across all three:
    #
    #   marker                              equivalent  nonequivalent  extra_state
    #   'Different Key Points'                   0            0             0
    #   'Abort Points'                           0            0             0
    #   'Unknown Key Points'                     0            0             0
    #   'Compare Results:  PASS'                 1            0             0
    #
    # SO THE NEGATIVE GREP WAS DEAD CODE. Conformal does not emit any of those
    # three strings, in either direction — the whole clause could never fire, and
    # `fail-different-key-points` "proved" it only because that fixture was hand
    # written to contain a string the tool does not print. One clause was doing
    # all the work, exactly as the removed `|Equivalent` clause had been.
    #
    # The good news the same measurement settles: README's stated fear — that
    # those strings are row LABELS printed on every run, which would make this
    # gate unable to PASS — is refuted. It is only unable to fail that way.
    #
    # What Conformal really prints, both directions, is a verdict line and a
    # point census:
    #     6. Compare Results:                        PASS   / FAIL:NONEQ
    #     0 Non-equivalent point(s) reported         / 1 Non-equivalent point(s)
    #     0 Abort point(s) reported
    #     0 Not-compared point(s) reported
    # Those are what this now reads, and the fixtures are trimmed extracts of the
    # real transcripts rather than excerpts of what we believed they said.
    #
    # ── 2026-08-18: THIS GATE WAS GREEN OVER THE WRONG COMPARISON ──────────
    #
    # Until today the clause above was `re.search(...)` — the FIRST
    # `Compare Results:` line in the transcript. Genus's generated dofile does
    # not perform one comparison, it performs TWO, and the first is not the one
    # this stage is named after:
    #
    #   compare #1  golden fv_map          revised <block>_gate.v   58,672 pts
    #   `reset`
    #   compare #2  golden RTL             revised fv_map           <- THE ONE
    #
    # (The structure is documented, and asserted, by the toolkit's own
    # flow/verify/lec_syn_rewrite.tcl: "The dofile performs TWO comparisons …
    # The appended epilogue reads the FINAL compare state, which is compare #2's".)
    #
    # MEASURED on the real transcript, 2026-08-18: compare #2 died on its 21st
    # sub-compare and the file simply stops after
    # `// Command: compare -noneq_stop 1  -threads 1,4`. There is ONE
    # `Compare Results:` line in 815 KB of log and it is compare #1's, so the
    # gate read PASS over 58,672 points — a population the `gate` and `pnr` legs
    # report as 61,674, because it is a different comparison. There is, and has
    # ever been, NO end-to-end RTL→netlist equivalence proof in this repository:
    # `grep -rl 'LEC-VERDICT: tag=syn' --include=verdict.txt .` returns nothing,
    # here or in any archived run.
    #
    # (The [UNRESOLVED] in docs/tapeout/45 — whether 58,672 meant the gate was
    # grading the audit-mutant transcript instead — is settled and the answer is
    # no. 58,672 is compare #1's own count, printed in lec_syn.log itself at
    # `// 58672 compared points added to compare list`. The gate read the right
    # FILE and the wrong HALF.)
    #
    # WHAT IT NOW READS, and why each clause is here rather than one of them:
    #
    #   1. EVERY `Compare Results:` line, and at least two of them. One verdict
    #      means the run stopped before the RTL half. This is the clause that
    #      catches today's transcript.
    #   2. THE HARNESS'S OWN COMPUTED VERDICT, `LEC-VERDICT: RESULT=`, which
    #      run_lec.sh's epilogue appends AFTER the final compare — i.e. after
    #      the RTL one. Its absence *is* "the RTL comparison never finished".
    #      Its `tag=` and `golden=` are asserted too, so another leg's
    #      transcript (gate, pnr, an audit run) cannot satisfy this stage: a
    #      complete, healthy, PASSING netlist-vs-netlist transcript must still
    #      be refused here, and ci/fixtures/lec/fail-wrong-leg pins that.
    #   3. The point census, from the verdict block AND from Conformal's own
    #      `N <class> point(s) reported` lines, ALL occurrences — the syn leg is
    #      hierarchical and prints one set per sub-compare.
    #   4. reports/lec/syn/verdict.txt, the out-of-band artefact every finished
    #      leg writes (gate and pnr both have theirs), required to exist and to
    #      AGREE with the transcript — a stale verdict beside a fresh truncated
    #      log is exactly the shape lec-pnr's note warns about.
    #
    # EXPECT THIS STAGE TO BE RED until a syn leg completes. That is the finding,
    # not a regression introduced here, and it is the same honesty lec-selftest's
    # note asks for. Do NOT restore the green by reading one verdict line again.
    check: |
      python3 - <<'EOF'
      import re, sys
      B   = "ASIC/eth-chiplet/build/full-20260814"
      LOG = B + "/logs/lec_syn.log"
      VER = B + "/reports/lec/syn/verdict.txt"

      def read(p):
          try:
              return open(p, errors="replace").read()
          except OSError:
              return None

      t = read(LOG)
      if t is None:
          print(f"lec: FAIL — no LEC log at {LOG}; did 'syn' run in this work area?")
          sys.exit(1)
      if not t.strip():
          print(f"lec: FAIL — {LOG} is empty; Conformal produced no transcript")
          sys.exit(1)

      bad = []

      # 1. EVERY verdict line, not the first. The generated dofile compares
      #    fv_map vs <block>_gate.v FIRST and RTL vs fv_map SECOND.
      verdicts = re.findall(r"^\s*\d*\.?\s*Compare Results:\s+(\S+)", t, re.M)
      if not verdicts:
          bad.append("no 'Compare Results:' verdict line at all — the run did not "
                     "reach its own conclusion, which is NOT the same as equivalent")
      else:
          notpass = sorted({v.upper() for v in verdicts if v.upper() != "PASS"})
          if notpass:
              bad.append(f"Conformal reported {', '.join(notpass)} — "
                         f"{sum(1 for v in verdicts if v.upper() != 'PASS')} of "
                         f"{len(verdicts)} comparison(s) in this transcript are "
                         f"not PASS")
          if len(verdicts) < 2:
              bad.append(f"only {len(verdicts)} 'Compare Results:' verdict in the "
                         "transcript. The generated dofile performs TWO comparisons "
                         "— fv_map vs <block>_gate.v, then RTL vs fv_map — and the "
                         "RTL one is SECOND. A single verdict is the netlist-to-"
                         "netlist half alone: a different population, a different "
                         "comparison, and no RTL→gate proof")

      # 2. the harness's own computed verdict, appended AFTER the final compare.
      def vfield(text, key):
          m = re.search(rf"^LEC-VERDICT: {key}=(\S+)", text, re.M)
          return m.group(1) if m else None

      result = vfield(t, "RESULT")
      if result is None:
          bad.append("the transcript carries no LEC-VERDICT block. run_lec.sh "
                     "appends its computed verdict after the FINAL compare — the "
                     "RTL one — so its absence means the RTL comparison never "
                     "rendered a verdict")
      elif result.upper() != "PASS":
          bad.append(f"the harness's computed verdict is RESULT={result}, not PASS")
          for r in re.findall(r"^LEC-VERDICT: reason=(.+)$", t, re.M):
              bad.append(f"  reason: {r.strip()}")

      tag = vfield(t, "tag")
      if tag is not None and tag != "syn":
          bad.append(f"this transcript is the {tag!r} leg, not 'syn' — a complete "
                     f"and passing transcript of a DIFFERENT comparison")
      golden = vfield(t, "golden")
      if result is not None and (golden is None or not golden.startswith("RTL")):
          bad.append(f"the golden of the completed comparison is {golden!r}, not "
                     f"RTL. This stage claims RTL vs SYNTHESISED netlist, and a "
                     f"netlist-vs-netlist transcript does not prove it")

      cp = re.search(r"^LEC-VERDICT: (compare_points=.*)$", t, re.M)
      if result is not None and cp is None:
          bad.append("no 'LEC-VERDICT: compare_points=' census line — the verdict "
                     "block is truncated, so the population is unknown")
      elif cp is not None:
          n = dict(re.findall(r"(\w+)=(\d+)", cp.group(1)))
          pts = int(n.get("compare_points", 0))
          if pts == 0:
              bad.append("0 compare points. A comparison over nothing agrees with "
                         "itself perfectly; that is not equivalence")
          if int(n.get("equivalent", -1)) != pts:
              bad.append(f"{n.get('equivalent')} of {pts} points equivalent")
          for k, what in (("nonequivalent", "points are NOT equivalent"),
                          ("abort", "points ABORTED — not compared, so unknown"),
                          ("notcompared", "points were NOT COMPARED")):
              if int(n.get(k, 0)) != 0:
                  bad.append(f"{n[k]} {what}")

      # 3. Conformal's own census lines — ALL of them; the syn leg is
      #    hierarchical and prints one set per sub-compare.
      for label, what in (("Non-equivalent", "points are NOT equivalent"),
                          ("Abort", "points ABORTED — not compared, so unknown"),
                          ("Not-compared", "points were NOT COMPARED")):
          cs = re.findall(rf"^(\d+) {label} point\(s\) reported", t, re.M)
          if not cs:
              bad.append(f"no '{label} point(s) reported' census line — cannot tell "
                         f"whether any were found")
          else:
              nz = [c for c in cs if int(c) != 0]
              if nz:
                  bad.append(f"{'+'.join(nz)} {what}")

      # 4. the out-of-band verdict, which must exist AND agree.
      v = read(VER)
      if v is None:
          bad.append(f"no {VER}. Every leg that finishes writes one — the gate and "
                     f"pnr legs have theirs — so its absence is the run stopping "
                     f"before its own verdict")
      else:
          vr = re.search(r"^LEC: RESULT=(\S+)", v, re.M)
          if not vr:
              bad.append(f"{VER} carries no 'LEC: RESULT=' line")
          elif vr.group(1).upper() != "PASS":
              bad.append(f"{VER} records RESULT={vr.group(1)}")
          elif result is not None and result.upper() != vr.group(1).upper():
              bad.append(f"verdict.txt says {vr.group(1)} while the transcript says "
                         f"{result} — one of them is stale")
          vt = vfield(v, "tag")
          if vt is not None and vt != "syn":
              bad.append(f"{VER} is the {vt!r} leg's verdict, not 'syn'")

      for b in bad:
          print("lec: FAIL —", b)
      sys.exit(1 if bad else 0)
      EOF
    check_proof:
      # NO REAL PASSING syn TRANSCRIPT EXISTS TO DERIVE A FIXTURE FROM — that is
      # the finding this stage now reports, so must_pass is necessarily a
      # construction and says so in its own first lines. Its section grammar and
      # its LEC-VERDICT block are copied verbatim from the real transcripts in
      # build/full-20260814/logs/; only the point counts are small, exactly as in
      # every other fixture in this directory.
      must_pass: ci/fixtures/lec/pass
      must_fail:
        # THE DEFECT OF RECORD, IN REAL BYTES: three verbatim slices of the
        # 815 KB transcript that made this gate green — compare #1 passing,
        # compare #2 starting and the file ending. The old check returned PASS on
        # it. Nothing may make this case green.
        - ci/fixtures/lec/fail-truncated-rtl-half
        # A COMPLETE, HEALTHY, PASSING transcript of the WRONG comparison
        # (tag=gate, golden a netlist). Pins the clause that a different
        # population is a different proof, independently of truncation.
        - ci/fixtures/lec/fail-wrong-leg
        # The RTL comparison itself reporting FAIL:NONEQ, coherently: verdict
        # line, census line and LEC-VERDICT counters all say one non-equivalent
        # point. This is the direction the gate exists for.
        - ci/fixtures/lec/fail-nonequivalent
        # Verdict says PASS but the abort census is non-zero. SYNTHETIC BY DESIGN,
        # and labelled so: this shape was not observed, because Conformal reports
        # FAIL:ABORT when it aborts. It pins the census clause independently of
        # the verdict line, so a future version that reports PASS over aborted
        # points cannot walk through.
        - ci/fixtures/lec/fail-abort-points
        # The case the vacuous `|Equivalent` clause used to let through: the
        # summary table with no verdict line at all.
        - ci/fixtures/lec/fail-no-verdict-line
        - ci/fixtures/lec/fail-empty-log
    artifacts:
      - ASIC/eth-chiplet/build/full-20260814/logs/lec_syn.log*
      - ASIC/eth-chiplet/build/full-20260814/reports/lec/syn/**

  - id: lec-selftest
    phase: physical
    gate: block
    label: soclabs-pdk
    description: "Mutation-test the LEC harness itself — can it actually FAIL?"
    # Runs BEFORE lec-pnr, deliberately. It feeds the harness an equivalent pair,
    # a one-gate mutation, an extra flop and a missing netlist, and requires it
    # to pass the first and fail the rest. ~1 min, no design data needed.
    # A check that cannot fail is worth nothing, and this flow has shipped
    # several — elab-strict reported a clean design while its rules never ran.
    # Tee'd so the SUMMARY becomes an artefact. run_lec.sh prints its case tally
    # to the terminal only; the logs/ directory holds the per-case Conformal
    # transcripts and nothing that says how many cases ran.
    #
    # REPOINTED 2026-08-18 ONTO THE HARNESS THAT PRODUCES THIS PIPELINE'S LEC
    # EVIDENCE, AND THIS ONE IS A REAL CHANGE OF SCOPE -- read it before
    # believing a green.
    #
    # It mutation-tested ASIC/genus-innovus/scripts/lec/run_lec.sh. Nothing in
    # this pipeline any longer grades a verdict that harness produced: `lec` and
    # `lec-pnr` above now read ASIC/eth-chiplet/build/, whose transcripts and
    # verdicts come from ASIC/asic-toolkit/flow/verify/run_lec.sh. So the stage
    # was proving that a harness nobody reads can fail -- true, and irrelevant.
    # A self-test of the wrong harness is the same defect class as a check that
    # cannot fail: it is green for a reason unconnected to the thing at risk.
    #
    # WHAT CHANGED, EXPLICITLY, so nobody reads this as a like-for-like move:
    #   * 4 cases -> 9. The project harness declares equivalent, nonequivalent,
    #     extra_state, missing_input. The toolkit adds empty_input (a zero-length
    #     netlist, which `[ -e ]` calls present), bad_pg_pin (the dofile's own
    #     preflight, which nothing used to execute), pg_decoration,
    #     extra_nonsupply_pi and asym_unreachable. The count assertion below is
    #     exact, not a `[0-9]+` window, for the reason the original comment
    #     gives.
    #   * The toolkit's cases additionally assert WHY a case failed, against a
    #     declared reason pattern. A case that fails for the wrong reason is not
    #     evidence that the rule it attacks works.
    #   * The transcripts move from ASIC/genus-innovus/logs to this run's logs/.
    #     Both harnesses name them lec_selftest_<case>.log and both print the
    #     same "SELFTEST: all N cases behaved as declared" tally, so the two
    #     assertions below keep their exact shape.
    #
    # EXPECT THIS STAGE TO BE RED ON THE CURRENT EVIDENCE, and that is the
    # finding, not a regression introduced here. In the last recorded toolkit
    # selftest (reports/lec/selftest_*/verdict.txt, 2026-08-17 18:02) the
    # pg_decoration case DECLARES pass and COMPUTED FAIL: its tolerance list is
    # R:PI:VDD,R:PI:VSS but the netlist yields eight more supply-shaped unmapped
    # points (R:PI:VDD_z, R:PO:VDD, R:Z:VDD ...). One of nine cases misbehaving
    # is exactly what this stage exists to say out loud, and until it is
    # resolved in the toolkit the honest reading of `lec` and `lec-pnr` is that
    # their harness has a known-broken self-test case.
    # DELIBERATELY NOT MOVED TO fp1505, 2026-08-18 -- DO NOT "FIX" THIS EITHER,
    # and for a DIFFERENT reason from `lec` above. This stage does not grade the
    # design at all. It pushes the toolkit's nine deliberately mutated netlists
    # through the same Conformal harness to ask whether that harness can still
    # tell equivalent from non-equivalent; its subject is
    # flow/verify/run_lec.sh, not any build. RUN_TAG here only chooses the
    # directory the transcripts and the summary are written into, and
    # full-20260814 is where every recorded selftest of this harness already
    # lives. Repointing it would scatter the harness's history across two trees
    # and measure nothing new -- and note that check: reads that same directory,
    # so moving one without the other would leave the stage grading a directory
    # its own run never wrote to.
    pre:
      - mkdir -p ASIC/eth-chiplet/build/full-20260814/logs
    run: make -C ASIC/eth-chiplet lec-selftest RUN_TAG=full-20260814 2>&1 | tee ASIC/eth-chiplet/build/full-20260814/logs/lec_selftest_summary.log; exit ${PIPESTATUS[0]}
    # A MUTATION HARNESS THAT RUNS ZERO CASES EXITS 0. That is the hole this
    # stage existed to close for `lec` and had left open in itself — the same
    # defect rom-selftest's check: was added for. Two independent assertions,
    # because either alone can be satisfied by a harness that has stopped working:
    #
    #   1. the tally, with the EXACT case count. run_lec.sh declares four cases
    #      (equivalent, nonequivalent, extra_state, missing_input) and prints
    #      "SELFTEST: all 4 cases behaved as declared". Not a `[0-9]+` window —
    #      that is precisely the mistake rom-selftest's `2[0-9]` regex made, where
    #      a fifth of the case list could vanish inside the pattern.
    #
    #   2. THE DISCRIMINATION ITSELF, re-derived from the per-case transcripts
    #      rather than believed from the summary line. The negative case must
    #      really say FAIL and the positive one must really say PASS. A harness
    #      whose comparison has gone blind — every case reporting PASS — still
    #      prints "all 4 cases behaved as declared" if its expectation table has
    #      drifted with it, and that line would be the only evidence. Pinned by
    #      fail-harness-blind, which is exactly that: a correct-looking tally over
    #      a nonequivalent transcript that now reads PASS.
    check: |
      python3 - <<'EOF'
      import os, re, sys
      D = "ASIC/eth-chiplet/build/full-20260814/logs"
      S = os.path.join(D, "lec_selftest_summary.log")
      bad = []
      try:
          summary = open(S, errors="replace").read()
      except OSError:
          print(f"lec-selftest: FAIL — no summary at {S}; the harness left no tally, "
                f"so nothing says how many cases ran"); sys.exit(1)
      m = re.search(r"SELFTEST: all (\d+) cases behaved as declared", summary)
      if not m:
          f = re.search(r"SELFTEST: (\d+) of (\d+) cases misbehaved", summary)
          bad.append(f"{f.group(1)} of {f.group(2)} cases misbehaved — DO NOT TRUST lec/lec-pnr"
                     if f else "no 'SELFTEST: all N cases behaved as declared' line")
      elif int(m.group(1)) != 9:
          bad.append(f"the harness ran {m.group(1)} cases, not the 9 the toolkit's "
                     f"flow/verify/run_lec.sh declares (equivalent, nonequivalent, "
                     f"extra_state, missing_input, empty_input, bad_pg_pin, "
                     f"pg_decoration, extra_nonsupply_pi, asym_unreachable) — a case "
                     f"was dropped and the tally still reads clean")
      def verdict(case):
          p = os.path.join(D, f"lec_selftest_{case}.log")
          if not os.path.exists(p):
              return None
          v = re.search(r"Compare Results:\s+(\S+)", open(p, errors="replace").read())
          return v.group(1).upper() if v else "(no verdict line)"
      for case, want_pass in (("equivalent", True), ("nonequivalent", False),
                              ("extra_state", False)):
          got = verdict(case)
          if got is None:
              bad.append(f"case '{case}' left no transcript — it did not run")
          elif want_pass and got != "PASS":
              bad.append(f"case '{case}' should be equivalent but Conformal said {got} "
                         f"— the harness cannot PASS a correct netlist")
          elif not want_pass and got == "PASS":
              bad.append(f"case '{case}' is a deliberately broken netlist and Conformal "
                         f"said PASS — THE COMPARISON HAS GONE BLIND. A green `lec` or "
                         f"`lec-pnr` from this harness means nothing")
      for b in bad:
          print("lec-selftest: FAIL —", b)
      sys.exit(1 if bad else 0)
      EOF
    check_proof:
      must_pass: ci/fixtures/lec-selftest/pass
      must_fail:
        - ci/fixtures/lec-selftest/fail-harness-blind
        - ci/fixtures/lec-selftest/fail-short-caselist
        - ci/fixtures/lec-selftest/fail-case-misbehaved
        - ci/fixtures/lec-selftest/fail-no-summary
    artifacts:
      - ASIC/eth-chiplet/build/full-20260814/logs/lec_selftest*.log
      - ASIC/eth-chiplet/build/full-20260814/reports/lec/selftest_*/**

  - id: lec-pnr
    phase: physical
    gate: block
    label: soclabs-pdk
    # Exactly the two netlists the toolkit's flow/verify/run_lec.sh reads for
    # `pnr`. This stage holds a Conformal seat for up to six hours, so refusing
    # it in seconds when an input is absent is worth more here than anywhere
    # else.
    #
    # REPOINTED 2026-08-18. These two named ASIC/genus-innovus/outputs/, which
    # holds neither of them and holds no netlist at all -- so this stage, the
    # ONLY comparison in the pipeline that can see what place/CTS/route did to
    # the logic, has been reporting "not measured" while both netlists sat in
    # the toolkit's build tree and a real post-P&R LEC passed over them
    # (reports/lec/pnr/verdict.txt: 61674 compare points, 0 non-equivalent).
    #
    # SPLIT ACROSS TWO BUILDS, 2026-08-18, and the split IS the measurement.
    #
    #   GOLDEN  stays on full-20260814/outputs/*_gate_power.v, because that is
    #           the netlist place-and-route actually consumed: fp1505 has no
    #           _gate_power.v of its own, and build/fp1505/work/innovus.log
    #           records it reading full-20260814's.
    #   REVISED moves to fp1505/outputs/*_pnr.v, because fp1505 is the routed
    #           database being promoted (0 rail-to-rail VDD/VSS shorts against
    #           full-20260814's 4) and its _pnr.v is what write_stream turned
    #           into the stream rom-gds and drc now grade.
    #
    # Pointing BOTH at fp1505 would fail on an absent golden; leaving both on
    # full-20260814 would prove nothing about the netlist being shipped. The
    # toolkit supports exactly this split already and it is not a workaround:
    # ASIC/asic-toolkit/mk/flow.mk:222 drives SYN_OUT_DIR from SYN_RUN_TAG while
    # :215-218 drive OUT_DIR / LOG_DIR / REPORT_DIR from RUN_TAG, and
    # flow.mk:832-850 takes golden from $(SYN_OUT_DIR) and revised from
    # $(OUT_DIR). Measured with `make -C ASIC/eth-chiplet env RUN_TAG=fp1505
    # SYN_RUN_TAG=full-20260814`: SYN_OUT_DIR -> build/full-20260814/outputs,
    # RUN_DIR -> build/fp1505. The log and the reports follow RUN_TAG, which is
    # why check: and artifacts: below name fp1505 alone while
    # needs_implementation names both.
    needs_implementation:
      - ASIC/eth-chiplet/build/full-20260814/outputs/nanosoc_eth_chiplet_pads_gate_power.v
      - ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads_pnr.v
    timeout_s: 21600
    # Closes the gap this manifest previously declared under `unsupported`.
    # Golden is outputs/*_gate_power.v — the exact netlist 2_pnr_setup.tcl hands
    # to Innovus — so this isolates "did place/CTS/route/hold-fix change the
    # logic" with no RTL-side confounders. Flat compare: CTS clock cloning and
    # post-route opt punched new ports (MRxClk_clone1, FE_OFN*) through module
    # boundaries, so hierarchical pairing is impossible.
    # Unlike `lec` it needs nothing from work/ except its own inputs, so it
    # survives `make clean`.
    description: "Conformal LEC — synthesised netlist vs POST-P&R netlist"
    # NOT `make asic-lec-pnr`. That root forwarder now reaches the toolkit too,
    # but it carries no run tag, so it would resolve to RUN_TAG=default AND
    # SYN_RUN_TAG=default (flow.mk:129 defaults SYN_RUN_TAG to RUN_TAG) -- a
    # different build directory from the ones needs_implementation above names
    # and the one check: below reads. BOTH tags are spelled out here for the
    # same reason one is spelled out in rom-gds: a stage must not declare one
    # run and measure another. Omitting SYN_RUN_TAG would silently look for the
    # golden in build/fp1505/outputs/, where it does not exist, and flow.mk:833
    # would refuse in seconds -- a visible failure, but the wrong one.
    run: make -C ASIC/eth-chiplet lec-pnr RUN_TAG=fp1505 SYN_RUN_TAG=full-20260814
    # SAME TOOL, SAME GRAMMAR, SAME CHECK AS `lec` — deliberately, and read the
    # note there for the measurement behind it. This stage held a Conformal seat
    # for up to six hours and then reported on an exit status the Makefile recipe
    # discards. Worse than `lec`'s hole: nothing re-read the log, so a STALE
    # logs/lec_pnr.log left by an earlier run satisfied the stage without being
    # contradicted by anything, and this is the only comparison in the pipeline
    # that can see what place/CTS/route did to the logic.
    check: |
      python3 - <<'EOF'
      import re, sys
      L = "ASIC/eth-chiplet/build/fp1505/logs/lec_pnr.log"
      try:
          t = open(L, errors="replace").read()
      except OSError:
          print(f"lec-pnr: FAIL — no post-P&R LEC log at {L}; the stage did not run")
          sys.exit(1)
      if not t.strip():
          print(f"lec-pnr: FAIL — {L} is empty; Conformal produced no transcript")
          sys.exit(1)
      bad = []
      m = re.search(r"^\s*\d*\.?\s*Compare Results:\s+(\S+)", t, re.M)
      if not m:
          bad.append("no 'Compare Results:' verdict line — the six-hour run did not "
                     "reach a conclusion, which is not the same as equivalent")
      elif m.group(1).upper() != "PASS":
          bad.append(f"Conformal's verdict is {m.group(1)!r}, not PASS — place/CTS/"
                     f"route changed the logic")
      for label, what in (("Non-equivalent", "post-P&R points are NOT equivalent"),
                          ("Abort", "points ABORTED — not compared, so unknown"),
                          ("Not-compared", "points were NOT COMPARED")):
          c = re.search(rf"^(\d+) {label} point\(s\) reported", t, re.M)
          if c is None:
              bad.append(f"no '{label} point(s) reported' census line")
          elif int(c.group(1)) != 0:
              bad.append(f"{c.group(1)} {what}")
      for b in bad:
          print("lec-pnr: FAIL —", b)
      sys.exit(1 if bad else 0)
      EOF
    #
    # FIXTURES MOVED 2026-08-18 — check_proof DISCRIMINATES AGAIN. The note below
    # is kept because it is the only record of how a green proof went hollow, and
    # of what must never be done to restore one.
    # Same cause as the drc stage below; read the long note there for the
    # mechanism. Symptom here is the mirror image: the real build/fp1505 has no
    # logs/lec_pnr.log yet, so all three cases now report "no post-P&R LEC log
    # at ASIC/eth-chiplet/build/fp1505/logs/lec_pnr.log". must_pass is BROKEN,
    # and fail-nonequivalent — the case that is supposed to prove this gate
    # notices Conformal saying NON-EQUIVALENT — now fails because a file is
    # missing. It has stopped testing what it names.
    #
    # THE FIX WAS FIXTURE-SIDE, AND IS DONE (2026-08-18):
    #   git mv ci/fixtures/lec-pnr/<case>/ASIC/eth-chiplet/build/full-20260814 \
    #          ci/fixtures/lec-pnr/<case>/ASIC/eth-chiplet/build/fp1505
    # applied to pass, fail-nonequivalent and fail-no-log, keeping each
    # .__exclusive__ marker in place. And as with drc: do NOT restore a green by
    # pointing check: back at full-20260814, which would leave this stage
    # running fp1505 and grading a log full-20260814 wrote.
    check_proof:
      must_pass: ci/fixtures/lec-pnr/pass
      must_fail:
        - ci/fixtures/lec-pnr/fail-nonequivalent
        - ci/fixtures/lec-pnr/fail-no-log
    # fp1505, matching check: and the REVISED half of needs_implementation --
    # LOG_DIR and REPORT_DIR follow RUN_TAG, not SYN_RUN_TAG, so this run's
    # transcript and verdict land under build/fp1505/ even though its golden
    # came from full-20260814. Nothing under full-20260814/reports/lec/pnr/
    # describes this comparison; that directory holds the older
    # full-20260814-vs-full-20260814 run and would misattribute if collected.
    artifacts:
      - ASIC/eth-chiplet/build/fp1505/logs/lec_pnr*.log
      - ASIC/eth-chiplet/build/fp1505/reports/lec/pnr/**

  - id: lvs-preflight
    phase: physical
    gate: report
    label: soclabs-pdk
    description: "Can LVS run on the build under test? Names any missing input"
    # REPOINTED TO THE TOOLKIT 2026-08-18, and READ THE SCOPE CHANGE BELOW
    # BEFORE QUOTING A PASS FROM THIS STAGE. It goes from red to green in the
    # same commit, and that is a change of question, not an improvement.
    #
    # WHY IT MOVED. Measured before the change:
    #   make asic-lvs-pre  ->  rc=0, "OK — both layers clean"
    #     grading ASIC/genus-innovus/runs/20260810T065131Z_honest-full-pnr2/
    #     outputs/nanosoc_eth_chiplet_pads_lvs.gds — 2026-08-10, 312,031,404 B
    # So this stage was already passing GREEN, on an eight-day-old artefact of
    # the flow the root Makefile calls no-longer-shipping, while its description
    # still promised "LVS BLOCKED - standard cells, IO drivers, bond pads". The
    # description was as stale as the stream. It was not reporting a blocker.
    #
    # The old note here said the toolkit side "grades nothing" because
    # design.mk declared none of LVS_DECK / STDCELL_VLOG / IO_VLOG /
    # MACRO_CDLS. True when written; 18bf68e ported all four, so it is not now.
    #
    # THE SCOPE CHANGE, stated plainly because a reader will otherwise conclude
    # the TSMC _BE procurement blocker was resolved. It was not.
    #   legacy  = transistor-level LVS. Needs the _BE packages (CDL + cell GDS)
    #             for standard cells, IO and pads. Still unlicensed. Still a
    #             procurement blocker: docs/TSMC_BACKEND_PACKAGE_REQUEST.md.
    #   toolkit = Front-End methodology. run_lvs.sh states it in its own output:
    #             this flow does NOT require the _BE packages; FE simulation
    #             Verilog is sufficient, because leaf cells are BLACK-BOXED.
    # A pass here therefore means "clean modulo black boxes and modulo the pad
    # ring" — the runner's own words. It does NOT mean signoff clean, it does
    # NOT prove cell interiors or pin-level wiring on boxed leaves, and it says
    # nothing about the pad ring, whose obstruction geometry is deliberately
    # stripped from the LVS stream. The eight hard macros ARE compared down to
    # transistors; that is the part of the run that is real verification.
    #
    # gate: report is UNCHANGED and deliberately so. The full `lvs` run has
    # never been executed on the toolkit path — preflight-clean is not
    # run-clean — so this is a configuration check, not a verification result,
    # and it must not be able to turn a report green on its own authority.
    #
    # KNOWN WARNING, not a failure and not to be silenced: preflight reports 2
    # .GLOBAL/macro-internal collisions. Both boot ROMs use an internal net
    # named VSS 514 times where their actual supply ports are VDDE/VSSE, so
    # `.GLOBAL VSS` merges ROM interior with chip ground. Any macro-interior
    # discrepancy that follows is an artifact of the source. Open decision.
    #
    # RUN_TAG is spelled here rather than inherited, same doctrine as lec-syn
    # and rom-gds: the root forwarder carries no tag and resolves to
    # build/default, which has no GDS, no netlist and no romlibs and exits 2
    # naming each — right for a human, wrong for a gate that must name its
    # build.
    run: make -C ASIC/eth-chiplet lvs-preflight RUN_TAG=full-20260814
    # The preflight launches no tool and writes no log of its own, so there is
    # nothing here that it produces. LVS_RUNDIR is where the FULL run would
    # write; globbed rather than named so an empty directory collects nothing
    # instead of failing the stage.
    artifacts:
      - ASIC/eth-chiplet/build/full-20260814/work/lvs_run/**

  - id: drc
    phase: physical
    gate: block
    label: soclabs-pdk
    # REPOINTED 2026-08-18, run:, check:, needs_implementation: and artifacts:
    # TOGETHER, because that is the only way this stage can be moved without
    # making it worse. It used to declare ASIC/genus-innovus/outputs/…gds, run
    # `make asic-drc` (which reached the legacy flow) and grade
    # ASIC/genus-innovus/work/drc_run. The legacy outputs/ holds no GDS — it has
    # two subdirectories, eval/ and romlibs/, and nothing else — and
    # ASIC/genus-innovus/work has no drc_run at all, so the stage went
    # UNVERIFIED on the missing stream and its check: was never reached to
    # notice that it was also grading a directory that does not exist. Moving
    # the entry point alone would have left it running one tree and grading
    # another, which is worse than not running.
    #
    # MOVED full-20260814 -> fp1505, 2026-08-18, all four keys together again
    # and for the reason stated directly above. fp1505 is the promoted
    # place-and-route build -- Innovus check_drc reports 0 SHORT on it against
    # full-20260814's 4 rail-to-rail VDD/VSS shorts (docs/tapeout/43-drc-fp1505.md
    # §3) -- so fp1505's stream is the one that would be submitted, and grading
    # the superseded one is grading a stream nobody intends to ship.
    #
    # $(GDS) as the toolkit resolves it — measured, not assumed:
    #   make -C ASIC/eth-chiplet RUN_TAG=fp1505 … GDS
    #     -> build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds  (312 MB, present)
    #   … DRC_RUNDIR -> build/fp1505/work/drc_run  (flow.mk:671, $(WORK_DIR)/drc_run)
    #   … DRC_SCRIPT -> ASIC/genus-innovus/scripts/calibre/run_drc.sh
    # THAT RUNDIR IS POPULATED — 177 files, landed 2026-08-18 11:32 — and the
    # census over it reproduces docs/tapeout/43-drc-fp1505.md exactly (837 raw,
    # 691 waived, 146 reported, 140 design-owned, 6159 density windows), which
    # is an independent confirmation that it is the same measurement and not a
    # partial write. Cap 1000 against 837 results: NOT saturated, so the total
    # is a real number rather than a truncation.
    #
    # It matters that this evidence is in the BUILD TREE. The uncapped run
    # behind doc 43 was written to ASIC/genus-innovus/calibre_runs/
    # drc_fp1505_20260818, which is GITIGNORED (.gitignore:23,
    # `ASIC/*/calibre_runs`) and therefore could never be this stage's evidence:
    # CI clones the repo and finds nothing there. Grade the build tree.
    # THE DECK IS UNCHANGED BY THIS MOVE. The toolkit dispatches `drc` to
    # drc-project, whose runner is that same legacy run_drc.sh (design.mk:434),
    # with DRC_DECK deliberately empty so it takes its assembling branch exactly
    # as `make -C ASIC/genus-innovus drc` did. This changes WHICH GDS IS READ,
    # not which rules are applied.
    #
    # THIS STAGE STAYS RED, and that is the point. On fp1505 the census reports
    # 837 raw / 146 post-waiver / 140 design-owned results and 6159 CORE-ONLY
    # failing density windows against budgets of 0 — a MEASURED failure where
    # there was previously an unmeasured one. No green is manufactured here, and
    # the move does not manufacture one either: fp1505 does NOT improve any
    # Calibre total (raw 837, post-waiver 146 and design-owned 140 are IDENTICAL
    # on fp1505, full-20260814 and m5off5, and the core density windows are
    # marginally WORSE at 6159 vs 6149). fp1505 is promoted for its zero
    # rail-to-rail shorts, which Calibre does not see at all — that is an
    # Innovus check_drc result. Anyone reading a still-red drc row after this
    # move is reading it correctly.
    needs_implementation:
      - ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds
    description: "Calibre DRC on the routed GDS (signoff-grade ruledeck)"
    # NOT `make asic-drc`, for the reason spelled out in rom-gds and lec-pnr: that
    # root forwarder now reaches the toolkit, but it carries no run tag, so it
    # resolves to RUN_TAG=default — a different build directory from the one
    # needs_implementation declares and check: reads. A stage must not declare
    # one run and measure another.
    run: make -C ASIC/eth-chiplet drc RUN_TAG=fp1505
    # Calibre exits 0 whether or not it found violations, and the Makefile does
    # not parse the result. Count them here or this stage means nothing.
    #
    # Delegated to scripts/ci/drc_census.py — see its docstring for the three
    # faults this replaces (wrong summary filename, so the gate could only ever
    # take its exit-1 arm while its success branch printed the literal string
    # "DRC clean"; a regex that double-counted the BY CELL section; and total
    # blindness to density, where Calibre reports one merged result per check and
    # writes the real per-window detail to <check>.density).
    #
    # It gates on three things and reports the rest:
    #   * design-owned results       (DRC_DESIGN_BUDGET, default 0)
    #   * CORE-ONLY failing density windows (DRC_DENSITY_BUDGET, default 0)
    #   * any saturated check — a capped check has an unknown true count, so the
    #     run is not a measurement and cannot be signed off either way
    # io-pad-abstract and vendor-memory results are reported, not gated: no
    # std-cell/IO/pad layout exists on this site (every TSMC delivery is a
    # front-end kit), so they are not fixable here and clear at eptsmc's IO
    # import. That exemption is stated in the script and printed on every run.
    #
    # It also applies CELL-SCOPED waivers from
    # ASIC/genus-innovus/scripts/calibre/drc_waivers.yaml — today the 691 PO.R.8
    # inside 22 Artisan memory leaf cells, established 2026-08-18 as a
    # black-boxing artefact and not vendor defects (docs/tapeout/39-po-r8-
    # resolved.md). The DECK is untouched: Calibre still reports all 837, and
    # the census prints raw and waived side by side. The waiver cannot hide our
    # own geometry — results attributed to the layout primary cell are refused
    # in code — and it FAILS the gate if it goes stale or if any waived count
    # moves. See the fail-waiver-stale fixture below.
    check: |
      python3 scripts/ci/drc_census.py ASIC/eth-chiplet/build/fp1505/work/drc_run
    # NOTE these fixtures are also a live test of DRC_DESIGN_BUDGET /
    # DRC_DENSITY_BUDGET: fail-design-results carries 7 design-owned results, so
    # if the environment has raised the budget past 7 the must-fail case PASSES
    # and `prove` goes red. That is the intended behaviour — a budget set high
    # enough to swallow real violations has made the gate blind.
    #
    # FIXTURES MOVED 2026-08-18 — check_proof DISCRIMINATES AGAIN. The note below
    # is kept because it is the only record of how a green proof went hollow, and
    # of what must never be done to restore one.
    # Measured, not predicted: `signoff.py prove drc` reports must_pass BROKEN
    # and all four must_fail cases "ok", and EVERY ONE of the five printed the
    # same 837 results / 6159 density windows — the REAL fp1505 numbers.
    # fail-no-summary included, which is the case that is supposed to have no
    # summary at all. None of them read its own fixture.
    #
    # MECHANISM. These fixtures encode the build tag in their PATH:
    # ci/fixtures/drc/*/ASIC/eth-chiplet/build/full-20260814/work/drc_run, with
    # the .__exclusive__ marker inside that drc_run so the repo's real one
    # cannot leak in. The marker defends the OLD path only. prove's sandbox
    # symlinks every other build directory straight to the real tree — fp1505
    # among them — so the moment check: names fp1505, the real (failing) rundir
    # is what all five cases grade, and the proof stops discriminating.
    # signoff.py:80-89 anticipates exactly this leak, for exactly this stage.
    #
    # THE FIX WAS FIXTURE-SIDE, a rename not a rewrite, AND IS DONE (2026-08-18):
    #   git mv ci/fixtures/drc/<case>/ASIC/eth-chiplet/build/full-20260814 \
    #          ci/fixtures/drc/<case>/ASIC/eth-chiplet/build/fp1505
    # applied to all five cases, each .__exclusive__ marker left where it was.
    #
    # DO NOT "FIX" THIS BY POINTING check: BACK AT full-20260814. That would
    # restore a green proof over a stage that runs fp1505 and grades
    # full-20260814 — one tree implemented, another graded, which is the defect
    # this stage's own comment block above exists to forbid. A red proof that
    # names its cause is worth more than a green one that measures nothing.
    check_proof:
      must_pass: ci/fixtures/drc/pass
      must_fail:
        - ci/fixtures/drc/fail-design-results
        - ci/fixtures/drc/fail-saturated-cap
        - ci/fixtures/drc/fail-no-summary
        # A LIVE TEST OF THE WAIVER FILE, not just of the code. Its summary
        # reports PO.R.8 in `rf_08kCNTRL_RECOMPILED` — the plausible accident of a
        # memory-compiler re-run renaming the leaf cells. Every cell named in
        # ASIC/genus-innovus/scripts/calibre/drc_waivers.yaml then matches
        # nothing while the check still fires, and a waiver that matches nothing
        # reads as coverage it does not have. If someone widens that file to a
        # rule-scoped suppression, this case stops failing and `prove` goes red.
        - ci/fixtures/drc/fail-waiver-stale
    # 6.6 MB, 177 files: the summary, the results database, the assembled
    # deck.svrf, calibre_drc.log and every per-check .density file the census
    # counts windows out of.
    #
    # ASIC/genus-innovus/work/calibre_drc.runset IS GONE FROM THIS LIST rather
    # than repointed. Nothing in either flow has ever written a runset — a
    # runset is a Calibre GUI artefact and run_drc.sh is headless by design
    # (scripts/calibre/README.md:25, "No $DISPLAY, no GUI packages, no runset").
    # A declared artefact that no run can produce is a permanent entry in the
    # report's `artifacts_missing` list, which trains a reader to skim that list
    # instead of reading it.
    artifacts:
      - ASIC/eth-chiplet/build/fp1505/work/drc_run/**

  - id: erc
    phase: physical
    gate: report
    label: soclabs-pdk
    needs_implementation:
      - ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds
    description: "Calibre ERC — does the routed GDS carry power/ground TEXT LABELS?"
    # ADDED 2026-08-18, IN RESPONSE TO A REAL FOUNDRY SIGNOFF ERROR. IMEC's own
    # ERC run against a GDS we sent them (2026-08-17/18) returned one hard
    # [Error]: "No labels found in topcell. At least power/ground labels are
    # required." We had NOTHING local that checked for this — no `erc` stage
    # existed here at all (`grep -c "id: erc" ci/signoff.yaml` was 0 before this
    # commit) — so a defect a real foundry signoff flow catches immediately was
    # invisible to us until they told us. docs/tapeout/51-erc-pg-labels.md is
    # the full write-up; this stage is its CI half.
    #
    # PROMOTION-ORDER ROW #3, docs/tapeout/53-gate-promotion-plan.md §1: this
    # is that row, implemented 2026-08-18. `check:` now parses the OVERALL line
    # itself rather than trusting run_erc.sh's exit code (which treats OK and
    # PARTIAL identically — both 0). scripts/ci/erc_census.py is the
    # `drc_census`-equivalent script the plan calls for, with its own
    # check_proof fixtures below.
    #
    # STILL gate: report, and here is exactly what is still missing to promote
    # to block, so the next reader does not have to re-derive it:
    #   * the CHECK can now fail (see check_proof below) — that part is done.
    #   * the FIX for the one thing it was failing on (VDDIO/VSSIO carrying no
    #     text anywhere in the GDS) is written — ASIC/genus-innovus/scripts/
    #     power_plan.tcl now routes VDDIO/VSSIO via route_special, not just
    #     connect_global_net — and VALIDATED, but only by replaying it against
    #     fp1505's own routed database read-only (no P&R re-run); see
    #     docs/tapeout/51-erc-pg-labels.md §5.5 for the full before/after.
    #     `make erc` against fp1505's ACTUAL shipped GDS (below) still reads
    #     PARTIAL today, because fp1505 itself has not been rebuilt with the
    #     fix — the validation ran against a side artefact, not this stage's
    #     graded one.
    #   * the stage's own original bar (still correct): "run clean ... across
    #     several builds in a row." One validated fix on one replayed database
    #     is not that. Promote once fp1505 (or its successor) is rebuilt from
    #     `place` onward with this power_plan.tcl and a fresh `make erc` on
    #     THAT build reads OK.
    #
    # WHAT THIS STAGE MEASURES TODAY (full detail: docs/tapeout/
    # 51-erc-pg-labels.md §5):
    #   * calibrated against the EXACT GDS IMEC checked (md5
    #     7f6214965501c911bd65069378ae911d) — reproduces IMEC's finding exactly,
    #     both via Calibre's own ERC and an independent klayout structural scan.
    #   * fp1505 (this stage's target, same build `drc` above grades): the
    #     SPNET stream-map fix (ASIC/asic-toolkit/tech/tsmc65/derive.tcl,
    #     gdsmap_derive) DOES label VDD/VSS — Calibre resolves both and the
    #     klayout scan finds real text on the M9 text/SPNET layer. It does NOT label
    #     VDDIO/VSSIO on the GDS actually shipped — verdict: PARTIAL, not OK.
    #
    # ERC_RUNDIR is pinned into the BUILD TREE, same reasoning as the drc stage
    # comment above (CI clones the repo and only ever sees the build tree, not
    # ASIC/genus-innovus/work/ which ASIC/*/work in .gitignore excludes).
    #
    # `mkdir -p` before the make: tee needs the directory to exist before the
    # pipeline's first byte, and run_erc.sh's own mkdir happens partway through
    # its execution — after preflight, before the Calibre invocation — which is
    # too late for a `| tee` sitting outside the script.
    run: |
      mkdir -p ASIC/eth-chiplet/build/fp1505/work/erc_run
      make -C ASIC/genus-innovus erc \
        ERC_GDS=$PWD/ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds \
        ERC_RUNDIR=$PWD/ASIC/eth-chiplet/build/fp1505/work/erc_run \
        BLOCK=nanosoc_eth_chiplet_pads \
        2>&1 | tee ASIC/eth-chiplet/build/fp1505/work/erc_run/run_erc.log
    # run_erc.sh prints its OVERALL verdict to ITS OWN stdout — it is not
    # written into calibre_erc.sum or any other Calibre artefact — so the tee
    # above is what gives erc_census.py something repo-relative to read. See
    # that script's own docstring for why OVERALL: PARTIAL must be a hard fail
    # here even though run_erc.sh itself exits 0 on it (RC_OK — PARTIAL is
    # deliberately not fatal to the STANDALONE tool, see its own header) and
    # only NOT SIGNED OFF is RC_NOPG.
    check: |
      python3 scripts/ci/erc_census.py ASIC/eth-chiplet/build/fp1505/work/erc_run
    check_proof:
      must_pass: ci/fixtures/erc/pass
      must_fail:
        - ci/fixtures/erc/fail-partial
        - ci/fixtures/erc/fail-not-signed-off
        - ci/fixtures/erc/fail-no-output
    artifacts:
      - ASIC/eth-chiplet/build/fp1505/work/erc_run/**

  - id: bnd
    phase: physical
