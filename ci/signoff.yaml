  # a genuinely different, weaker claim than bnd's. docs/tapeout/
  # 50-bnd-and-logo-checks.md Part B, docs/tapeout/53-gate-promotion-plan.md
  # §1 row 4 ("LOGO AP-only fix wired into the real submission stream and
  # re-verified post full-merge").
  #
  # gate: report, DELIBERATELY, and NOT promotable by this pass, said plainly
  # per the task brief that added this stage: LOGO_AP_ONLY's real-zero
  # (LOGO.S.1/R.4/O.1 = 0/0/0) has been reproduced THREE times now — doc 50's
  # original measurement, an independent re-run via `run_drc.sh` directly,
  # and this pass's re-run against fp1505 (a denser, more-realistic LOCAL
  # stream than either of doc 50's) — but NEITHER real IMEC archive ever
  # checked the AP-only artefact. Both archives (17Aug pad-ring-only merge,
  # 18Aug full std-cell + seal-ring merge) tested the ORIGINAL, 158-marked,
  # full-pictorial logo, which stays saturated in both
  # (scripts/ci/imec_rule_diff.py: LOGO.S.1 1000/1000 both archives, LOGO.R.4
  # true count 1000 -> 1199, +19.9%, under full merge — real, measurable
  # growth for the MARKED logo). The mechanism argument for why AP-only
  # should be immune (LOGO.S.1/R.4 are defined purely against the 158/LOGO
  # marker's bounding box, and AP-only drops that marker entirely — nothing
  # for the rule to measure from, regardless of surrounding geometry) is
  # sound and stated in scripts/ci/logo_census.py's docstring, but it is a
  # mechanism argument, not a direct archive measurement, and doc 53's bar is
  # measurement. THIS IS THE GENUINE OPEN QUESTION THE TASK ASKED FOR AN
  # HONEST ANSWER TO — see docs/tapeout/50-bnd-and-logo-checks.md Part B.4.
  - id: logo
    phase: physical
    gate: report
    label: soclabs-pdk
    description: "LOGO keep-out (LOGO.S.1/R.4/O.1) on the AP-only-marked submission artefact"
    # DRC_LOGO_RUNDIR pinned into the BUILD TREE, same reasoning as `drc`/
    # `erc`/`bnd` above — see that fix, landed alongside this stage, in
    # ASIC/genus-innovus/Makefile (`drc-logo` target).
    run: |
      make -C ASIC/genus-innovus drc-logo-check \
        GDS=$PWD/ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds \
        DRC_LOGO_RUNDIR=$PWD/ASIC/eth-chiplet/build/fp1505/work/drc_logo_run
    check: |
      python3 scripts/ci/logo_census.py ASIC/eth-chiplet/build/fp1505/work/drc_logo_run
    check_proof:
      must_pass: ci/fixtures/logo/pass
      must_fail:
        - ci/fixtures/logo/fail-nonzero-true
        - ci/fixtures/logo/fail-no-summary
    needs_implementation:
      - ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds
    artifacts:
      - ASIC/eth-chiplet/build/fp1505/work/drc_logo_run/**

  - id: padring-power-domain
    phase: physical
    gate: report
    label: soclabs-sim
    description: "PVDD2POC_G instance-count visibility check -- tracks IMEC's 'multiple PVDD2POC cells in digital domain' padring error"
    # report, not block, AND NOT A FIX -- doc 53 §2 is explicit that this is a
    # TRACKING mechanism, not a resolution. IMEC's archive-2 Padringcheck
    # (ASIC/imec_results/Archive_..._dummy_merged_dummyWithSealRing_18Aug26_19u28/
    # padring/Padring_check.rpt) reports "Error-padringcheck, multiple PVDD2POC
    # cells in digital domain" against a design its own SUMMARY confirms has
    # exactly 1 power domain ("Number of power domains: 1, Domain 0 is
    # DIGITAL"). This design instantiates PVDD2POC_G four times -- once per
    # pad-ring side (ASIC/tech_wrappers/tsmc65/nanosoc_eth_chiplet_pads.v:
    # 215,228,241,249) -- all wired to VDDIO.
    #
    # Best-evidenced (UNCONFIRMED) read: Calibre likely wants this domain-
    # boundary/anchor cell once PER RING, not once per side. No TSMC POC-cell
    # datasheet is on this site to confirm or refute that reading. See
    # docs/tapeout/53-gate-promotion-plan.md §2 and
    # CONVERGENCE_PLAN_2026-08-18.md §8 "New: PVDD2POC".
    #
    # THIS STAGE DOES NOT DECIDE 1 VS 4 AND DOES NOT CONVERT ANY INSTANCE --
    # see scripts/check_pvdd2poc_cardinality.py's docstring. Its job is DRIFT
    # DETECTION: it fails (report, not block) if the instance count, its
    # wiring, or the cross-referenced instance names in the .io/
    # place_bondpads.tcl sources move from today's recorded baseline (4), so
    # an unreviewed change -- adding a fifth, or someone silently converting
    # instances to PVDD2DGZ_G without a broker/vendor answer -- is visible
    # rather than silent.
    #
    # No PDK, no Calibre seat, no build needed -- just the tracked Verilog
    # source, so label: soclabs-sim (not soclabs-pdk) is the true
    # requirement, even though this sits in the physical/padring-signoff
    # phase alongside padring-gds directly above, matching its style
    # (needs_implementation-free, run: + artifacts:, no check: -- same shape
    # doc 53 §1 calls "report, not yet promotable without more runtime
    # history").
    run: |
      mkdir -p ASIC/genus-innovus/reports
      python3 scripts/check_pvdd2poc_cardinality.py \
        --json ASIC/genus-innovus/reports/pvdd2poc_cardinality_report.json
    artifacts:
      - ASIC/genus-innovus/reports/pvdd2poc_cardinality_report.json

  - id: csr-category-ratchet
    phase: physical
    gate: report
    label: soclabs-sim
    description: "CSR/seal-ring rule-category budget ratchet -- don't let a future IMEC re-check exceed today's known-bad CSR.R.2:B/D, CSR.EN.8 counts or grow past the 157 archive-2-only rule categories unnoticed"
    # report, not block, AND NOT A FIX -- see docs/tapeout/53-gate-promotion-
    # plan.md §2 "CSR / 157-category ratchet" and
    # CONVERGENCE_PLAN_2026-08-18.md §8. Archive 2 (the first full
    # std-cell+seal-ring library merge IMEC ran) showed CSR.R.2:B 104->644,
    # CSR.R.2:D 91(364)->804(816) and CSR.EN.8 28->96 against archive 1 --
    # none of this is root-caused or fixed. It also showed 157 rule
    # categories fire that never appeared in archive 1 at all (only
    # detectable once real library geometry is merged in, so this is
    # structurally invisible to any purely-local run -- see doc 53 §4's
    # "Structurally undetectable locally" classification and
    # CONVERGENCE_PLAN §9 item 9).
    #
    # THE BASELINE IS AGAINST THE STALE REFERENCE GDS (legacy engine, dated
    # 2026-08-10), NOT the current fp1505/full-20260814 toolkit build -- see
    # ASIC/genus-innovus/scripts/calibre/csr_ratchet_budget.yaml's own header.
    # So this stage's real job right now is "don't let a FUTURE re-check
    # against IMEC show these numbers growing past today's baseline", not
    # "gate the current build" -- the current lineage has never had a
    # full-library-merge DRC run at all. There is therefore no live IMEC
    # summary to check on every CI run today; this stage runs the ratchet's
    # OWN self-test suite instead, which both proves the mechanism
    # discriminates and re-validates the recorded baseline against the two
    # archive reports on disk whenever they are reachable (host-local,
    # gitignored -- ASIC/imec_results is not in this checkout by default, so
    # that half degrades to "skipped, not measured" rather than a false
    # pass; see the script's own docstring).
    #
    # Promote to block "once the count has a verified ceiling and no
    # unexplained residue" (doc 53 §1's own bar) -- today it has neither: the
    # ~800/644/96 hits are mostly unattributed by cell (CONVERGENCE_PLAN §8),
    # and the 157 categories are untriaged.
    run: |
      mkdir -p ASIC/genus-innovus/reports
      python3 scripts/ci/csr_ratchet.py --self-test \
        --json ASIC/genus-innovus/reports/csr_ratchet_selftest.json
    artifacts:
      - ASIC/genus-innovus/reports/csr_ratchet_selftest.json

  # --- Power delivery ---------------------------------------------------------
  # THE FIRST VOLTAGE THIS PIPELINE HAS EVER COMPUTED. Before this row the
  # nearest thing to a power-delivery check was `pg_capacity`, which rates the
  # grid's ELECTROMIGRATION CEILING in milliamps — a different quantity — and
  # 2b_pnr_place_eval.tcl §12, which halts the run on an RV-VIA COUNT with a
  # floor of 8. That floor came from one day's tool configuration, and net VDD
  # has no RV via at top level at all, so it was guarding a plane the core
  # supply does not cross. A count cannot answer whether a supply is adequate;
  # only a voltage can.
  #
  # gate: report, DELIBERATELY, and here is what has to be true to promote it to
  # block:
  #   * the PG opens must be zero. Instances with no path to a supply rail do
  #     not power up; that is a functional defect, not a margin, and it is the
  #     one criterion here with no defensible non-zero value.
  #   * EM current density must be ANALYSED. In static mode, with no -em_models
  #     and no -process_techgen_em_rules, the tool DISABLES current-density
  #     analysis and the run still succeeds with the EM report simply absent.
  #     At --tier signoff the gate treats that as a hard failure, which is why
  #     this row runs at --tier report until models are wired in.
  # Promoting is a one-word edit here plus RAIL_TIER=signoff. Do not promote by
  # relaxing a budget: every threshold in rail_budgets.txt carries a provenance
  # string and the gate refuses to load a file whose provenance is a measurement.
  - id: ir-drop
    phase: physical
    gate: report
    label: soclabs-pdk
    description: "Static rail analysis (Voltus rail commands under Innovus): measured IR drop on the routed database, gated on the completeness assertions that decide whether the millivolts mean anything"
    # RAIL_RUN_TAG SPELLED OUT, 2026-08-18, though fp1505 is already
    # rail_project.mk:54's default. The tag is what binds this line to the census
    # path check: below pins; leaving it implicit means a one-word edit to the
    # default in another file silently makes run: analyse one build while check:
    # grades another, and both would still be green-looking.
    #
    # THIS TARGET DOES NOT EXIST AT HEAD — measured 2026-08-18, and NOT caused by
    # the pin above. `rail` is defined in ASIC/genus-innovus/rail_project.mk:97,
    # which IS committed, but the line that wires it in —
    # `include $(DESIGN_DIR)/rail_project.mk`, worktree Makefile:888 — is in the
    # WORKTREE ONLY. Measured at all three levels: worktree 1, index 0, HEAD 0.
    # So `make -C ASIC/genus-innovus rail` resolves on this disk and dies with
    # "No rule to make target 'rail'" in CI, which clones HEAD. Same defect the
    # rom-gds stage records above for `romlibs-gds-check`, and the reason
    # scripts/ci/audit_signoff_targets.py probes HEAD separately from the
    # worktree. ir-drop-selftest's `rail-selftest` is unreachable for the
    # identical reason. THE FIX IS TO COMMIT THAT INCLUDE, in
    # ASIC/genus-innovus/Makefile — not to change anything here.
    run: make -C ASIC/genus-innovus rail RAIL_RUN_TAG=fp1505
    # THE CHECK NEVER CONSULTS AN EXIT CODE — not the tool's and not the stage
    # script's. report_rail, report_resistance and set_power_pads have all been
    # observed printing `**ERROR` and returning SUCCESS on this design, so the
    # verdict is recomputed from the artefacts by rail_gate.py, which anyone can
    # re-run months later with no licence and no database.
    #
    # AND ABSENCE IS NOT A PASS. The failure mode this whole stage defends
    # against is a rail solve that attached no current, completed successfully
    # and reported a SMALL drop — the best possible result produced from no
    # data. A missing census is the same class of event and is a failure here.
    #
    # THIS STAGE HAD A SELECTOR DEFECT, NOT A POINTER DEFECT — 2026-08-18.
    # It is NOT part of the full-20260814 -> fp1505 re-point above and re-pointing
    # would not have touched it, because IT NEVER NAMED A BUILD AT ALL. It read
    #
    #     CEN=$(ls -1t ASIC/genus-innovus/rail/work/*/census.txt | head -1)
    #
    # — newest by mtime, latched to whatever was written last, forever. Measured:
    #
    #     fp1505-negctl/census.txt    00:12   1718 b   <- SELECTED
    #     full-20260814/census.txt    00:00   1907 b
    #     fp1505/census.txt           23:50   3323 b   <- the real run
    #
    # The winner is a DELIBERATELY FAULTED NEGATIVE CONTROL. Its first three
    # lines declare stage.script=rail_negative_control.tcl,
    # stage.negative_control=true and stage.fault=set_power_pads -format padcell
    # without -short_pin_nodes true, and the run left no verdict.json. So this
    # gate was judging the die's power delivery on an injected fault, and would
    # have gone on doing so after the re-point, because the newest file does not
    # change when other stages change build.
    #
    # THE FIX IS NOT A DIFFERENT WINNER. A stage that silently picks one is the
    # defect; picking a better one leaves the mechanism intact and re-breaks the
    # next time anyone runs a control. Three changes, and note that renaming or
    # deleting fp1505-negctl was DELIBERATELY NOT one of them — that works today
    # and fails again the next time a control is written:
    #
    #   1. NAMED, NEVER SELECTED. The census path is spelled out, matching the
    #      RAIL_RUN_TAG on run: above (rail_project.mk:54 defaults it to fp1505;
    #      :64 writes the census to $(RAIL_WORK)/$(RAIL_TAG)), so run: and check:
    #      name the same string on purpose — the discipline the drc stage states.
    #      RAIL_CENSUS still overrides, for re-judging an archived run by hand.
    #   2. FAIL ON AMBIGUITY. The one arm that still enumerates refuses outright
    #      when more than one candidate exists, instead of ranking them. It
    #      exists ONLY for the check_proof sandbox below, whose fixtures inject
    #      their census at rail/work/fixture/census.txt — a name this manifest
    #      cannot pin without editing files it does not own — and which is
    #      exclusive, so exactly one is ever present there. Nothing in it can
    #      order two candidates.
    #   3. COMPLETENESS, ASSERTED INDEPENDENTLY. The faulted census is 44 keys
    #      against the real run's 60 — it never wrote stage.started, db.mtime,
    #      core.bbox, pgv.path or the pad masters. That gap catches this class of
    #      substitution with no reference to mtime AND with no reference to the
    #      negative_control marker, which matters because two people found this
    #      by two different routes and neither was the obvious one. All six keys
    #      are present in both real censuses and in all six must_fail fixtures,
    #      so no fixture is diverted into failing for the wrong reason.
    #
    # The marker check below is the SELECTION side: this stage must not CHOOSE a
    # control. rail_gate.py carries its own hard refusal for being HANDED one.
    # Both are wanted; either alone leaves a route in.
    check: |
      set -u
      # -- 1 -- WHICH CENSUS. Named, never ranked. --------------------------
      RAIL_WORK=ASIC/genus-innovus/rail/work
      PINNED=$RAIL_WORK/fp1505/census.txt
      CEN="${RAIL_CENSUS:-}"
      case "$CEN" in
        *'*'*|*'?'*|*'['*)
          echo "ir-drop: FAIL — RAIL_CENSUS='$CEN' is a PATTERN, not a path."
          echo "  This stage is GIVEN a census; it does not choose one. Name one file."
          exit 1 ;;
      esac
      if [ -n "$CEN" ]; then
        [ -f "$CEN" ] || {
          echo "ir-drop: FAIL — RAIL_CENSUS names $CEN, which is not a file."
          echo "  An override that resolves to nothing must not fall back to a guess."
          exit 1; }
      elif [ -f "$PINNED" ]; then
        CEN=$PINNED
      else
        # Pinned run absent. DO NOT RANK. Sandbox-only arm; see note 2 above.
        n=0; only=
        for c in "$RAIL_WORK"/*/census.txt; do
          [ -f "$c" ] || continue
          n=$((n + 1)); only=$c
        done
        if [ "$n" -eq 0 ]; then
          echo "ir-drop: FAIL — no rail census at $PINNED, and none under $RAIL_WORK/*/."
          echo "  An absent IR-drop result is NOT a pass. A rail run that fails to attach"
          echo "  current reports SMALL drops, which is the failure mode that looks like"
          echo "  good news; having no result at all is not better than that."
          exit 1
        fi
        if [ "$n" -gt 1 ]; then
          echo "ir-drop: FAIL — $PINNED is absent and $n candidate censuses exist:"
          for c in "$RAIL_WORK"/*/census.txt; do [ -f "$c" ] && echo "      $c"; done
          echo "  REFUSING TO CHOOSE. Ranking them by date is the defect this stage was"
          echo "  rewritten to remove — it is how a faulted negative control came to be"
          echo "  graded as the die. Restore the pinned run, or set RAIL_CENSUS."
          exit 1
        fi
        CEN=$only
      fi
      echo "census: $CEN"
      # -- 2 -- IS IT A CONTROL? --------------------------------------------
      if cut -d= -f1 "$CEN" | grep -qxF stage.negative_control ||
         cut -d= -f1 "$CEN" | grep -qxF stage.fault; then
        echo "ir-drop: FAIL — $CEN is a DELIBERATELY FAULTED NEGATIVE CONTROL:"
        grep -E '^stage\.(script|negative_control|fault)=' "$CEN" | sed 's/^/      /'
        echo "  A control exists to prove this gate CAN fail. Grading the design on one"
        echo "  turns that proof into the verdict, and its millivolts describe an"
        echo "  injected fault, not the die."
        exit 1
      fi
      # -- 3 -- IS IT COMPLETE? ---------------------------------------------
      missing=
      for k in stage.started db.mtime core.bbox pgv.path pads.vdd_master pads.vss_master; do
        cut -d= -f1 "$CEN" | grep -qxF "$k" || missing="$missing $k"
      done
      if [ -n "$missing" ]; then
        echo "ir-drop: FAIL — $CEN is INCOMPLETE ($(wc -l < "$CEN") keys)."
        echo "  Absent:$missing"
        echo "  These name the database read, the grid view solved, the pad masters the"
        echo "  sources attached to and the area analysed. Without them rail_gate.py"
        echo "  judges a fragment of a run and reports on it as though it were the run."
        exit 1
      fi
      python3 ASIC/genus-innovus/rail/rail_gate.py \
          --census  "$CEN" \
          --budgets ASIC/genus-innovus/rail/rail_budgets.txt \
          --tier    "${RAIL_TIER:-report}"
    # Both directions, and each must-fail case is a way this project has ALREADY
    # been misled — not an invented mutation. The fixtures are cut down from the
    # real artefacts of the fp1505 run, so the shapes are the tool's own.
    check_proof:
      must_pass: ci/fixtures/ir-drop/pass
      must_fail:
        - ci/fixtures/ir-drop/fail-no-voltage-sources
        - ci/fixtures/ir-drop/fail-low-coverage
        - ci/fixtures/ir-drop/fail-era-method
        - ci/fixtures/ir-drop/fail-disconnected-instances
        - ci/fixtures/ir-drop/fail-over-budget
        - ci/fixtures/ir-drop/fail-no-census
    # PINNED TO MATCH run: AND check:, for the reason the drc stage states:
    # artifacts: must collect the evidence the stage actually graded. The `*`
    # these lines used to carry swept fp1505-negctl (the faulted negative
    # control), full-20260814-short and full-20260814 into the report alongside
    # a verdict computed from exactly one of them — which is how a reader ends up
    # attributing a millivolt number to the wrong build.
    artifacts:
      - ASIC/genus-innovus/rail/work/fp1505/census.txt
      - ASIC/genus-innovus/rail/work/fp1505/verdict.json
      - ASIC/genus-innovus/rail/work/fp1505/results/*/Reports/*/*.main.rpt
      - ASIC/genus-innovus/rail/work/fp1505/results/*/Reports/*/*.layerbased_ir.rpt
      - ASIC/genus-innovus/rail/work/fp1505/results/*/*/*_vsrcs.rpt

  # --- Can the IR-drop gate actually FAIL? ------------------------------------
  # Same doctrine as rom-selftest and lec-selftest, and runs before the row it
  # guards. Twenty mutations of a rail run, each broken in one specific way this
  # project has been misled by: zero voltage sources reported as "6/6 (100.00%)",
  # a source on every via of a layer, an ERA method that would bridge the PG
  # opens, a stream-derived grid, the 1.20-vs-1.08 divisor, a demand file that
  # loaded no current, a tool summary that disagrees with the per-instance
  # report, and a budget file whose provenance is the previous run's number.
  # No licence, no database, no PDK: ~1 s on any host.
  - id: ir-drop-selftest
    phase: rtl
    gate: block
    label: soclabs-sim
    description: "Mutation-test the IR-drop gate itself — 20 cases, both directions, plus two anti-ratchet refusals"
    run: make -C ASIC/genus-innovus rail-selftest
    # The COUNT is asserted, not just the exit status: a selftest that quietly
    # stops running cases still exits 0. This is the same hole rom-selftest's
    # row already guards against.
    check: |
      OUT=$(python3 ASIC/genus-innovus/rail/rail_gate.py --selftest 2>&1) || {
        echo "$OUT"; echo "the rail gate's own mutation battery FAILED"; exit 1; }
      echo "$OUT" | tail -3
      N=$(echo "$OUT" | sed -n 's/^ *\([0-9]\+\) passed, \([0-9]\+\) failed.*/\1/p')
      F=$(echo "$OUT" | sed -n 's/^ *\([0-9]\+\) passed, \([0-9]\+\) failed.*/\2/p')
      test -n "$N" || { echo "the battery printed no tally — it did not run"; exit 1; }
      test "${F:-1}" = 0 || { echo "$F mutation(s) were not caught"; exit 1; }
      test "$N" -ge 20 || { echo "only $N cases ran; the battery has been cut down"; exit 1; }
      # A battery that contains no must-PASS case proves only that the gate says
      # no to everything, which is not a gate either.
      echo "$OUT" | grep -q 'baseline_healthy .*got PASS' || {
        echo "the positive control did not pass — this gate rejects good evidence"; exit 1; }
    # Each must_fail shadows rail_gate.py with a stub printing a DIFFERENT tally,
    # so the three clauses above are proved separately rather than all at once by
    # one mutation. The must_pass fixture supplies no file at all: the positive
    # control has to be the real battery, or it proves only that a stub can be read.
    check_proof:
      must_pass: ci/fixtures/ir-drop-selftest/pass
      must_fail:
        - ci/fixtures/ir-drop-selftest/fail-mutation-escaped
        - ci/fixtures/ir-drop-selftest/fail-battery-cut-down
        - ci/fixtures/ir-drop-selftest/fail-positive-control-missing

  - id: gls-netlist
    phase: physical
    gate: block
    label: soclabs-sim
    description: "Gate-level simulation of the routed netlist: does CPU1 bring up XiP from a real flash device, copy and verify its own image, execute it, and release CPU0 -- and does CPU0 then fetch its reset vector out of its own mask ROM and branch -- all out of these gates, with nothing held by the bench?"
    # WHY THIS IS block, PROMOTED 2026-08-19.
    # This stage shipped as `report` for one stated reason: CPU0's own image copy
    # never happened, so five rungs sat on a KNOWN_OPEN register and the header
    # said "promote when KNOWN_OPEN is empty". It is empty. On 2026-08-19 the
    # bench's default CPU1 application was changed to a mailbox-clean one
    # (ASIC/gls-netlist/flash/mkflash.sh) and run_cycles raised 250,000 -> 320,000;
    # CPU0 then copies its image, executes 8,576 fetches out of its own IMEM and
    # stores REMAP at 5,731,830,000 ps. All five moved into TIER_C below.
    #
    # WHAT IT BLOCKS ON, precisely: a published verdict that does not read
    # `RESULT PASS ... fail=0`, any graded rung red, any red rung this stage does
    # not grade, any bench force, or a window too short to have settled the
    # question. The stage it replaces graded four CPU1 rungs and never read the
    # RESULT line at all: applied to the blank-flash negative control's published
    # `RESULT FAIL pass=18 fail=9` it exited 0, because CPU1 boots from its mask
    # ROM whatever is in flash. That is the false-green this promotion closes.
    #
    # WHAT A PASS HERE DOES NOT MEAN, and it must travel with any quote of it:
    #   * CPU0 DID NOT BOOT ITS APPLICATION. A pass means both mask ROMs hold
    #     their firmware; CPU1 booted a flash image end to end and is executing
    #     it; CPU0 was released BY CPU1 and reached its own ROM and branched.
    #     Nothing here says CPU0 copied or verified an image.
    #   * the file simulated is NOT the tapeout netlist. fp1505's _pnr.v leaves
    #     17,231 instances across 63 cell types with no .VDD()/.VSS(), so
    #     neither vendor library can simulate it as written; the gate completes
    #     the supplies into a COPY and records what it changed in pg_complete.txt.
    #   * it is not a timing check. Zero-delay, no SDF, and the simulation
    #     Verilog is an older cell revision than the Liberty the design was
    #     timed against. It says the logic works, not that it closes.
    #   * the CRC rungs prove faithful TRANSPORT, not a correct PAYLOAD. Each
    #     ROM checks its copy against a CRC field taken from the same flash
    #     blob, so a consistent-but-wrong image passes.
    #   * the flash device is BENCH-SUPPLIED. Everything the boot reads came
    #     from a model bound into the testbench, not from the design. Its image
    #     and sha256 are in inputs.txt under `staged bench inputs`, and sim.log
    #     carries the attachment's own GLSN-FLASH banner.
    run: make -C ASIC/gls-netlist gls
    # THE CHECK NEVER CONSULTS AN EXIT CODE. `make gls` exits non-zero on any
    # red item, so a status-based check cannot tell "CPU1 still boots" from "the
    # whole run collapsed" - and those need different responses. The verdict is
    # recomputed from the published per-item verdict.txt, which anyone can
    # re-read months later with no simulator and no licence -- and, now, from
    # the sim.log beside it, which is the only place the RUN LENGTH is written.
    check: |
      python3 - <<'PYEOF'
      import os, re, sys, xml.etree.ElementTree as ET

      # -- DECLARATION -----------------------------------------------------
      # These values are the stage's claim about what it is grading. The check
      # cross-examines every one of them against the evidence.
      MODE           = "full_handshake"   # full_handshake | unforced_fetch | fetch_path_only
      RUN_TAG        = "fp1505"
      ITEM           = "fp1505_cc"
      ALLOWED_FORCES = set()              # non-empty ONLY in fetch_path_only
      RTL_TEST       = "test_network_core_stage0_boot_from_flash"

      EVID    = "ASIC/eth-chiplet/build/%s/reports/gls/%s" % (RUN_TAG, ITEM)
      VERDICT = os.path.join(EVID, "verdict.txt")
      SIMLOG  = os.path.join(EVID, "sim.log")
      INPUTS  = os.path.join(EVID, "inputs.txt")
      RTL_XML = "nanosoc-multicore-system/cocotb/soc_boot_flash/results.xml"
      ETH_SV  = "nanosoc-multicore-system/src/rtl/bootrom/eth_ss_bootrom.sv"
      ETH_BIN = ("nanosoc-multicore-system/build/cmake/gcc-m0plus-le/firmware/"
                 "bootloader/stage0_bootrom/eth_ss_bootrom.bintxt")

      # THE BENCH'S OWN BUDGET, restated here so the check can say what the
      # window is rather than inferring it. bench/eth_chiplet_fp1505_cc.json:
      # clocks[0].period_ns = 20.0, run_cycles = 320000 (raised from 250,000 on
      # 2026-08-19: CPU0's REMAP store lands at 5,731,830,000 ps, past the old
      # 5,000,000,000 ps window, so at 250,000 cycles a red here meant nothing
      # more than 'the clock ran out'.)
      REF_PERIOD_PS       = 20000
      DECLARED_RUN_CYCLES = 320000
      DECLARED_RUN_PS     = REF_PERIOD_PS * DECLARED_RUN_CYCLES   # 6,400,000,000

      # -- WHAT MUST BE GREEN ----------------------------------------------
      # EVERY KEY BELOW WAS CHECKED AGAINST bench/eth_chiplet_fp1505_cc.json.
      # The bench emits 22 keys: cc_rom/eth_rom x {nonx,content}; cc_rom_port,
      # eth_rom_port, cpu1_dmem_write, cpu1_imem_write, cpu1_imem_fetch x
      # {accessed,data_nonx}; and 8 expects. All 22 are graded here.
      #
      # TIER A - the ROMs hold the firmware and CPU1 runs. Required always.
      TIER_A = ["cc_rom.nonx", "cc_rom.content",
                "eth_rom.nonx", "eth_rom.content",
                "cc_rom_port.accessed", "cc_rom_port.data_nonx",
                "cc_rom_msp_on_Q", "cc_rom_rstvec_on_Q",
                "cpu1_dmem_write.accessed", "cpu1_dmem_write.data_nonx",
                "cpu1_main_entered"]
      # TIER B - CPU0 reaches its own ROM, takes the reset vector, and branches.
      TIER_B = ["eth_rom_port.accessed", "eth_rom_port.data_nonx",
                "eth_rom_msp_on_Q", "eth_rom_rstvec_on_Q",
                "eth_rom_branch_word62"]
      # TIER C - the handshake: a real flash device was addressed, CPU0 stayed
      # idle until CPU1 let it go, and CPU1 copied AND THEN EXECUTED its own
      # image. Required when MODE=full_handshake; a Tier-C key that is PRESENT
      # AND RED is a failure in EVERY mode - the mode narrows what is REQUIRED,
      # never what is allowed to be broken.
      #
      # WHY cpu1_imem_fetch IS THE VERIFICATION RUNG. copy_image happens BEFORE
      # the CRC check, so cpu1_imem_write alone cannot separate "copied" from
      # "copied and accepted". main.c:388 flips CPU1's own REMAP and jumps only
      # after nanosoc_crc32 over the copied image matched the table's CRC, so
      # CPU1 executing out of its IMEM macro is the post-CRC evidence.
      #
      # WHY THE BOOTGATE IS NOT HERE. stage0_bootrom_chip_core/main.c writes
      # NETWORK_CORE_BOOTGATE (0x4) TWICE: on the success path (main.c:383) and
      # UNCONDITIONALLY after every candidate including the golden recovery
      # image has failed (main.c:403), deliberately, so a blank flash cannot
      # silently hold CPU0 in reset. A gate built on the bootgate WOULD PASS
      # WITH A BLANK FLASH. The shipped bench traces bit 2 as an observation and
      # asserts nothing on it, and neither does this check.
      TIER_C = ["qspi_flash_addressed",
                "cpu0_rom_idle_at_1ms",
                "cpu1_imem_write.accessed", "cpu1_imem_write.data_nonx",
                "cpu1_imem_fetch.accessed", "cpu1_imem_fetch.data_nonx",
                # CLOSED 2026-08-19, promoted off the KNOWN_OPEN register by its
                # own ratchet. These are the CPU0 half: the network core's IMEM is
                # written after CPU0's release, read back as instruction fetch, and
                # a REMAP store follows. THE PROBES SIT ON THE IMEM MACRO PORT and
                # cannot tell which master drove a beat, so these rungs say the
                # traffic happened, not who issued it. Measured on the published
                # run: 247 writes, 8,576 fetches, REMAP at 5,731,830,000 ps.
                "eth_imem_write_after_release.accessed",
                "eth_imem_write_after_release.data_nonx",
                "eth_imem_fetch.accessed", "eth_imem_fetch.data_nonx",
                "eth_sysctrl_remap_set"]

      GRADED = set(TIER_A) | set(TIER_B) | set(TIER_C)

      # -- THE KNOWN-OPEN REGISTER ------------------------------------------
      # NOT "dropped". These three probes were WRITTEN, RUN AND MEASURED, and
      # they are red for a reason that lives in the eth firmware, not in the
      # bench and not in the netlist. Recording that here, where it prints on
      # every run, is the difference between an open item and an omission.
      #
      # MEASURED 2026-08-19 12:46, 302,000 cycles = 6,039,990,000 ps, 1.75x past
      # CPU0's release at 3,457,830,000 ps, published verdict at
      # ASIC/eth-chiplet/build/fp1505/reports/gls/fp1505_cc/verdict.txt:
      #     eth_imem_write_after_release.accessed FAIL accesses=0
      #     eth_imem_fetch.accessed               FAIL accesses=0
      #     eth_sysctrl_remap_set                 FAIL never
      # CPU0 fetched 39,919 words out of eth_rom over that window - it is
      # RUNNING - while its IMEM macro's chip-enable never fell.
      #
      # A DIFFERENT, NO-LONGER-REBUILDABLE IMAGE DID SHOW THEM FIRE:
      # docs/tapeout/evidence/57-cpu0-boot-verdicts.md SS A - 220 IMEM writes,
      # 436,010 IMEM fetches, sysctrl REMAP at 5,484,510,000 ps. So the probes
      # are sound and the rungs are reachable; this image does not reach them.
      #
      # value = (first_observed_ps or None, why)
      # EMPTY, AND THAT IS THE POINT. This register carried the five CPU0 rungs
      # until 2026-08-19. Its ratchet below fails the stage the day a listed rung
      # goes green, so that an open item cannot quietly become a permanent excuse.
      # All five went green together when the bench stopped booting CPU1 from an
      # application that races CPU0 for the IPC mailbox word; they are in TIER_C
      # now and are required. Anything added here needs a reason and a measurement,
      # and it will be handed back the moment it starts passing.
      KNOWN_OPEN = {
      }
      OPEN_ITEM_REF = "docs/tapeout/evidence/57-cpu0-boot-verdicts.md"

      # -- PROBES THAT CANNOT SEE -------------------------------------------
      # chip_core_remap_ctrl_w is declared `wire [3:0]` in the routed netlist
      # and bits 0, 1 and 3 appear NOWHERE ELSE in the file - not as a driver,
      # not as a load. cpu1_bootgate is tied 1'b1 in nanosoc_multicore_soc.sv so
      # bit 1's control fan-out is dead, and P&R gave the other three flops'
      # outputs the readback net name (chip_core_remap_0_hrdata[n]) instead. The
      # bus traces as 0xZ even at the instant the bootgate rises, so any `===`
      # against a fully-defined 4-bit literal can NEVER match. The shipped bench
      # has already dropped both; this register stops them coming back.
      RETIRED = {
        "cpu0_bootgate_released_by_cpu1":
          "probes the 4-bit bus chip_core_remap_ctrl_w against 4'b0100. Three "
          "of those four bits have no driver in the routed netlist, so it can "
          "NEVER match and its FAIL says nothing about the design. Replace it "
          "with remap_ctrl_bit2_set (...chip_core_remap_ctrl_w[2] === 1'b1) AND "
          "remap_bit2_at_flop_q (...\\u_chip_core_remap_0_remap_q_reg[2] .Q === "
          "1'b1).",
        "cpu1_remap_after_verified_image":
          "probes the same 4-bit bus against 4'b0101, and bit 0's control net "
          "does not exist in the routed netlist at all. Replace it with "
          "cpu1_remap_bit0_set (...\\u_chip_core_remap_0_remap_q_reg[0] .Q === "
          "1'b1) AND cpu1_remap_bit0_and_bit2 ({that, ...ctrl_w[2]} === 2'b11).",
      }

      # -- PROBE-FORM PINNING ------------------------------------------------
      # A verdict file records a key name and a result; it cannot record what
      # EXPRESSION the probe used - which is exactly how the bus probes above
      # went unnoticed for a day. So each re-sourced signal is asserted TWICE
      # under two names whose at= must be IDENTICAL: they are two probes on the
      # same flop, so a difference means one of them is not on that flop.
      #
      # THE SHIPPED BENCH DECLARES NEITHER PAIR, so this clause is INERT today
      # and the report SAYS SO. A clause that measured nothing must not read as
      # a clause that passed. Present-and-matching passes; present-and-differing
      # fails; exactly one present is a pinning GAP and fails, because one name
      # alone cannot show which expression was used.
      SAME_INSTANT = [("remap_ctrl_bit2_set", "remap_bit2_at_flop_q"),
                      ("cpu1_remap_bit0_set", "cpu1_remap_bit0_and_bit2")]

      # -- ORDERING, from the at= fields the verdict already records ---------
      # Only over keys the SHIPPED bench emits, and only where both ends carry
      # an at=. Measured on the published run: 1.490 us, 1.510 us, 46.830 us,
      # 47.590 us, 1000.010 us, 3457.830 us, 3457.850 us, 3457.870 us.
      # NOTE what is NOT ordered: anything on two cores that run CONCURRENTLY
      # from the release onwards. Their order is not architecturally guaranteed
      # and asserting it would be a flake.
      ORDER = [("cc_rom_msp_on_Q",       "cc_rom_rstvec_on_Q"),
               ("cc_rom_rstvec_on_Q",    "cpu1_main_entered"),
               ("cpu1_main_entered",     "qspi_flash_addressed"),
               ("qspi_flash_addressed",  "cpu0_rom_idle_at_1ms"),
               ("cpu0_rom_idle_at_1ms",  "eth_rom_msp_on_Q"),
               ("eth_rom_msp_on_Q",      "eth_rom_rstvec_on_Q"),
               ("eth_rom_rstvec_on_Q",   "eth_rom_branch_word62"),
               # kept for the day the bench declares the handshake rungs; each
               # pair is skipped unless BOTH ends are present.
               ("qspi_flash_addressed",  "qspi_xip_active_latched"),
               ("qspi_xip_active_latched", "ipc_slot1_warm_word"),
               ("ipc_slot1_warm_word",   "remap_write_strobe"),
               ("remap_write_strobe",    "remap_ctrl_bit2_set"),
               ("remap_ctrl_bit2_set",   "cpu1_remap_bit0_and_bit2"),
               ("remap_ctrl_bit2_set",   "eth_rom_msp_on_Q"),
               ("eth_rom_branch_word62", "eth_sysctrl_remap_set")]

      # -- THE CYCLE BUDGET --------------------------------------------------
      # MEASURED firing times on the published run. Used for two things: to know
      # how far the simulation must get before a red can be read as a design
      # statement, and to say WHICH of "the clock ran out" and "the design
      # failed" a given red is.
      MEASURED_AT = {
        "cc_rom_msp_on_Q":       1490000,
        "cc_rom_rstvec_on_Q":    1510000,
        "cpu1_main_entered":    46830000,
        "qspi_flash_addressed": 47590000,
        "cpu0_rom_idle_at_1ms": 1000010000,
        "eth_rom_msp_on_Q":     3457830000,
        "eth_rom_rstvec_on_Q":  3457850000,
        "eth_rom_branch_word62":3457870000,
      }
      # A rung measured before this cannot plausibly be a budget artefact: no
      # run that produced a RESULT line at all stopped in the first microsecond.
      LATE_RUNG_PS = 1000000000
      LATE = dict((k, v) for k, v in MEASURED_AT.items()
                  if k in GRADED and v >= LATE_RUNG_PS)
      LATEST_GRADED_PS = max(LATE.values()) if LATE else 0

      # -- THE PROXIMITY CLAUSE (inert on the shipped bench) ------------------
      # The remap block's own registered write strobe must rise WITH the
      # bootgate bit, not merely somewhere in the run: a force raises the bit
      # with no strobe beside it, and an unrelated write to the remap block
      # raises the strobe far away from it. MEASURED 2026-08-19: strobe
      # at=3179210000, bit at=3179230000 - 20,000 ps, one 20 ns reference cycle.
      # The window is ten cycles.
      STROBE_WINDOW_PS = 200000

      # -- THE RELEASE-TIME FLOOR - a force discriminator needing no log -----
      # A forced run reaches eth_rom_msp_on_Q at 3,470,000 ps; the shipped one
      # at 3,457,830,000 ps, 996x later. The floor is 1,000,000,000 ps, which is
      # the SAME STATEMENT the bench's own cpu0_rom_idle_at_1ms rung makes from
      # inside the simulation - deliberately, so the two corroborate from
      # different evidence. Clears a force by 288x; clears the blank-flash
      # negative control (release measured at 1,021,650,000 ps) by 21 us, which
      # is why the blank-flash case is caught by the IMEM rungs and not here.
      EARLIEST_REAL_RELEASE_PS = 1000000000

      bad  = []
      warn = []
      info = []
      def fail(m): bad.append(m)
      def note(m): warn.append(m)
      def obs(m):  info.append(m)

      # -- 1. the graded verdict, by name, not by glob -----------------------
      if not os.path.exists(VERDICT):
          print("gls-netlist: FAIL - no verdict at %s. Either nothing ran, or "
                "GLSN_EVIDENCE_%s is unset so the evidence stayed in a build/ "
                "directory no packager collects. UNVERIFIED IS NOT A PASS."
                % (VERDICT, ITEM))
          sys.exit(1)

      # THE GRAMMAR. gen_netlist_tb.py's rule: an UPPER-CASE first token is a
      # RECORD ABOUT THE RUN (RESULT, FORCES, FORCE, DEVICE), a lower-case one
      # is a check. Keying on that rather than on a table of key names means a
      # new record type arriving does not read as a mysteriously failing check.
      res, result_line, forces_line, force_rows = {}, None, None, []
      for ln in open(VERDICT):
          ln = ln.rstrip("\n")
          if not ln.strip():
              continue
          tok = ln.split()[0]
          if tok.isupper():
              if tok == "RESULT":   result_line = ln
              elif tok == "FORCES": forces_line = ln
              elif tok == "FORCE":  force_rows.append(ln)
              continue
          m = re.match(r"^(\S+)\s+(PASS|FAIL)\s*(.*)$", ln)
          if m:
              res[m.group(1)] = (m.group(2), m.group(3))
      if result_line is None:
          fail("%s has no RESULT line. A verdict file without its own summary "
               "is a truncated run - the simulator died before $fclose - and "
               "the rows above it describe a run that never finished." % VERDICT)
      if not res:
          fail("%s records 0 verdict items. A loop over nothing reports no "
               "failures." % VERDICT)

      reds = sorted(k for k, v in res.items() if v[0] != "PASS")

      # THE RESULT LINE MUST ACCOUNT FOR ITS OWN BODY. A summary that does not
      # foot against the rows above it has been truncated or edited.
      if result_line is not None:
          m = re.match(r"^RESULT\s+(PASS|FAIL)\s+pass=(\d+)\s+fail=(\d+)\s*$",
                       result_line)
          if not m:
              if not re.match(r"^RESULT\s+FAIL\s+watchdog\s*$", result_line):
                  fail("%s has a RESULT line this check cannot parse: %r"
                       % (VERDICT, result_line[:120]))
              else:
                  fail("%s reports the generator's WATCHDOG: the simulation did "
                       "not reach its own end. Nothing above that line describes "
                       "a finished run." % VERDICT)
          else:
              np_, nf_ = int(m.group(2)), int(m.group(3))
              if np_ + nf_ != len(res):
                  fail("%s says pass=%d fail=%d (%d items) but carries %d "
                       "check rows. The summary does not foot against its own "
                       "body: the file is truncated or edited."
                       % (VERDICT, np_, nf_, np_ + nf_, len(res)))
              if nf_ != len(reds):
                  fail("%s says fail=%d but %d row(s) read FAIL."
                       % (VERDICT, nf_, len(reds)))

      def at(key):
          d = res.get(key, (None, ""))[1]
          m = re.search(r"at=(\d+)", d or "")
          return int(m.group(1)) if m else None

      def ok(k): return res.get(k, ("",))[0] == "PASS"

      def require(keys, why):
          for k in keys:
              st = res.get(k)
              if st is None:
                  fail("%s: NOT DECLARED in %s. %s - a check that was deleted "
                       "rather than fixed reads as a pass." % (k, VERDICT, why))
              elif st[0] != "PASS":
                  fail("%s: %s %s -- %s" % (k, st[0], st[1], why))

      # -- 2. probes that cannot see ----------------------------------------
      # BEFORE anything else, because their reds would otherwise be read as
      # handshake failures and would drive the outcome ladder to a wrong state.
      for k, how in RETIRED.items():
          if k in res:
              fail("RETIRED PROBE STILL DECLARED: %s. It %s Its result in this "
                   "verdict (%s) carries NO information about the design either "
                   "way." % (k, how, res[k][0]))

      # -- 3. the tiers ------------------------------------------------------
      require(TIER_A, "CPU1 no longer boots from its boot ROM, or a ROM's "
                      "contents no longer match the firmware")
      require(TIER_B, "CPU0 no longer reaches its own boot ROM macro, takes its "
                      "reset vector and branches to it")
      # A Tier-C key that EXISTS AND IS RED is a failure in every mode: the mode
      # narrows what is REQUIRED, never what is allowed to be broken. Under
      # full_handshake require(TIER_C) below says the same thing with a fuller
      # message, so this loop is skipped there rather than duplicating it.
      if MODE != "full_handshake":
          for k in TIER_C:
              st = res.get(k)
              if st is not None and st[0] != "PASS":
                  fail("%s: %s %s -- the bench declares this handshake "
                       "assertion, so a red one is a real unmet requirement "
                       "whatever MODE says is REQUIRED." % (k, st[0], st[1]))

      # -- 3b. NO RED ROW GOES UNACCOUNTED FOR -------------------------------
      # This is the generalisation of the defect this stage exists to fix. The
      # in-tree check grades four keys and never looks at the rest, so a
      # published FAIL passes. Here every red row must be a rung this stage
      # grades (reported above), a retired probe (reported above), or a row on
      # the KNOWN_OPEN register (reported below, as a warning with its reason).
      # Anything else is a rung the bench declares and this stage does not, and
      # it is RED: that fails, and names itself.
      for k in reds:
          if k in GRADED or k in RETIRED or k in KNOWN_OPEN:
              continue
          fail("UNGRADED RUNG IS RED: %s %s. The bench declares this assertion "
               "and this stage does not grade it, so nothing else in this check "
               "would have said a word about it. Either add it to a tier or add "
               "it to KNOWN_OPEN with a reason - a red nobody grades is exactly "
               "how the stage this replaces passed a published FAIL."
               % (k, res[k][1]))

      # -- 4. the run graded is the run declared -----------------------------
      if not os.path.exists(INPUTS):
          fail("no inputs.txt at %s: the verdict cannot be tied to a netlist, a "
               "firmware build or a date." % INPUTS)
      else:
          txt = open(INPUTS).read()
          if not re.search(r"^netlist\s*:.*/build/%s/outputs/" % re.escape(RUN_TAG),
                           txt, re.M):
              m = re.search(r"^netlist\s*:\s*(\S+)", txt, re.M)
              fail("inputs.txt says the netlist came from %s, but this stage "
                   "declares RUN_TAG=%s. The stage would be declaring one tree "
                   "and measuring another."
                   % (m.group(1) if m else "<unparseable>", RUN_TAG))

      # -- 5. THE FORCE CENSUS ----------------------------------------------
      # Source order is stated, not implied: the verdict's own census first,
      # sim.log only as a fallback for bundles written before it existed.
      declared, src = None, None
      if forces_line is not None:
          m = re.match(r"^FORCES\s+(\d+)\b", forces_line)
          if not m:
              fail("%s has a FORCES line this check cannot parse: %r"
                   % (VERDICT, forces_line[:120]))
          else:
              n = int(m.group(1))
              declared = set()
              for row in force_rows:
                  mm = re.match(r"^FORCE\s+(\S+)\s", row)
                  if mm: declared.add(mm.group(1))
              if len(declared) != n:
                  fail("%s says FORCES %d but carries %d FORCE row(s). The "
                       "census and its detail disagree; one of them is stale."
                       % (VERDICT, n, len(declared)))
              src = "verdict.txt FORCES census"

      slog = None
      run_end = None
      if os.path.exists(SIMLOG):
          slog = open(SIMLOG, errors="replace").read()
          in_log = set(re.findall(r"^GLSN-FORCE: declared (\S+) ->", slog, re.M))
          if declared is None:
              declared, src = in_log, "sim.log GLSN-FORCE lines (no FORCES census)"
          elif in_log != declared:
              fail("THE TWO FORCE RECORDS DISAGREE. %s says {%s}; sim.log's "
                   "GLSN-FORCE lines say {%s}. Two records of the same fact that "
                   "disagree mean one is stale, and picking a winner silently is "
                   "how a gate ends up quoting the wrong one."
                   % (VERDICT, ", ".join(sorted(declared)) or "nothing",
                      ", ".join(sorted(in_log)) or "nothing"))
          m = re.search(r"^GLSN-EVENT:\s+(\d+)\s+run complete", slog, re.M)
          if m:
              run_end = int(m.group(1))
      else:
          if declared is None:
              fail("no FORCES census in %s and no sim.log at %s. NOTHING in this "
                   "evidence says whether the bench held a design signal, and "
                   "'not shown' is not 'not present'. A verdict without the "
                   "census predates gen_netlist_tb.py's force record (landed "
                   "2026-08-19) or was written by a generator with that block "
                   "removed; either way it is UNKNOWN, not clean."
                   % (VERDICT, SIMLOG))
          else:
              note("no sim.log beside the verdict. The FORCES census answers "
                   "WHETHER a signal was held; only sim.log records WHEN it was "
                   "applied, and a force applied after the event it would have "
                   "faked is a different thing from one applied at reset.")

      if declared is not None:
          extra = declared - ALLOWED_FORCES
          if extra:
              fail("TESTBENCH OVERRIDE(S) NOT ON THIS STAGE'S ALLOW-LIST: %s "
                   "(source: %s). This stage allows %s. A force added to the "
                   "bench passes every existing verdict item identically while "
                   "proving less."
                   % (", ".join(sorted(extra)), src,
                      ", ".join(sorted(ALLOWED_FORCES)) or "NONE"))

      # -- 5b. DID THE CLOCK RUN LONG ENOUGH TO REACH WHAT WE GRADE? ---------
      # THE TRAP THIS EXISTS FOR. run_cycles=250000 at 20 ns ends the simulation
      # at 5,000,000,000 ps. A rung that fires later than that reads `FAIL
      # never` in verdict.txt, and `FAIL never` for "the clock ran out" is
      # BYTE-IDENTICAL to `FAIL never` for "the design failed". So before any
      # red is interpreted, the run must be shown to have reached past the last
      # rung this stage grades. Under fetch_path_only the netlist leg claims
      # only a fetch path and its run is deliberately short, so the clause is
      # scoped to the modes that claim a real boot.
      WINDOW_MODES = ("full_handshake", "unforced_fetch")
      window_short = False        # drives the outcome state, see section 7
      if MODE in WINDOW_MODES and LATE:
          latest_name = max(LATE, key=lambda k: LATE[k])
          if run_end is None:
              msg = ("THE RUN LENGTH IS UNKNOWN: no `GLSN-EVENT: <t> run "
                     "complete` line %s. Nothing on disk says how far this "
                     "simulation got, so a red on any rung after %d ps cannot "
                     "be told from a window that ended first."
                     % ("in " + SIMLOG if slog is not None
                        else "and no sim.log at " + SIMLOG, LATE_RUNG_PS))
              if any(k in LATE and not ok(k) for k in reds):
                  window_short = True
                  fail(msg + " There IS such a red in this verdict, so this is "
                       "unresolvable from the published evidence: collect "
                       "sim.log, or re-run.")
              else:
                  note(msg + " Every late rung is green here, so this run is "
                       "unambiguous - but the next red one would not be.")
          elif run_end < LATEST_GRADED_PS:
              window_short = True
              fail("WINDOW TOO SHORT FOR WHAT THIS STAGE GRADES. The simulation "
                   "ended at %d ps; the last rung graded here, %s, has only "
                   "ever been observed at %d ps. Every red below is ambiguous "
                   "by construction - it means 'the clock ran out' and reads as "
                   "'the design failed'. Raise run_cycles (the bench declares "
                   "%d cycles x %d ps = %d ps) or narrow what is graded."
                   % (run_end, latest_name, LATEST_GRADED_PS,
                      DECLARED_RUN_CYCLES, REF_PERIOD_PS, DECLARED_RUN_PS))
          else:
              obs("window: ran to %d ps, %d ps past %s at %d ps (%.1f%% "
                  "headroom); the bench declares %d cycles = %d ps."
                  % (run_end, run_end - LATEST_GRADED_PS, latest_name,
                     LATEST_GRADED_PS,
                     100.0 * (run_end - LATEST_GRADED_PS) / LATEST_GRADED_PS,
                     DECLARED_RUN_CYCLES, DECLARED_RUN_PS))
          # per-rung, so the message names the rung and not just the budget
          for k in reds:
              if k in LATE and run_end is not None and run_end < LATE[k]:
                  window_short = True
                  fail("%s IS RED BECAUSE THE CLOCK RAN OUT, NOT BECAUSE THE "
                       "DESIGN FAILED - or at least nothing here can tell them "
                       "apart. The run ended at %d ps and this rung has only "
                       "ever been observed at %d ps." % (k, run_end, LATE[k]))

      # -- 5c. THE KNOWN-OPEN REGISTER --------------------------------------
      # Reds here are EXPECTED and do not fail the stage - but they are printed,
      # with their reason and with what the run length does or does not settle.
      # Greens here RATCHET: the open item has closed and the register is stale.
      for k, (first_ps, why) in sorted(KNOWN_OPEN.items()):
          st = res.get(k)
          if st is None:
              continue                    # the shipped bench does not emit it
          if st[0] == "PASS":
              fail("KNOWN-OPEN ITEM HAS CLOSED: %s is PASS %s. This stage still "
                   "carries it on the KNOWN_OPEN register as a red it tolerates. "
                   "Move it into TIER_C and delete the register entry - a gate "
                   "that keeps excusing a rung that now works has stopped "
                   "asking. (%s)" % (k, st[1], OPEN_ITEM_REF))
              continue
          if first_ps is None:
              dating = ("no measured firing time exists for this rung, so the "
                        "run length cannot settle it either way")
          elif run_end is None:
              dating = ("run length unknown, and this rung has only ever fired "
                        "at %d ps" % first_ps)
          elif run_end < first_ps:
              dating = ("UNMEASURED, NOT OPEN: the run ended at %d ps, before "
                        "%d ps, the only time this rung has ever fired. This "
                        "red says the clock ran out. Do not quote it as "
                        "evidence about the firmware" % (run_end, first_ps))
          else:
              dating = ("the run reached %d ps, past the %d ps at which this "
                        "rung has fired before, and it still did not fire"
                        % (run_end, first_ps))
          note("KNOWN OPEN - %s: %s %s. %s. %s. Owner: eth firmware; "
               "evidence: %s" % (k, st[0], st[1], why.rstrip("."),
                                 dating.rstrip("."), OPEN_ITEM_REF))

      # -- 6. MODE ----------------------------------------------------------
      if MODE not in ("full_handshake", "unforced_fetch", "fetch_path_only"):
          fail("MODE=%r is not one of full_handshake, unforced_fetch, "
               "fetch_path_only." % MODE)

      if MODE in ("full_handshake", "unforced_fetch") and ALLOWED_FORCES:
          fail("MODE=%s with a non-empty ALLOWED_FORCES (%s). The two "
               "contradict each other; empty the allow-list."
               % (MODE, ", ".join(sorted(ALLOWED_FORCES))))

      if MODE == "full_handshake":
          require(TIER_C, "MODE=full_handshake claims the design brings up XiP "
                          "from a real device, verifies CPU1's image, executes "
                          "it and releases CPU0 unaided, so every link of that "
                          "chain that this bench can see must be asserted")

      # probe-form pinning, in all modes: a form change is a form change.
      pins_seen = 0
      for a, b in SAME_INSTANT:
          ha, hb = a in res, b in res
          if not ha and not hb:
              continue
          if ha != hb:
              fail("PROBE FORM IS PINNED BY A PAIR AND ONLY ONE HALF IS "
                   "DECLARED: %s is %s and %s is %s. A verdict records a key "
                   "name, never the expression behind it, so one name alone "
                   "cannot show which signal was probed. Declare both or "
                   "neither."
                   % (a, "present" if ha else "absent",
                      b, "present" if hb else "absent"))
              continue
          pins_seen += 1
          ta, tb = at(a), at(b)
          if ta is None or tb is None:
              fail("PROBE PAIR %s/%s is declared but at least one half has no "
                   "at= timestamp, so the two cannot be compared." % (a, b))
          elif ta != tb:
              fail("PROBE PAIR DISAGREES: %s at=%d and %s at=%d are two "
                   "probes on the SAME FLOP and must fire at the same "
                   "instant. One of them is not on that flop -- which is "
                   "the failure a verdict file cannot otherwise show, "
                   "because it records a key name and not an expression."
                   % (a, ta, b, tb))
      if pins_seen == 0:
          obs("probe-form pinning: INERT on this verdict - none of the %d probe "
              "pairs is declared (%s). The clause MEASURED NOTHING; it did not "
              "pass. It goes live the day the bench declares a re-sourced probe."
              % (len(SAME_INSTANT),
                 "; ".join("%s/%s" % p for p in SAME_INSTANT)))

      # ordering, in all modes, over whatever pairs are actually present
      ord_seen = 0
      for a, b in ORDER:
          ta, tb = at(a), at(b)
          if ta is None or tb is None:
              continue                  # a rung this bench does not declare
          ord_seen += 1
          if not ta <= tb:
              fail("ORDERING VIOLATED: %s at=%d did not precede %s at=%d. "
                   "The chain ran out of order; a green row per rung with "
                   "the rungs in the wrong sequence is not a boot."
                   % (a, ta, b, tb))
      obs("ordering: %d of %d pairs checked; the other %d name a rung this "
          "bench does not declare and were SKIPPED, not passed."
          % (ord_seen, len(ORDER), len(ORDER) - ord_seen))

      # the proximity clause, only where the bench declares both halves
      ts, tg = at("remap_write_strobe"), at("remap_ctrl_bit2_set")
      if tg is not None and ts is None and "remap_write_strobe" in res:
          fail("CPU0's BOOTGATE ROSE WITH NO WRITE STROBE BESIDE IT. "
               "remap_ctrl_bit2_set is PASS at=%d but remap_write_strobe "
               "never fired, so nothing wrote the remap register: the bit "
               "was put there by something other than the design." % tg)
      elif tg is not None and ts is not None:
          if not (0 <= tg - ts <= STROBE_WINDOW_PS):
              fail("BOOTGATE AND WRITE STROBE ARE NOT THE SAME EVENT: strobe "
                   "at=%d, bit set at=%d, %d ps apart (window %d ps; measured "
                   "on a real boot: 20000). A write to the remap block "
                   "somewhere else in the run does not evidence THIS bit being "
                   "set by THIS write." % (ts, tg, tg - ts, STROBE_WINDOW_PS))

      if MODE in ("full_handshake", "unforced_fetch"):
          if declared:
              fail("MODE=%s but the run declared force(s) %s. Under either of "
                   "these modes the design is claimed to release CPU0 by "
                   "itself." % (MODE, ", ".join(sorted(declared))))
          t0 = at("remap_ctrl_bit2_set") or at("eth_rom_msp_on_Q")
          if t0 is not None and t0 < EARLIEST_REAL_RELEASE_PS:
              fail("CPU0 WAS RELEASED AT at=%d ps, WHICH IS TOO EARLY TO BE THE "
                   "DESIGN DOING IT. A real release is behind a QSPI XiP "
                   "bring-up, a boot-table scan and an 880-byte serial-flash "
                   "copy: measured 3457830000 ps. A forced one lands a few "
                   "cycles after reset: measured 3470000 ps. The floor here is "
                   "%d ps, the same instant the bench's own cpu0_rom_idle_at_1ms "
                   "rung tests from inside the simulation. Something is holding "
                   "that wire, or the flash model is not attached."
                   % (t0, EARLIEST_REAL_RELEASE_PS))

      if MODE in ("unforced_fetch", "fetch_path_only"):
          # THE OTHER HALF OF THE CLAIM. In these modes the netlist leg does not
          # evidence the verified handshake, so it must be evidenced somewhere
          # -- and by a run of the SAME eth firmware that is in the mask ROM.
          if MODE == "fetch_path_only":
              if declared is not None and not declared:
                  fail("MODE=fetch_path_only but the run declared NO forces. "
                       "Either the bench stopped needing the CPU0_BOOTGATE "
                       "force -- in which case this stage is under-asserting "
                       "and MODE must be promoted -- or the force was dropped "
                       "without the handshake landing. Either way the "
                       "declaration is stale.")
              missing = ALLOWED_FORCES - (declared or set())
              if declared is not None and missing:
                  fail("expected force(s) %s are on this stage's allow-list but "
                       "were not declared by the run."
                       % ", ".join(sorted(missing)))
          if not os.path.exists(RTL_XML):
              fail("MODE=%s requires the RTL handshake evidence at %s and it is "
                   "absent. In this mode the netlist leg does not evidence a "
                   "VERIFIED handshake; with no RTL leg either, nothing in this "
                   "pipeline does." % (MODE, RTL_XML))
          else:
              try:
                  tcs = ET.parse(RTL_XML).getroot().findall(".//testcase")
              except ET.ParseError as e:
                  tcs = None
                  fail("%s does not parse (%s); a partial file is a partial run."
                       % (RTL_XML, e))
              if tcs is not None:
                  hit = [t for t in tcs if t.get("name") == RTL_TEST]
                  if not hit:
                      fail("%s does not contain testcase %s. The suite ran, but "
                           "not the test that observes CPU1's genuine release. "
                           "Of the 20 testcases in that suite, SEVEN reach the "
                           "testbench backstop _release_network_core_bootgate() "
                           "and set the gate themselves, so a green suite is "
                           "not evidence of a design release -- this one "
                           "testcase is." % (RTL_XML, RTL_TEST))
                  for t in hit:
                      if t.find("skipped") is not None:
                          fail("%s is <skipped/> in %s. A PASS THAT DID NOT RUN "
                               "IS NOT A CLEAN PASS." % (RTL_TEST, RTL_XML))
                      if t.find("failure") is not None or t.find("error") is not None:
                          fail("%s FAILED in %s." % (RTL_TEST, RTL_XML))
          # THE PIN. Two legs only compose if they ran the same firmware.
          def rom_words_sv(p):
              t = open(p, errors="replace").read()
              d = {}
              for a_, v in re.findall(
                      r"9'h([0-9a-fA-F]+)\s*:\s*rdata\s*=\s*32'h([0-9a-fA-F]+)", t):
                  d[int(a_, 16)] = int(v, 16)
              return d
          if not (os.path.exists(ETH_SV) and os.path.exists(ETH_BIN)):
              fail("cannot pin the RTL leg to the mask ROM: %s or %s is missing. "
                   "Unpinned, the RTL result describes some eth stage-0, not "
                   "necessarily the one on the die." % (ETH_SV, ETH_BIN))
          else:
              sv = rom_words_sv(ETH_SV)
              bs = [int(x.strip(), 2) for x in open(ETH_BIN) if x.strip()]
              diff = [i for i in range(len(bs)) if sv.get(i) != bs[i]]
              if len(sv) != len(bs):
                  fail("eth boot ROM pin: the RTL slot %s holds %d words, the "
                       "mask ROM code file %s holds %d."
                       % (ETH_SV, len(sv), ETH_BIN, len(bs)))
              if diff:
                  fail("ETH BOOT ROM PIN BROKEN: %s differs from the mask ROM "
                       "contents (%s) in %d of %d words, first at 0x%03x. The "
                       "RTL leg and the netlist leg therefore run DIFFERENT eth "
                       "stage-0 firmware and DO NOT COMPOSE. Refresh the slot "
                       "from the firmware build's own generated .sv."
                       % (ETH_SV, ETH_BIN, len(diff), len(bs), diff[0]))

      # THE RATCHET, in the direction that matters: a mode that has stopped
      # asking. If every Tier-C rung is present and green with no force, the
      # evidence is a full handshake and a lesser MODE is under-declaring it.
      if MODE != "full_handshake" and all(ok(k) for k in TIER_C) and not declared:
          fail("MODE=%s, but every Tier-C rung in this verdict is GREEN and no "
               "force was declared: the evidence describes a complete, "
               "unforced handshake. Promote MODE to full_handshake. A "
               "declaration that has stopped matching the evidence is how a "
               "gate quietly stops asking." % MODE)

      # -- 7. FIVE OUTCOMES, NOT TWO ----------------------------------------
      # "CPU0 did not boot" hides states with different owners.
      #
      # WHAT THE SHIPPED BENCH CAN AND CANNOT ATTRIBUTE. It declares no
      # remap_write_strobe rung, so there is no direct evidence that the DESIGN
      # wrote the bootgate. Attribution here rests on two indirect facts
      # instead: cpu0_rom_idle_at_1ms (CPU0 had not touched its ROM once at
      # 1 ms) and the release-time floor (its first fetch is 996x later than a
      # forced run's). That is weaker than a strobe and it is stated as such
      # rather than being quietly upgraded.
      released   = ok("eth_rom_msp_on_Q")
      gated      = ok("cpu0_rom_idle_at_1ms")
      copied_any = ok("cpu1_imem_write.accessed")
      copied_ok  = copied_any and ok("cpu1_imem_write.data_nonx")
      exec_any   = ok("cpu1_imem_fetch.accessed")
      exec_ok    = exec_any and ok("cpu1_imem_fetch.data_nonx")
      addressed  = ok("qspi_flash_addressed")
      fetched    = released and ok("eth_rom_branch_word62") and ok("eth_rom_port.data_nonx")
      if "eth_rom_msp_on_Q" not in res:
          state = ("SU UNCLASSIFIABLE - THE RELEASE IS NOT ASSERTED",
                   "this verdict declares no rung for CPU0 reaching its ROM, so "
                   "nothing here says whether the design released CPU0 or "
                   "something else did. That is a BENCH gap, not a design "
                   "failure: do not read it as S1.")
      elif any(k in res for k in RETIRED):
          state = ("SX PROBE CANNOT SEE",
                   "a retired 4-bit-bus probe is still declared. Its red says "
                   "nothing about the design, so no outcome can be classified "
                   "from this verdict until it is re-sourced.")
      # THE CLOCK-RAN-OUT STATE, and it comes BEFORE every design state on
      # purpose. A rung that never fired because the simulation stopped first is
      # not a design outcome at all, and classifying it as one - "S1 NO RELEASE"
      # on a run that simply ended at 2 ms - is the exact misreading the run
      # -length assertion exists to prevent.
      elif window_short:
          state = ("SW WINDOW TOO SHORT - NOT CLASSIFIABLE",
                   "the simulation ended before, or is not known to have "
                   "reached, the rungs this stage grades. The reds below mean "
                   "'the clock ran out' and read as 'the design failed'. Fix "
                   "the budget, then re-read: nothing here is a statement "
                   "about the design.")
      elif not released:
          state = ("S1 NO RELEASE",
                   "CPU0 never reached its own boot ROM. CPU1 never got to "
                   "either of its two 0x4 writes, so it halted before the "
                   "boot-table scan - suspect XiP bring-up.")
      elif "cpu0_rom_idle_at_1ms" in res and not gated:
          state = ("S0 RELEASE NOT ATTRIBUTABLE TO THE DESIGN",
                   "CPU0 reached its ROM, and it was ALREADY FETCHING AT 1 ms - "
                   "long before CPU1 could have finished a QSPI bring-up and a "
                   "boot-table scan. Something outside the design let it go, or "
                   "it is not gated in this build at all.")
      # A KEY THAT IS NOT DECLARED IS NOT A KEY THAT FAILED, and the two must
      # never share a state name. Under a bench that does not assert CPU1's
      # image copy - which is every bench in unforced_fetch and fetch_path_only,
      # and would be any future one that narrowed - the copy states below cannot
      # be evaluated at all. Saying so is not the same as saying S2.
      elif ("cpu1_imem_write.accessed" not in res
            or "cpu1_imem_fetch.accessed" not in res):
          state = ("SD NOT FULLY CLASSIFIABLE - THE COPY RUNGS ARE NOT DECLARED",
                   "CPU0 was released and reached its ROM, but this bench does "
                   "not assert whether CPU1 copied and executed an image, so "
                   "nothing here can separate a real boot from the "
                   "all-candidates-failed release. That is a statement about "
                   "this bench's SCOPE, not about the design.")
      elif not copied_any:
          state = ("S2 RELEASED, NOTHING WAS COPIED",
                   "this is the main.c:403 unconditional release after every "
                   "candidate failed. A blank/absent/corrupt flash produces "
                   "exactly this, and it is NOT a design failure - check that a "
                   "flash model is attached and its image is programmed. "
                   "`make -C ASIC/gls-netlist negative-control` produces it on "
                   "purpose and REQUIRES this stage to be red.")
      elif not copied_ok:
          state = ("S3 COPIED WITH X IN IT",
                   "CPU1 wrote its IMEM macro and some of what it wrote was X. "
                   "The transfer path is broken, not the image: a word that "
                   "leaves the flash defined and arrives undefined never came "
                   "off the device.")
      elif not exec_any:
          state = ("S3 RELEASED AND COPIED, BUT NOT VERIFIED",
                   "CPU1's image moved into IMEM and CPU1 never executed out of "
                   "it. The copy happens BEFORE the CRC check, so this is a "
                   "copy the CRC then rejected - the flash is present and the "
                   "payload or the copy is wrong.")
      elif not exec_ok:
          state = ("S3 EXECUTED AND READ X BACK",
                   "CPU1 fetched out of its own IMEM and some of what came back "
                   "was X. The macro or its read path, not the image.")
      elif not (fetched and addressed):
          state = ("S3 RELEASED AND COPIED, BUT NOT VERIFIED",
                   "a rung between the flash device and CPU0's branch is red; "
                   "see the ladder below.")
      else:
            state = ("S4 CPU1 BOOTED AND VERIFIED; CPU0 RELEASED, FETCHING AND REMAPPED",
                     "every rung this bench declares is green, in order, with no "
                     "override, including the CPU0 half: the network core IMEM is "
                     "written after release, fetched back, and REMAP stored. NOTE "
                     "WHAT THIS IS NOT: the IMEM probes sit on the macro port and "
                     "cannot attribute a beat to a master, and nothing here says "
                     "CPU0's application reached its own end state.")

      # -- 8. the ladder: NAME the first rung that broke ---------------------
      LADDER = [
        ("cpu1_dmem_write.accessed",  "CPU1 never wrote its DMEM: it did not reach main(). Look before the bootrom - reset, clock, or the ROM fetch path."),
        ("cpu1_main_entered",         "CPU1 ran but never stored its liveness marker 0x0F1C0DE1 to DMEM word 0x080. main() was entered but did not get past its first statement, or the marker moved. Measured on a good run: 46.830 us."),
        ("qspi_flash_addressed",      "QSPI_nCS never went low: NOTHING ON THE BOARD WAS ADDRESSED. Either no flash model is attached to the pads or CPU1 never issued a command. This is the rung that separates 'flash model absent' from 'flash model blank' - a blank flash still gets addressed. Measured on a good run: 47.590 us."),
        ("cpu1_imem_write.accessed",  "CPU1 addressed the flash and never wrote its OWN IMEM. It read the boot table and found no candidate it could copy - blank, corrupt or wrong-magic image. Measured on a good run: 250 words."),
        ("cpu1_imem_write.data_nonx", "CPU1 wrote its IMEM and some of what it wrote was X. That is a transfer path fault, not a bad image: a word that leaves the flash defined and arrives undefined never came off the device."),
        ("cpu1_imem_fetch.accessed",  "CPU1 wrote its IMEM and never read it back. It copied the words and did not execute them: the copy happens before the CRC, so this is a CRC rejection or a failed remap/VTOR store. Measured on a good run: 21,141 reads."),
        ("cpu1_imem_fetch.data_nonx", "CPU1 executed out of its IMEM and some of what came back was X. Suspect the macro or its read path, not the image."),
        ("cpu0_rom_idle_at_1ms",      "CPU0 WAS ALREADY FETCHING AT 1 ms, LONG BEFORE CPU1 COULD HAVE RELEASED IT. A real release is behind a QSPI bring-up and a boot-table scan; measured at 3.458 ms. Something is holding the bootgate, or CPU0 is not gated in this build at all."),
        ("eth_rom_port.accessed",     "CPU0's boot ROM macro was never accessed at all: CPU0 was not released, or its clock or reset never arrived."),
        ("eth_rom_msp_on_Q",          "CPU0 reached its ROM and still did not read its stack pointer out of it. Suspect CPU0's own reset release, clock, or ROM decode. Measured on a good run: 3.457830 ms."),
        ("eth_rom_rstvec_on_Q",       "CPU0 read its MSP and never its reset vector - one word later. Measured on a good run: 3.457850 ms."),
        ("eth_rom_branch_word62",     "CPU0 fetched the vector table but never fetched word 0x62, the reset vector's target. It took the vector and did not branch there. Measured on a good run: 3.457870 ms."),
      ]
      first_broken = None
      for k, why in LADDER:
          st = res.get(k)
          if st is None:
              continue                   # not declared in this MODE's bench
          if st[0] != "PASS":
              first_broken = (k, why); break

      if not state[0].startswith("S4") and MODE == "full_handshake" and not bad:
          fail("the evidence describes %s, not a boot, yet every declared "
               "assertion is green. The bench is not asking enough: add the "
               "rung that would have been red." % state[0])

      # -- report -----------------------------------------------------------
      print("  verdict : %s" % VERDICT)
      if result_line: print("    %s" % result_line)
      print("    MODE    : %s" % MODE)
      print("    forces  : %s  [%s]"
            % (", ".join(sorted(declared)) if declared
               else ("NONE declared" if declared is not None else "UNKNOWN"),
               src or "no source"))
      print("    window  : %s"
            % ("%d ps" % run_end if run_end is not None else "UNKNOWN"))
      print("    OUTCOME : %s" % state[0])
      print("      %s" % state[1])
      if first_broken:
          print("    DIAGNOSIS: first broken rung is %s" % first_broken[0])
          print("      %s" % first_broken[1])
      # -- 9. SECONDARY TREES: every OTHER netlist whose evidence is published ---
      # The sections above grade ONE tree in full, named by RUN_TAG/ITEM. That tree is
      # a floorplan study. The netlist the STREAM was written from is a different run,
      # and grading only the first would mean the gate says nothing about the thing
      # being taped out.
      #
      # Each entry is graded at the top level: the tree must EXIST, its RESULT must
      # read PASS with fail=0, and its FORCES census must be 0. Deliberately not the
      # full ladder - the tiers, ordering and probe-form clauses are pinned to the
      # primary bench's rung names, and a second run may legitimately declare a
      # different set. What cannot differ is "it passed, unaided".
      #
      # AN ABSENT TREE IS A FAILURE, NOT A SKIP. If a run is retired its entry comes
      # out of this list by hand, which is a deliberate act someone reviews. The
      # alternative - tolerate absence - is how a gate quietly stops measuring the only
      # netlist anyone cares about.
      SECONDARY = [
        ("gdsrun-20260819", "gdsrun_cc",
         "the routed netlist of the 2026-08-19 GDS run - the lineage the stream was "
         "written from. PG-complete as written (`write_netlist -include_pg`), leaf "
         "stub definitions stripped before simulation."),
      ]
      for _tag, _item, _why in SECONDARY:
          _d = "ASIC/eth-chiplet/build/%s/reports/gls/%s" % (_tag, _item)
          _v = os.path.join(_d, "verdict.txt")
          if not os.path.exists(_v):
              fail("SECONDARY TREE NOT PUBLISHED: %s. This stage declares it and grades "
                   "it, so its absence is UNVERIFIED, not a pass. THIS IS THE EXPECTED RED "
                   "WHEN A RUN IS SUPERSEDED, and it is deliberate. Two ways out, both by "
                   "hand. Publish that run's evidence: set GLSN_EVIDENCE_%s in "
                   "ASIC/gls-netlist/Makefile, then `make -C ASIC/gls-netlist "
                   "gls-netlist-publish-%s`. Or retire the entry: in ci/signoff.yaml, in "
                   "this stage's check, search for `SECONDARY = [`. Retiring is a "
                   "reviewable edit rather than a gate quietly going quiet. (%s)"
                   % (_v, _item, _item, _why))
              continue
          _t = open(_v).read()
          if _t == open(VERDICT).read():
              fail("SECONDARY TREE IS THE PRIMARY: %s is byte-identical to %s. Two names "
                   "for one measurement is not two measurements." % (_v, VERDICT))
              continue
          _m = re.search(r"^RESULT\s+(\S+)\s+pass=(\d+)\s+fail=(\d+)", _t, re.M)
          if not _m:
              fail("SECONDARY TREE HAS NO RESULT LINE: %s. A verdict that never stated "
                   "an outcome cannot be read as a good one." % _v)
          elif _m.group(1) != "PASS" or _m.group(3) != "0":
              fail("SECONDARY TREE IS RED: %s reads `RESULT %s pass=%s fail=%s`. %s"
                   % (_v, _m.group(1), _m.group(2), _m.group(3), _why))
          elif not re.search(r"^FORCES 0 ", _t, re.M):
              fail("SECONDARY TREE FORCED OR UNKNOWN: %s carries no `FORCES 0` row, so "
                   "the bench may have held a design signal. A pass obtained by force "
                   "is not the same claim." % _v)
          else:
              # PROVENANCE. A verdict sitting at the right path proves nothing about
              # WHICH netlist produced it. The primary tree gets this in section 4;
              # without it here, a pass published under a run tag need never have come
              # from that run. This item simulates a STRIPPED COPY, so its inputs.txt
              # records only that copy in build/ - the chain has to be walked:
              #   strip_leaf_defs.txt names a SOURCE under this run's outputs/, and
              #   its `out` is the very file inputs.txt says was simulated.
              # A tree whose netlist is directly under the run's outputs/ needs no
              # strip report; one that is neither is UNPROVEN and fails.
              _ip = os.path.join(_d, "inputs.txt")
              _nl = None
              if os.path.exists(_ip):
                  _mm = re.search(r"^netlist\s*:\s*(\S+)", open(_ip).read(), re.M)
                  _nl = _mm.group(1) if _mm else None
              _out_re = r"/build/%s/outputs/" % re.escape(_tag)
              if _nl is None:
                  fail("SECONDARY TREE HAS NO inputs.txt NETLIST LINE: %s. Its verdict "
                       "cannot be tied to any netlist at all." % _d)
              elif re.search(_out_re, _nl):
                  info.append("secondary tree %s/%s: RESULT %s pass=%s fail=0, FORCES 0, "
                              "netlist directly under %s/outputs/"
                              % (_tag, _item, _m.group(1), _m.group(2), _tag))
              else:
                  _sp = os.path.join(_d, "strip_leaf_defs.txt")
                  if not os.path.exists(_sp):
                      fail("SECONDARY TREE PROVENANCE UNPROVEN: %s simulated %s, which is "
                           "not under /build/%s/outputs/, and there is no "
                           "strip_leaf_defs.txt to say where it came from. The verdict is "
                           "published under this run's tag but nothing ties it to this "
                           "run's netlist." % (_d, _nl, _tag))
                  else:
                      _st = open(_sp).read()
                      _src = re.search(r"^strip_leaf_defs:\s*(\S+)", _st, re.M)
                      _dst = re.search(r"^\s*out\s*:\s*(\S+)", _st, re.M)
                      if not _src or not _dst:
                          fail("SECONDARY TREE STRIP REPORT UNPARSEABLE: %s carries neither "
                               "a source nor an out line." % _sp)
                      elif not re.search(_out_re, _src.group(1)):
                          fail("SECONDARY TREE STRIPPED THE WRONG NETLIST: %s says it "
                               "stripped %s, which is not under /build/%s/outputs/. The "
                               "evidence is published under that tag regardless."
                               % (_sp, _src.group(1), _tag))
                      elif _dst.group(1) != _nl:
                          fail("SECONDARY TREE CHAIN IS BROKEN: %s stripped to %s, but "
                               "inputs.txt says %s was simulated. Two different files; the "
                               "strip report does not describe this run." 
                               % (_sp, _dst.group(1), _nl))
                      else:
                          info.append("secondary tree %s/%s: RESULT %s pass=%s fail=0, "
                                      "FORCES 0, netlist stripped from %s/outputs/"
                                      % (_tag, _item, _m.group(1), _m.group(2), _tag))


      for i in info:
          print("gls-netlist: note - %s" % i)
      for w in warn:
          print("gls-netlist: WARN - %s" % w)
      for b in bad:
          print("gls-netlist: FAIL - %s" % b)
      if not bad:
          n_c = sum(1 for k in TIER_C if ok(k))
          print("gls-netlist: PASS - %d/%d Tier-A, %d/%d Tier-B, %d/%d Tier-C "
                "green, %d known-open red, %s"
                % (len(TIER_A), len(TIER_A), len(TIER_B), len(TIER_B),
                   n_c, len(TIER_C),
                   sum(1 for k in KNOWN_OPEN if k in res and not ok(k)),
                   state[0]))
      sys.exit(1 if bad else 0)
      PYEOF
    check_proof:
      must_pass:
        # 1. THE SHIPPED BENCH'S OWN SHAPE. Exactly the 22 keys
        #    bench/eth_chiplet_fp1505_cc.json emits, RESULT PASS pass=22 fail=0,
        #    FORCES 0, and a sim.log whose run-complete is the declared
        #    250,000-cycle window.
        - ci/fixtures/gls-netlist/pass
        # 3. THE BENCH GROWN THE HANDSHAKE RUNGS. Proves the probe-pair,
        #    strobe-proximity and extended-ordering clauses are live, not
        #    decorative, the day the bench declares them.
        - ci/fixtures/gls-netlist/pass-extra-rungs
      # A KNOWN WEAKNESS IN THIS SET, recorded rather than left to be discovered.
      # Most fail-* fixtures below are 22-row verdicts built before the five CPU0
      # rungs moved into TIER_C. They now fail for their OWN reason AND with five
      # extra `... NOT DECLARED` lines, because a 22-row verdict cannot declare a
      # rung this stage now requires. Verified 2026-08-20: every case still fails
      # for its named reason, so the proofs hold today - fail-tierc-missing is the
      # only one whose failures are all NOT DECLARED, and for that case that IS the
      # named reason.
      #
      # The risk is future, not present: if someone fixes the defect a fixture
      # exhibits, the case keeps failing on NOT DECLARED and nobody notices it
      # stopped testing what it names. `prove` asserts THAT a case fails, never WHY.
      # Two ways to close it, neither done here: rebuild each fail-* verdict on the
      # 27-row base so it fails only for its own reason, or teach check_proof a
      # per-case expected-substring so a case that fails for the wrong reason is
      # itself a failure. The second is the better fix and is not local to this file.
      must_fail:
        # THE DEFECT, verbatim: the published `RESULT FAIL pass=10 fail=4` the
        # in-tree check passes today, with all four of its cc_rom keys green.
        - ci/fixtures/gls-netlist/fail-full0814-published
        # the same shape on the shipped bench's key set.
        - ci/fixtures/gls-netlist/fail-eth-rom-red
        # THE GENERALISATION: a red row this stage does not grade.
        - ci/fixtures/gls-netlist/fail-ungraded-rung-red
        # THE CPU0 HALF IS RED. 29 rows, RESULT FAIL pass=24 fail=5, the five reds
        # being eth_imem_write_after_release / eth_imem_fetch (both halves) and
        # eth_sysctrl_remap_set. Until 2026-08-19 this was a must_pass named
        # pass-known-open-eth: those rungs sat on the KNOWN_OPEN register and the
        # stage tolerated them. They are TIER_C now, so the shape is a plain failure.
        # The fixture CHANGED SIDE rather than being deleted - it is exactly the
        # regression shape a firmware change would produce.
        - ci/fixtures/gls-netlist/fail-cpu0-half-red
        # THE SECONDARY TREE, both ways it can be wrong. Section 9 grades the run the
        # STREAM came from, and an ungraded addition is exactly what this stage exists
        # to prevent - so the clause carries its own proof that it can fail.
        #   red     : the primary passes and the secondary reads RESULT FAIL. A gate
        #             that reported the floorplan study and stayed silent about the
        #             taped-out netlist would call this green.
        #   missing : the secondary is declared and its verdict is not on disk.
        #             UNVERIFIED IS NOT A PASS; retiring a run is a deliberate edit.
        - ci/fixtures/gls-netlist/fail-secondary-red
        - ci/fixtures/gls-netlist/fail-secondary-missing
        #   wrong netlist : the tree is published under this run's tag, passes, is
        #                   unforced - and its strip report says the netlist it
        #                   simulated came out of a DIFFERENT run's outputs/. A
        #                   verdict at the right path proves nothing about which
        #                   netlist produced it; that is what this clause is for.
        - ci/fixtures/gls-netlist/fail-secondary-wrong-netlist
        # RETIRED 2026-08-19: fail-known-open-closed. It proved the ratchet by showing
        # a KNOWN_OPEN rung gone green. With the register empty that shape is now
        # identical to `pass`, so the case could no longer test what it named. The
        # ratchet CODE stays - it guards the next entry - but nothing exercises it
