  - id: padring-gds
    phase: physical
    gate: block
    label: soclabs-pdk
    description: "GDS-level padframe name/count/order AND corner-orientation check -- the local analog of the broker's CompareCells + Padringcheck"
    # PROMOTED report -> block, 2026-08-18 (docs/tapeout/53-gate-promotion-plan.md
    # SS1, promotion-order #1). Names/counts/order have been clean on every real
    # build checked (fp1505, full-20260814, and the exact GDS IMEC evaluated --
    # docs/tapeout/52-padring-gds-check.md SS5) -- that half of this gate meets
    # `drc`'s own promotion bar today. The NEW half, added alongside the
    # promotion, is corner orientation: scripts/check_padring_gds.py now reads
    # each PCORNER_G placement's live STRANS/ANGLE transform out of the GDS
    # and diffs it against a reviewed EXPECTED_ORIENTATION table (see that
    # script's own header comment for why the table is hand-written and NOT
    # re-derived from nanosoc_eth_chiplet_pads.io at runtime, or from a
    # formula -- both would be blind to a repeat of the exact bug this exists
    # to catch).
    #
    # WHY THIS IS SAFE TO BLOCK ON TODAY, AND WHY IT WILL BE RED. IMEC's
    # foundry Padringcheck caught all four PCORNER_G corners placed 180 degrees
    # wrong (Error-padringcheck x4, ASIC/imec_results/Archive_..._18Aug26_19u28/
    # padring/Padring_check.rpt). The .io SOURCE has been hand-fixed
    # (commit d93331f), but fixing the source does not retroactively fix an
    # ALREADY-STREAMED GDS -- that needs a new Innovus place/route run, which
    # has not happened on this site since the fix. Measured 2026-08-18: running
    # the extended checker directly against fp1505's real, current
    # outputs/nanosoc_eth_chiplet_pads.gds -- the build `needs_implementation:`
    # below points at, the one that would ship -- reproduces the IMEC finding
    # exactly (all 4 corners, same wrong/expected angle pairs). So this stage
    # goes live RED, on a REAL, currently-true defect nobody had a local gate
    # for before today. That is not a reason to leave it `report`: it is the
    # whole point of promoting it (same doctrine as `drc`'s own promotion note
    # a few hundred lines up -- "THIS STAGE STAYS RED, and that is the point.
    # No green is manufactured here"). It goes green the day a re-stream picks
    # up the corrected .io.
    #
    # WHAT THIS DOES NOT DO: prove the padframe is DRC-clean or that the
    # streamed geometry electrically matches the real TSMC cell -- we hold no
    # usable tpbn65v/tphn65lpgv2od3 GDS to diff against on this machine. It
    # only proves OUR OWN intended pad/corner/bond-pad names, counts, per-side
    # order and corner orientation actually made it into the stream. See
    # scripts/check_padring_gds.py's docstring for the full scope and limits,
    # and docs/tapeout/52-padring-gds-check.md for what running it against the
    # exact GDS IMEC saw found.
    needs_implementation:
      - ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds
    # fp1505, named explicitly -- same "declare one build, run and grade that
    # SAME build" discipline as drc/rom-gds above (this file's own comment
    # block ahead of the physical-phase stages explains why: a bare
    # `make asic-padring-gds` resolves GDS against the LEGACY outputs/ dir,
    # which holds no GDS at all).
    run: make -C ASIC/genus-innovus padring-gds GDS=$PWD/ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds
    # Re-read the JSON report rather than trusting the tool's own exit code --
    # same doctrine as every other block-gated stage in this file. The script's
    # own rc (EXIT_MISMATCH on any non-empty `problems`) is ALREADY an honest
    # predicate (verified: `signoff.py prove` below exercises it end to end),
    # but a `check:` that re-derives PASS/FAIL from the ARTEFACT, not the exit
    # status, is what catches a tool that silently measured nothing (the
    # "0 RTL ports agrees with 0 classified" class of bug chip-boundary's own
    # check guards against) -- so this asserts the report actually measured
    # something (counts non-empty, all 4 corners resolved) as well as that it
    # found nothing wrong.
    check: |
      python3 - <<'EOF'
      import json, sys
      p = "ASIC/genus-innovus/reports/padring_gds_report.json"
      try:
          d = json.load(open(p))
      except (OSError, json.JSONDecodeError) as e:
          print(f"padring-gds: FAIL — no readable JSON report at {p} ({e}); "
                f"the stage produced no evidence")
          sys.exit(1)
      bad = []
      if not d.get("top_cell"):
          bad.append("no top_cell recorded — the run never resolved the design's top cell")
      counts = d.get("counts") or {}
      if not counts:
          bad.append("0 cell families in 'counts' — the run measured nothing, "
                     "which is not the same as measuring nothing wrong")
      orient = d.get("corner_orientation") or {}
      if len(orient) != 4:
          bad.append(f"{len(orient)} corner(s) in 'corner_orientation', expected "
                     f"4 — the orientation check did not run over all four corners")
      else:
          for name, v in orient.items():
              if "observed_angle" not in v:
                  bad.append(f"{name}: orientation could not be resolved against "
                             f"the GDS (see 'problems' for why)")
      problems = d.get("problems") or []
      if problems:
          kinds = sorted({pr["kind"] for pr in problems})
          bad.append(f"{len(problems)} problem group(s) reported: {', '.join(kinds)}")
      for b in bad:
          print("padring-gds: FAIL —", b)
      if not bad:
          print(f"padring-gds: PASS — {len(counts)} cell families, "
                f"{len(orient)} corner(s), 0 problems")
      sys.exit(1 if bad else 0)
      EOF
    check_proof:
      must_pass: ci/fixtures/padring-gds/pass
      must_fail:
        # The orientation channel this promotion adds -- REAL captured evidence
        # (ASIC/eth-chiplet/build/fp1505/outputs/nanosoc_eth_chiplet_pads.gds,
        # unmodified), not a hand-typed shape. See its PROVENANCE.
        - ci/fixtures/padring-gds/fail-orientation-corner-180
        # The three defect classes doc 53 SS1's promotion-evidence column names
        # for the pre-existing name/count/order checks, which had NO check_proof
        # coverage at all before this promotion (there was no check: to prove).
        - ci/fixtures/padring-gds/fail-dropped-cell
        - ci/fixtures/padring-gds/fail-renamed-cell
        - ci/fixtures/padring-gds/fail-reordered-side
    artifacts:
      - ASIC/genus-innovus/reports/padring_gds_report.json

# -----------------------------------------------------------------------------
# Checks a complete ASIC signoff would include that this pipeline does NOT do.
# Listed so the report states its own limits — a signoff report that only shows
# passes is misleading.
#
# `refuted_by:` — HOW EACH GAP PROVES IT IS STILL REAL.
#   A declared gap rots. `full-design-lint` sat here claiming "make lint covers 3
#   authored files of 598" for weeks after verif/lint/full/run.sh was written and
#   closed it, and nothing in the pipeline could notice: a `reason:` string is
#   never executed. `refuted_by:` is a shell command that MUST FAIL for the gap
#   to still exist. If it SUCCEEDS the gap is gone and this file is stale.
#   `signoff.py lint` runs every one of them and goes red on any that succeeds.
#
#   Write the command against the LOAD-BEARING CLAUSE of the reason, not the
#   whole prose — "no Tempus installed" is testable, "which is not signoff STA"
#   is a judgement. An entry with no refuted_by is reported as unfalsifiable and
#   flagged for manual review rather than quietly trusted.
#
#   THE COMMANDS ARE HOST-RELATIVE. `command -v tempus` is a fact about the
#   runner, not about the design, so a gap can legitimately be refuted on one
#   host and stand on another. That is the point: it is the runner's tools that
#   decide what this pipeline could check.
#
#   Two entries below were ALREADY STALE when this key was added on 2026-08-17,
#   and their reasons are corrected here — see metal-density-fill and
#   power-signoff. That is three stale declarations found by one mechanism on the
#   day it landed, which is the argument for having it.
# -----------------------------------------------------------------------------
unsupported:
  - id: sta-signoff
    reason: "No Tempus or PrimeTime installed. Timing evidence is limited to Genus/Innovus in-tool reports, which is not signoff STA"
    refuted_by: "command -v tempus >/dev/null || command -v pt_shell >/dev/null || command -v primetime >/dev/null"
  - id: antenna-signoff
    reason: "Innovus check_process_antenna DOES run and ANTENNA diodes ARE inserted by filler.tcl (reports/*_imp_antenna.rep), but nothing gates on the count and it is a router-level check, not foundry antenna signoff"
    # The load-bearing clause is "nothing GATES on the count". Refuted the day a
    # stage in this manifest does. (Not a grep for the word 'antenna' — the
    # reason text above lives in this same file and would match itself.)
    refuted_by: |
      python3 -c "import yaml,sys; m=yaml.safe_load(open('ci/signoff.yaml')); \
      sys.exit(0 if any('antenna' in s['id'] for s in m.get('stages',[])) else 1)"
  - id: metal-density-fill
    # CORRECTED 2026-08-17. The old text read "add_metal_fill appears nowhere in
    # the flow" and that is false: scripts/4b_pnr_route_eval.tcl:1215-1228 calls
    # set_metal_fill for M1-M7, M8 and M9 and then add_metal_fill over M1..AP.
    # What is true is that it is behind an option switched OFF by default, so no
    # shipped stream has been filled. The gap is real; the stated reason was not.
    reason: "Metal fill IS implemented (scripts/4b_pnr_route_eval.tcl:1215-1228, set_metal_fill + add_metal_fill) but sits behind EVR_METAL_FILL, which defaults to 0, so no streamed GDS has been filled. Per-layer metal density is still unaddressed and will fail foundry density rules"
    refuted_by: "grep -qE '^[[:space:]]*opt[[:space:]]+EVR_METAL_FILL[[:space:]]+[1-9]' ASIC/genus-innovus/scripts/4b_pnr_route_eval.tcl"
  - id: gds-completeness
    reason: >
      THE STREAMED GDS HAS NO TRANSISTORS IN 424 OF ITS CELL MASTERS, and it
      looks complete. write_stream merges only $gds_merge_list (the 8 memory
      macros); the route log records "IMPOGDS-218: Number of master cells not
      found after merging: 424". Because -output_macros was used, each missing
      master still got its LEF pin/obstruction shapes, so every cell name
      resolves and nothing errors: SDFCNQD1 is 94 polygons on M1 ONLY, INVD1 is
      8, FILL1 is 2, PAD70GU is AP/RDL only — against 545 polygons across
      OD/PO/CO/M1 for a correctly merged memory macro. Root cause: this PDK
      ships Front_End packages only, and no *_BE directory exists anywhere on
      the system. PERMANENT AS OF 2026-08-17 — the Back-End packages will not be
      obtained; that was DECIDED, not discovered, so this is a standing property
      of every stream this project will ever produce and not a pending delivery.
      CONSEQUENCE, restated for the decision: the design-owned DRC count is a
      FLOOR, not a total. A rule between top-level routing and a standard cell's
      INTERNAL geometry cannot fire, because that geometry is not in the stream,
      so "design == 0" means "clean in the layers we actually have" and never
      "clean". Results are therefore waived on the record with that limit stated
      — see docs/DRC_WAIVER_INVENTORY.md, which supersedes the status section of
      docs/TSMC_BACKEND_PACKAGE_REQUEST.md.
    # The reason names its own root cause — "no *_BE directory exists anywhere on
    # the system" — so that is the clause to test. ${TSMC_65_HOME} holds only *_FE
    # (Front-End packages only; no Back-End package is present), measured 2026-08-17.
    # Bounded at depth 4 so `lint` stays sub-second; the packages would land as
    # siblings of the FE ones, not buried.
    refuted_by: "find ${TSMC_65_HOME} -maxdepth 4 -name '*_BE' -type d 2>/dev/null | grep -q ."
  - id: lvs
    reason: >
      Not merely unwired. Tooling is fully available and idle — Calibre
      nmLVS-H (150 seats, 0 in use), Synopsys IC Validator (192, 0) and Cadence
      Pegasus (41, 0) — the TSMC LVS decks are on disk, and a working v2lvs +
