      must_fail:
        - ci/fixtures/bnd/fail-design-results
        - ci/fixtures/bnd/fail-saturated-cap
        - ci/fixtures/bnd/fail-no-summary
        # Same live waiver-file test as drc's fail-waiver-stale: a plausible
