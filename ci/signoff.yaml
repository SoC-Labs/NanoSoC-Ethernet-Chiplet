      tpbn65v anywhere on this system (one 92-byte unit.cdl in the whole PDK).
      The Arm sc12 library DOES ship both, but has no IO or bond-pad library,
      so it cannot close full-chip LVS. PERMANENT AS OF 2026-08-17: the CDL
      arrives only in the Back-End packages and those will not be obtained, so
