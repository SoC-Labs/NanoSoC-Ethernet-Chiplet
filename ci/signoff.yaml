        # THE CYCLE BUDGET, both shapes.
        - ci/fixtures/gls-netlist/fail-window-too-short
        - ci/fixtures/gls-netlist/fail-late-red-unknown-window
        # a probe that cannot see is still declared: its red must read as
        # "re-source this", never as "the handshake failed".
        - ci/fixtures/gls-netlist/fail-unobservable-probe
        # the force record, in its three failure shapes.
        - ci/fixtures/gls-netlist/fail-force-returned
        - ci/fixtures/gls-netlist/fail-forces-unknown
        - ci/fixtures/gls-netlist/fail-census-contradiction
        # released three orders of magnitude too early to be the design.
        - ci/fixtures/gls-netlist/fail-release-too-early
        # the two force-is-gone shapes that need no log at all.
        - ci/fixtures/gls-netlist/fail-release-without-strobe
        - ci/fixtures/gls-netlist/fail-strobe-far-from-release
        # probe form: two names on one flop that disagree, and one name alone.
        - ci/fixtures/gls-netlist/fail-probe-pair-disagree
        - ci/fixtures/gls-netlist/fail-probe-pair-orphan
