# Both pins are correct: drc names the newest FINISHED build, and lec
# names an older one under an exemption that is still earned — the
# newest build has no work/fv, and the two builds' _gate.v are the same
# bytes, so grading the older one IS grading the shipping netlist.
# FIXTURE, not the real ci/signoff.yaml — see ci/fixtures/README.md.
# SYNTHETIC BY CONSTRUCTION and it has to be: this gate's subject IS the
# manifest, so a fixture for it is a manifest. The stage ids below are the real
# ones (drc, lec) because scripts/ci/build_freshness.py's exemption register is
# keyed on (stage id, build tag) — a fixture using invented ids could not
# exercise an exemption at all, which is half of what this gate does.
design: fixture
top: fixture
stages:
  - id: drc
    description: "fixture stage"
    run: make drc RUN_TAG=gdsrun-20260823-rzG
    needs_implementation:
      - ASIC/eth-chiplet/build/gdsrun-20260823-rzG/outputs/nanosoc_eth_chiplet_pads.gds
  - id: lec
    description: "fixture stage"
    run: make lec-syn RUN_TAG=gdsrun-20260821-slpads
    needs_implementation:
      - ASIC/eth-chiplet/build/gdsrun-20260821-slpads/outputs/lec.dofile
