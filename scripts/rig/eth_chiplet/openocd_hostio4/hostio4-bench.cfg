# OpenOCD config: the nanoSoC ethernet chiplet on the HAPS-SX bench, over the
# real HOSTIO4/ADP link.
#
# Chain, all of it on your workstation -- haps-hostio does its own ssh remoting
# to haps-dev, so nothing needs installing on the shared host:
#
#   openocd (this cfg) --TCP--> adp-bridge --> haps-hostio console --> dongle
#                                                       --7 wires--> the SoC
#
# Bring the left-hand side up FIRST; see README.md "Running it on the bench".
#
# The ADP monitor cannot reach the Cortex-M PPB on the image currently on the
# board (no 0xE0/0xA0/0xB0 region in debug_m's AHB decoder), so the target here
# is the stock mem_ap, not cortex_m. That means memory access is REAL and the
# register view does not exist -- mem_ap serves no gdb port by default
# (mem_ap.c:53-54 sets gdb_port_override="disabled" itself).
#
# A joint work commissioned on behalf of SoC Labs, under Arm Academic
# Access license.  Copyright (C) 2026, SoC Labs (www.soclabs.org)

adapter driver hostio4

# Must match the --tcp port you gave adp-bridge.
hostio4_port  127.0.0.1:24900

hostio4_base  0x00000000

# Words per R<count> block read. The win over per-word reads is real but the
# link is slow either way; keep it modest so a stall is bounded.
hostio4_blocksize 16

# Per-command budget in ms. Generous, because the real path is
# USB -> MicroPython -> PIO -> 7 wires, not a loopback socket.
hostio4_timeout 4000

# Block write via the ADP `U` command is OFF by default and should stay off on
# the bench until it has been exercised: a short payload parks the monitor
# indefinitely (the upload read state treats 0x04/0x00/0x1B as payload, not
# escapes) and recovery costs up to 8192 CRs.
# hostio4_block_write on

transport select dapdirect_swd

# The DP is emulated in software by the driver, so there is no real IDCODE to
# check -- -expected-id 0 with -ignore-version keeps OpenOCD from inventing one.
swd newdap chip cpu -expected-id 0x00000000 -ignore-version
dap create chip.dap -chain-position chip.cpu

target create chip.ahb mem_ap -dap chip.dap -ap-num 0

# ---------------------------------------------------------------------------
# Helpers. Run these from the telnet shell (port 4444).
# ---------------------------------------------------------------------------

# The one-command smoke test. 0x18003c00 is the boot ROM's initial MSP and is
# the same word haps-hostio verify-target leg 5 checks, so agreement with that
# is agreement with an independently-proven path.
proc hostio4_smoke {} {
    echo "bootROM\[0x08000000\] = [mdw 0x08000000]   (expect 0x18003c00)"
    echo "-- block read, 8 words, should emit ONE R00000008 on the wire --"
    mdw 0x08000000 8
}

# Reads that are safe on this image. 0x2A000FF0..FFC is the reset_ctrl block's
# CoreSight-style ID ROM; it composes to 0xb105f00d from four DIFFERING words,
# so it also refutes "the bus returns a constant".
proc hostio4_ident {} {
    echo "CID words @0x2A000FF0:"
    mdw 0x2A000FF0 4
}

# Prove the fault path is live: 0x30000000 is unmapped for debug_m, so this
# must report an error rather than returning zeros. A driver that cannot tell
# you about a bus error is worse than one that cannot read at all.
proc hostio4_fault {} {
    echo "expect an ERROR on the next line, not a value:"
    catch {mdw 0x30000000} m
    echo "-> $m"
}

# DO NOT read or write 0x2E000000-0x2FFFFFFF. That is the die-to-die window;
# with the link down it stalls the AHB bus for ever and the ADP monitor has NO
# bus timeout in RTL, so only a reset recovers the board. The driver refuses
# that range itself -- this proc proves the refusal happens before any byte
# reaches the wire.
proc hostio4_d2d_guard {} {
    echo "expect the DRIVER to refuse this, with no traffic on the link:"
    catch {mdw 0x2E000000} m
    echo "-> $m"
}
