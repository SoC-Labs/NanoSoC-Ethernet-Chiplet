# Posture A: the same target as hostio4-fake.cfg, but with a gdb port.
#
# READ THIS BEFORE USING IT.  OpenOCD's `mem_ap` target disables its own gdb
# port by default (src/target/mem_ap.c:53-54 on both v0.12.0 and master:
# `if (!target->gdb_port_override) target->gdb_port_override = strdup("disabled")`).
# The `-gdb-port` below overrides that.  What you get is NOT a debug session:
#
#   REAL     memory read, memory write, `load`
#   FICTION  every register (mem_ap_reg_get/set return ERROR_OK and touch
#            nothing), halt, step, resume and reset -- they report success
#            with ZERO bytes on the wire
#
# gdb must also be told to stop asking for registers mem_ap declares absent
# (mem_ap.c REG_EXIST(n) is n<16, but gdb's "arm" arch reads reg 25 = cpsr):
#
#   (gdb) set remote p-packet off
#   (gdb) set remote P-packet off
#   (gdb) target extended-remote :3333
#
# Without both, OpenOCD logs "gdb requested a non-existing register
# (reg_num=25)", drops the connection, and arm-none-eabi-gdb 10.3 aborts with
# an internal assertion.
#
# If all you need is to put firmware in memory, use hostio4-fake.cfg and
# `load_image` over telnet/tcl instead: same bytes, no fake-register surface.

adapter driver hostio4
hostio4_port  @PORT@
hostio4_base  0x00000000
hostio4_blocksize 16
hostio4_timeout 1000

transport select dapdirect_swd

swd newdap chip cpu -expected-id 0x00000000 -ignore-version
dap create chip.dap -chain-position chip.cpu

target create chip.ahb mem_ap -dap chip.dap -ap-num 0 -gdb-port 3333
