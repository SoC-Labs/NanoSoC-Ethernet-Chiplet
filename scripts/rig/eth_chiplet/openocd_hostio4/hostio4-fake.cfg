# OpenOCD config: nanoSoC ethernet chiplet over the HOSTIO4/ADP monitor.
#
# The ADP monitor cannot reach the Cortex-M PPB (no 0xE0/0xA0/0xB0 region in
# its AHB decoder), so the target here is the stock mem_ap, not cortex_m.

adapter driver hostio4
hostio4_port  @PORT@
hostio4_base  0x00000000
hostio4_blocksize 16
hostio4_timeout 1000

transport select dapdirect_swd

swd newdap chip cpu -expected-id 0x00000000 -ignore-version
dap create chip.dap -chain-position chip.cpu

target create chip.ahb mem_ap -dap chip.dap -ap-num 0
